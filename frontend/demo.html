                           onClick=${() => rateItem(it.id, it.rating === n ? null : n)}
                           title=${it.rating === n ? "点击清除评分" : ("评 " + n + " 分")}>${n}</button>`)}
                       ${it.rating != null && html`<span style=${{fontSize:12,color:"var(--accent-2)"}}>已评 ${it.rating} 分</span>`}
                     </div>
                    <div class="archive-links">
                      <a href=${outUrl(it.json) || ""} target="_blank" rel="noreferrer">归档 JSON</a>
                      ${it.local_file && html`<a href=${outUrl(it.local_file) || ""} target="_blank" rel="noreferrer">${it.local_file.endsWith(".md") ? "文字成品" : "图片成品"}</a>`}
                      ${it.text_file && it.text_file !== it.local_file && html`<a href=${outUrl(it.text_file) || ""} target="_blank" rel="noreferrer">文字成品</a>`}
                      ${it.image_url && /\.(png|jpe?g|gif|webp)$/i.test(it.image_url) && html`<a href=${outUrl(it.image_url) || ""} target="_blank" rel="noreferrer">图片成品</a>`}
                      ${it.id && html`<a href=${"/api/export/" + it.id + "/zip"} download>下载 ZIP</a>`}
                    </div>
                    <button class="save-btn" style=${{marginTop:"10px"}}
                      onClick=${() => { setSelected(it.mode); setTab("box"); runOpen(it.mode, it.seed); }}>用此 seed 重抽</button>
                  ` : html`<div class="hist-snippet">${(it.output || "").slice(0, 90)}</div>`}
                </div>`)}
            </div>
            ${history.length > 0 && html`
              <button class="save-btn" style=${{marginTop:"12px",background:"transparent",color:"var(--muted)"}} onClick=${loadHistory}>↻ 刷新</button>`}
          `}

          ${tab === "stats" && html`
            <div class="section-title">开盒统计</div>
            ${statsLoading && html`<div class="note">统计中…</div>`}
            ${stats ? html`
              <div class="stats-wrap">
                <div class="stats-cards">
                  <div class="stat-card"><div class="stat-num">${stats.total}</div><div class="stat-label">总开盒</div></div>
                  <div class="stat-card"><div class="stat-num">${Math.round(stats.success_rate * 100)}%</div><div class="stat-label">成功率</div></div>
                  <div class="stat-card"><div class="stat-num">${stats.favorites}</div><div class="stat-label">收藏</div></div>
                  <div class="stat-card"><div class="stat-num">${stats.avg_rating ?? "—"}</div><div class="stat-label">平均评分</div></div>
                </div>
                <div class="section-title">模式分布</div>
                <div class="stat-bars">
                  ${Object.entries(stats.by_mode || {}).map(([k, v]) => html`
                    <div class="stat-bar-row" key=${k}>
                      <span class="stat-bar-label">${modeName(k)}</span>
                      <div class="stat-bar-track"><div class="stat-bar-fill" style=${{width:(stats.total ? (v / stats.total) * 100 : 0) + "%"}} /></div>
                      <span class="stat-bar-num">${v}</span>
                    </div>`)}
                </div>
                <div class="section-title">模型使用（Top 8）</div>
                <div class="stat-bars">
                  ${Object.entries(stats.by_model || {}).slice(0, 8).map(([k, v]) => html`
                    <div class="stat-bar-row" key=${k}>
                      <span class="stat-bar-label" style=${{maxWidth:"45%"}}>${k}</span>
                      <div class="stat-bar-track"><div class="stat-bar-fill fill-alt" style=${{width:(stats.total ? (v / stats.total) * 100 : 0) + "%"}} /></div>
                      <span class="stat-bar-num">${v}</span>
                    </div>`)}
                </div>
                <div class="section-title">Token 用量</div>
                <div class="stats-cards">
                  <div class="stat-card"><div class="stat-num">${(stats.token_total?.total_tokens || 0).toLocaleString()}</div><div class="stat-label">累计 tokens</div></div>
                  ${stats.cost_total > 0 && html`
                    <div class="stat-card"><div class="stat-num">¥${stats.cost_total}</div><div class="stat-label">预估成本（¥${stats.tokens_price}/千token）</div></div>`}
                </div>
              </div>` : (!statsLoading && html`<div class="note">暂无统计数据。</div>`)}
          `}
          <//>
        </div>
      `;
    }

    try {
      render(html`<${App} />`, document.getElementById("root"));
    } catch (e) {
      console.error("Error rendering App:", e);
      document.getElementById("root").innerHTML = 
        '<p style="color:#e24b4a;padding:24px">渲染错误: ' + e.message + '</p>';
    }
  </script>
</body>
</html>
