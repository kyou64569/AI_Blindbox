<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI 盲盒（免构建演示）</title>
  <style>
    :root{
      --bg:#0f1115;--panel:#171a21;--panel-2:#1f232c;--border:#2a2f3a;
      --text:#e6e8ec;--muted:#9aa0aa;--accent:#7f77dd;--accent-2:#1d9e75;--danger:#e24b4a;
    }
    *{box-sizing:border-box}
    body{margin:0;font-family:-apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
      background:var(--bg);color:var(--text)}
    .app{max-width:980px;margin:0 auto;padding:24px 20px 64px}
    header.topbar{display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100;background:var(--bg);padding:12px 0 10px;margin-bottom:14px;border-bottom:1px solid var(--border)}
    header.topbar h1{font-size:22px;font-weight:600;margin:0}
    .tabs{display:flex;gap:8px}
    .tab{padding:6px 14px;border-radius:8px;cursor:pointer;background:var(--panel);
      border:1px solid var(--border);color:var(--muted);font-size:14px}
    .tab.active{background:var(--accent);color:#fff;border-color:var(--accent)}
    .section-title{font-size:15px;font-weight:600;margin:18px 0 10px}
    .mode-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:12px}
    .mode-card{background:var(--panel);border:1px solid var(--border);border-radius:12px;
      padding:16px;cursor:pointer;text-align:center;transition:.15s}
    .mode-card:hover{border-color:var(--accent)}
    .mode-card.selected{border-color:var(--accent);background:var(--panel-2)}
    .mode-card .name{font-size:16px;font-weight:600}
    .mode-card .desc{font-size:12px;color:var(--muted);margin-top:6px}
    .open-btn{margin-top:18px;width:100%;padding:14px;border-radius:12px;border:none;
      background:linear-gradient(90deg,var(--accent),var(--accent-2));color:#fff;
      font-size:16px;font-weight:600;cursor:pointer}
    .open-btn:disabled{opacity:.5;cursor:not-allowed}
    .result{margin-top:22px;background:var(--panel);border:1px solid var(--border);
      border-radius:12px;padding:18px}
    .result h3{margin:0 0 8px;font-size:14px;color:var(--accent)}
    .concept{white-space:pre-wrap;line-height:1.6;font-size:14px}
    .model-hint{font-size:12px;color:#888;margin-top:6px;opacity:.8}
    .plan{white-space:pre-wrap;line-height:1.6;font-size:13px;color:var(--muted);
      background:var(--panel-2);padding:12px;border-radius:8px;margin-top:8px}
    .seed-pill{display:inline-block;padding:2px 10px;border-radius:999px;background:var(--panel-2);
      border:1px solid var(--border);font-size:12px;color:var(--muted);margin-bottom:10px}
    .archive-box{margin-top:14px;padding:12px;border:1px dashed var(--accent);border-radius:10px;
      background:var(--panel-2)}
    .archive-badge{display:inline-block;color:var(--accent);font-weight:600;font-size:13px}
    .archive-time{display:inline-block;margin-left:10px;color:var(--muted);font-size:12px}
    .archive-links{margin-top:8px;display:flex;flex-wrap:wrap;gap:14px;font-size:13px}
    .archive-links a{color:var(--accent-2);text-decoration:underline}
    .archive-note{color:var(--muted);font-size:12px}
    .character-card{margin:8px auto 0;background:var(--panel-2);border:1px solid var(--border);
      border-radius:14px;overflow:hidden;max-width:480px;width:100%}
    .char-frame{width:100%;padding-top:100%;position:relative;background:#0b1220}
    .char-frame img{position:absolute;top:0;left:0;width:100%;height:100%;object-fit:cover}
    .char-fields{padding:14px 16px}
    .char-row{margin-bottom:8px}
    .char-row:last-child{margin-bottom:0}
    .char-label{font-size:11px;color:var(--accent);font-weight:600;letter-spacing:0.5px}
    .char-value{font-size:14px;color:var(--text);line-height:1.5;margin-top:2px}
    .config-form{background:var(--panel);border:1px solid var(--border);border-radius:12px;
      padding:18px;margin-top:12px}
    .form-row{display:flex;flex-direction:column;margin-bottom:14px}
    .form-row label{font-size:13px;color:var(--muted);margin-bottom:6px}
    .form-row input,.form-row select{background:var(--panel-2);border:1px solid var(--border);
      border-radius:8px;padding:8px 10px;color:var(--text);font-size:14px;font-family:inherit}
    .save-btn{padding:10px 18px;border-radius:8px;border:1px solid var(--accent);
      background:var(--accent);color:#fff;cursor:pointer;font-size:14px}
    .note{font-size:12px;color:var(--muted);margin-top:10px}
    .paths{font-size:12px;color:var(--muted);background:var(--panel-2);padding:10px;
      border-radius:8px;margin-top:10px;white-space:pre-line}
    .error{color:var(--danger);font-size:13px;margin-top:10px;white-space:pre-wrap;line-height:1.5}
    .banner{font-size:12px;color:var(--accent-2);background:var(--panel-2);
      padding:8px 12px;border-radius:8px;margin-bottom:14px}
    .hist-list{display:flex;flex-direction:column;gap:10px}
    .hist-item{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:14px}
    .hist-head{display:flex;align-items:center;gap:10px;cursor:pointer}
    .hist-mode{font-weight:600;font-size:14px}
    .hist-time{color:var(--muted);font-size:12px}
    .hist-kind{margin-left:auto;font-size:11px;color:var(--accent-2);
      background:var(--panel-2);padding:2px 8px;border-radius:999px}
    .hist-snippet{color:var(--muted);font-size:13px;margin-top:6px;
      white-space:pre-wrap;line-height:1.5;overflow:hidden;
      display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;line-clamp:2}
  </style>
</head>
<body>
  <div id="root"></div>

  <!-- 免构建：本地 vendor（preact + htm + hooks），无需联网 / 不依赖 CDN -->
  <script src="vendor/preact.umd.js"></script>
  <script src="vendor/htm.umd.js"></script>
  <script src="vendor/preact-hooks.umd.js"></script>
  <script>
    // 依赖缺失时给出明确提示，避免白屏
    if (typeof preact === "undefined" || typeof htm === "undefined" || typeof preactHooks === "undefined") {
      document.getElementById("root").innerHTML =
        '<p style="color:#e24b4a;padding:24px">前端依赖未加载：请确认 frontend/vendor/ 下的 preact.umd.js、htm.umd.js、preact-hooks.umd.js 存在。<br>preact: ' + typeof preact + '<br>htm: ' + typeof htm + '<br>preactHooks: ' + typeof preactHooks + '</p>';
      throw new Error("vendor missing");
    }
    
    const { h, render } = preact;
    const { useState, useEffect, useRef } = preactHooks;
    const html = htm.bind(h);

    // ---- 沙箱 iframe 高度自适应 ----
    // quiz/game 的 iframe 使用 sandbox="allow-scripts"（不含 allow-same-origin）以保留 origin 隔离，
    // 父页面因此无法读取其 contentDocument；改由子页面 postMessage 上报高度
    // （上报脚本由后端 _inject_height_reporter 注入）。
    // 通过 event.source 反查是页面上的哪个 iframe，避免信任任意来源的消息。
    window.addEventListener("message", (e) => {
      const height = Number(e.data && e.data.__blindbox_height);
      if (!Number.isFinite(height) || height <= 0) return;
      // 封顶：iframe 最高不超过视口的 1.5 倍，超出部分由 iframe 自身内部滚动。
      // 否则游戏若无限追加 DOM（LLM 常见），外层页面会被撑到无限长、永远滚不到底。
      const CAP = Math.max(800, Math.floor(window.innerHeight * 1.5));
      for (const frame of document.querySelectorAll("iframe[data-blindbox]")) {
        if (frame.contentWindow === e.source) {
          const min = frame.dataset.blindbox === "quiz" ? 400 : 520;
          frame.style.height = Math.min(CAP, Math.max(min, height + 20)) + "px";
          frame.style.overflow = "auto";
          break;
        }
      }
    });

    function App() {
      const [tab, setTab] = useState("box");
      const [modes, setModes] = useState([]);
      const [selected, setSelected] = useState(null);
      const [loading, setLoading] = useState(false);
      const [result, setResult] = useState(null);
      const [error, setError] = useState(null);
      const [config, setConfig] = useState(null);
      const [paths, setPaths] = useState({});
      const [saved, setSaved] = useState(false);
      const [poolUI, setPoolUI] = useState({ addText: {}, gen: {}, genErr: {} });
      const initialPoolRef = useRef(null);
      const [voices, setVoices] = useState({ edge: [], cloud: [], current: "" });
      const [history, setHistory] = useState([]);
      const [histLoading, setHistLoading] = useState(false);
      const [histError, setHistError] = useState(null);
      const [expandedId, setExpandedId] = useState(null);

      useEffect(() => {
        fetch("/api/modes").then(r => r.json()).then(d => {
          setModes(d.modes || []);
          if (d.modes && d.modes.length) setSelected(d.modes[0].id);
        }).catch(e => setError("加载模式失败: " + e.message));
        fetch("/api/config").then(r => r.json()).then(d => {
          setConfig(d.config); setPaths(d.paths || {});
          if (initialPoolRef.current === null) initialPoolRef.current = d.config?.randomness?.pool || {};
        }).catch(() => {});
        // Load available TTS voices
        fetch("/api/tts/voices").then(r => r.json()).then(d => {
          setVoices({ edge: d.edge || [], cloud: d.cloud || [], current: d.current || "" });
        }).catch(() => {});
      }, []);

      const runOpen = async (modeId, seed) => {
        const m = modeId || selected;
        if (!m) return;
        setLoading(true); setError(null);
        const ctrl = new AbortController();
        // 兜底超时 9分40秒（略小于代理层的 10 分钟），避免极端情况下请求永久挂起
        const timer = setTimeout(() => ctrl.abort(), 720000);
        try {
          const resp = await fetch("/api/open", {
            method: "POST", headers: { "Content-Type": "application/json" },
            body: JSON.stringify(seed ? { mode: m, seed } : { mode: m }),
            signal: ctrl.signal,
          });
          const data = await resp.json();
          if (!resp.ok) throw new Error(data.detail || "开盲盒失败");
          setResult(data);
        } catch (e) {
          if (e.name === "AbortError") {
            setError("请求超时：生成任务耗时较长（漫画/视频等复杂内容需要较长时间），请稍后重试。");
          } else if (e.message === "Failed to fetch") {
            setError("与服务器连接中断（长连接可能被网络/代理重置）。请确认前后端服务正常后重试。");
          } else {
            setError("开盲盒失败: " + e.message);
          }
        } finally {
          clearTimeout(timer);
          setLoading(false);
        }
      };
      const openBox = () => runOpen(selected);

      // 已下线模式的兜底名称（历史记录仍显示可读名）
      const LEGACY_MODE_NAMES = { novella: "中篇播客（已合并）", longpod: "长播客（已合并）" };
      const modeName = (id) => (modes.find(m => m.id === id)?.name || LEGACY_MODE_NAMES[id] || id || "");

      // 把 output 目录内的相对文件名转成可安全放进 href/src 的 URL。
      // 逐段 encodeURIComponent：产物名由提示词生成（中文/空格/#/%/&），
      // 直接 "/output/" + name 会被浏览器把 # 之后当锚点丢掉（output/ 里确有含 # 的文件）。
      const outUrl = (name) => {
        if (typeof name !== "string") return null;
        const raw = name.trim().replace(/\\/g, "/");
        if (!raw) return null;
        if (raw.startsWith("/") || /^[a-zA-Z]:\//.test(raw) || raw.split("/").includes("..")) return null;
        return "/output/" + raw.split("/").map(encodeURIComponent).join("/");
      };

      // 解析图片/视频成品的可渲染地址：
      // 归档后后端会把 output 改写为本地相对文件名（如 asset_xxx.png，无 /output/ 前缀），
      // 此时必须读取 archived.local_file 并补 /output/ 前缀；否则就当纯文本显示。
      const mediaSrc = (r) => {
        if (!r) return null;
        if (r.archived && r.archived.local_file) return outUrl(r.archived.local_file);
        const o = r.output || "";
        if (/^https?:\/\//.test(o)) return o;
        if (o.startsWith("/output/")) return outUrl(o.slice("/output/".length)) || o;
        // 裸相对文件名（output 目录内）——自动补 /output/ 也能渲染
        if (o && !/^[a-zA-Z]:[\\/]/.test(o) && !o.startsWith("/")) return outUrl(o);
        return null; // 无法渲染 -> 退回纯文本
      };
      // 角色卡：解析 "Name | xxx" 或 "Name: xxx" 格式的结构化文本 → [{label, value}]
      const parseCharFields = (text) => {
        if (!text) return [];
        return text.split("\n").map(l => l.trim()).filter(Boolean).map(line => {
          // "Name | value" 或 "Name: value" 或 【Name】value
          const m = line.match(/^(?:【|[\[])?\s*(.+?)\s*(?:】|[\]]?)\s*[:|：]\s*(.+)/);
          if (m) return { label: m[1].trim(), value: m[2].trim() };
          return { label: "", value: line };
        }).filter(f => f.value);
      };
      // spec 章节提取：【环境依赖清单】/【磁盘占用预估】等，取到下一个【章节】或结尾
      const extractSection = (text, name) => {
        if (!text) return "";
        const re = new RegExp("【" + name + "】([\\s\\S]*?)(?=【|$)", "i");
        const m = text.match(re);
        return m ? m[1].trim().replace(/\n{3,}/g, "\n\n").slice(0, 300) : "";
      };
      // 环境成本卡：代码模式 spec 展示区下方的依赖/磁盘预估 + 黑名单警告
      const envCostCard = (r) => {
        if (!r || r.output_kind !== "spec_md") return null;
        const plan = r.plan || "";
        const warn = r.env_warning || "";
        const dep = extractSection(plan, "环境依赖清单");
        const size = extractSection(plan, "磁盘占用预估");
        const rows = [];
        if (warn) rows.push(html`
          <div style=${{ marginTop: "10px", padding: "10px 12px", background: "rgba(227,75,74,0.12)", border: "1px solid rgba(227,75,74,0.5)", borderRadius: "10px", color: "#f09595", fontSize: 13, lineHeight: 1.6, whiteSpace: "pre-wrap" }}>
            ${warn}
          </div>`);
        if (dep || size) rows.push(html`
          <div style=${{ marginTop: "10px", padding: "12px 14px", background: "var(--panel-2)", border: "1px solid var(--border)", borderRadius: "10px", fontSize: 13, lineHeight: 1.7 }}>
            <div style=${{ fontSize: 12, color: "var(--accent, #7f77dd)", fontWeight: 600, marginBottom: 6, letterSpacing: 0.5 }}>环境成本</div>
            ${dep ? html`<div style=${{ color: "var(--muted)" }}>依赖：${dep}</div>` : ""}
            ${size ? html`<div style=${{ color: "var(--muted)", marginTop: 4 }}>磁盘：${size}</div>` : ""}
          </div>`);
        return rows.length ? rows : null;
      };
      const loadHistory = async () => {
        setHistLoading(true); setHistError(null);
        try {
          const resp = await fetch("/api/history?limit=100");
          const data = await resp.json();
          if (!resp.ok) throw new Error(data.detail || "加载历史失败");
          setHistory(data.items || []);
        } catch (e) { setHistError("加载历史失败: " + e.message); }
        finally { setHistLoading(false); }
      };

      const save = async () => {
        setError(null);
        try {
          const resp = await fetch("/api/config", {
            method: "POST", headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ config }),
          });
          if (!resp.ok) throw new Error("保存失败");
          setSaved(true);
          // Reload voices after save to reflect the new config
          fetch("/api/tts/voices").then(r => r.json()).then(d => {
            setVoices({ edge: d.edge || [], cloud: d.cloud || [], current: d.current || "" });
          }).catch(() => {});
        } catch (e) { setError("保存失败: " + e.message); }
      };

      const update = (path, value) => {
        setConfig(prev => {
          // prev 为 null（配置还没加载完用户就操作）时直接跳过，避免 JSON.stringify(null) -> "null"
          if (!prev || typeof prev !== "object") return prev;
          const next = JSON.parse(JSON.stringify(prev));
          const keys = path.split(".");
          let node = next;
          for (let i = 0; i < keys.length - 1; i++) {
            const k = keys[i];
            // 中间层缺失或不是对象时按需创建：原实现直接 node = node[k]，
            // 一旦某层不存在，下一轮就是 undefined[k] -> TypeError，整个面板白屏。
            // 下一段 key 是纯数字则建数组，否则建对象。
            if (node[k] === null || typeof node[k] !== "object") {
              node[k] = /^\d+$/.test(keys[i + 1]) ? [] : {};
            }
            node = node[k];
          }
          node[keys[keys.length - 1]] = value;
          return next;
        });
        setSaved(false);
      };

      // ---- twist pool 编辑器（推荐混合方案：4 维可手动增删改 + 🎲 大模型生成） ----
      const poolDims = ["theme", "style", "constraint", "twist"];
      const dimCn = { theme: "主题", style: "风格", constraint: "约束", twist: "反转" };
      const getPool = (dim) => (config?.randomness?.pool?.[dim] || []);

      const editItem = (dim, idx, val) => {
        const arr = [...getPool(dim)];
        arr[idx] = val;
        update(`randomness.pool.${dim}`, arr);
      };
      const removeItem = (dim, idx) => {
        update(`randomness.pool.${dim}`, getPool(dim).filter((_, i) => i !== idx));
      };
      const addItem = (dim) => {
        const v = (poolUI.addText?.[dim] || "").trim();
        if (!v) return;
        if (getPool(dim).includes(v)) {  // 去重校验
          setPoolUI(s => ({ ...s, addText: { ...s.addText, [dim]: "" } }));
          return;
        }
        update(`randomness.pool.${dim}`, [...getPool(dim), v]);
        setPoolUI(s => ({ ...s, addText: { ...s.addText, [dim]: "" } }));
      };
      const genSeed = async (dim) => {
        setPoolUI(s => ({ ...s, gen: { ...s.gen, [dim]: true }, genErr: { ...s.genErr, [dim]: null } }));
        try {
          const resp = await fetch("/api/generate-seed", {
            method: "POST", headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ dimension: dim, existing: getPool(dim) }),
          });
          const data = await resp.json();
          if (!resp.ok) throw new Error(data.detail || "生成失败");
          const v = (data.seed || "").trim();
          if (!v) throw new Error("模型返回为空");
          if (!getPool(dim).includes(v)) update(`randomness.pool.${dim}`, [...getPool(dim), v]);
        } catch (e) {
          setPoolUI(s => ({ ...s, genErr: { ...s.genErr, [dim]: e.message } }));
        } finally {
          setPoolUI(s => ({ ...s, gen: { ...s.gen, [dim]: false } }));
        }
      };
      const resetPool = () => {
        if (initialPoolRef.current) update("randomness.pool", JSON.parse(JSON.stringify(initialPoolRef.current)));
      };
      const refreshAllSeeds = async () => {
        setRefreshingAll(true); setRefreshErr(null);
        try {
          const resp = await fetch("/api/seed/refresh-all", { method: "POST" });
          const data = await resp.json();
          if (!resp.ok) throw new Error(data.detail || "刷新失败");
          update("randomness.pool", data.pool);
        } catch (e) {
          setRefreshErr(e.message);
        } finally {
          setRefreshingAll(false);
        }
      };
      const [refreshingAll, setRefreshingAll] = useState(false);
      const [refreshErr, setRefreshErr] = useState(null);

      // ---- code 模式独立工具池（与全局池同能力：手动增删 + 🎲 生成 + 整体刷新） ----
      const codeModeIdx = () => { const ms = config?.modes || []; return ms.findIndex(m => m.id === "code"); };
      const getModePool = (dim) => { const i = codeModeIdx(); return (i >= 0 && config?.modes?.[i]?.pool?.[dim]) || []; };
      const [modePoolUI, setModePoolUI] = useState({ addText: {}, gen: {}, genErr: {} });
      const [modeRefreshing, setModeRefreshing] = useState(false);
      const [modeRefreshErr, setModeRefreshErr] = useState(null);
      const modePoolPath = (dim) => {
        const idx = codeModeIdx();
        if (idx < 0) return null;
        return `modes.${idx}.pool.${dim}`;
      };
      const editModeItem = (dim, idx, val) => {
        const path = modePoolPath(dim);
        if (!path) return;
        const arr = [...getModePool(dim)];
        arr[idx] = val;
        update(path, arr);
      };
      const removeModeItem = (dim, idx) => {
        const path = modePoolPath(dim);
        if (!path) return;
        update(path, getModePool(dim).filter((_, i) => i !== idx));
      };
      const addModeItem = (dim) => {
        const path = modePoolPath(dim);
        if (!path) return;
        const v = (modePoolUI.addText?.[dim] || "").trim();
        if (!v || getModePool(dim).includes(v)) return;
        update(path, [...getModePool(dim), v]);
        setModePoolUI(s => ({ ...s, addText: { ...s.addText, [dim]: "" } }));
      };
      const genModeSeed = async (dim) => {
        setModePoolUI(s => ({ ...s, gen: { ...s.gen, [dim]: true }, genErr: { ...s.genErr, [dim]: null } }));
        try {
          const resp = await fetch("/api/generate-seed", {
            method: "POST", headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ dimension: dim, existing: getModePool(dim), mode_id: "code" }),
          });
          const data = await resp.json();
          if (!resp.ok) throw new Error(data.detail || "生成失败");
          const v = (data.seed || "").trim();
          if (!v) throw new Error("模型返回为空");
          const path = modePoolPath(dim);
          if (path && !getModePool(dim).includes(v)) update(path, [...getModePool(dim), v]);
        } catch (e) {
          setModePoolUI(s => ({ ...s, genErr: { ...s.genErr, [dim]: e.message } }));
        } finally {
          setModePoolUI(s => ({ ...s, gen: { ...s.gen, [dim]: false } }));
        }
      };
      const refreshModeSeeds = async () => {
        const idx = codeModeIdx();
        if (idx < 0) return;
        setModeRefreshing(true); setModeRefreshErr(null);
        try {
          const resp = await fetch("/api/seed/refresh-all", {
            method: "POST", headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ mode_id: "code" }),
          });
          const data = await resp.json();
          if (!resp.ok) throw new Error(data.detail || "刷新失败");
          update(`modes.${idx}.pool`, data.pool);
        } catch (e) {
          setModeRefreshErr(e.message);
        } finally {
          setModeRefreshing(false);
        }
      };

      // 每个模型槽位的「获取模型列表」状态：以 basePath 为 key 存 {models, fetching, err}
      const [slotState, setSlotState] = useState({});
      const fetchModels = async (basePath, keyMap) => {
        setSlotState(s => ({ ...s, [basePath]: { ...(s[basePath]||{}), fetching: true, err: null } }));
        try {
          // 嵌套解析 basePath（如 "agents.creative"），避免 config["agents.creative"] 直接索引为 undefined
          const resolve = (path, obj) => path.split(".").reduce((acc, k) => (acc && acc[k] !== undefined ? acc[k] : undefined), obj) || {};
          const node = resolve(basePath, config);
          const body = {
            base_url: node[keyMap.base_url] || config.global?.default_base_url || "",
            api_key: node[keyMap.api_key] || config.global?.default_api_key || "",
          };
          const resp = await fetch("/api/models", {
            method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body),
          });
          const data = await resp.json();
          if (!resp.ok) throw new Error(data.detail || "获取失败");
          setSlotState(s => ({ ...s, [basePath]: { models: data.models || [], fetching: false, err: null } }));
        } catch (e) {
          setSlotState(s => ({ ...s, [basePath]: { ...(s[basePath]||{}), fetching: false, err: e.message } }));
        }
      };

      // 渲染一个模型配置组（base_url + api_key + 模型下拉/手填）
      // ---- 模型/音色选择器：有选项列表时用 <select>（可随时改选）；下拉恒含「自定义…」项，
      // 选择后显示手填输入框（保留自由输入）；无列表时退化为单个普通输入框 ----
      const [customSel, setCustomSel] = useState({});
      const picker = ({ key, value, options, onPick, placeholder, emptyLabel }) => {
        const v = (value || "").trim();
        const opts = options || [];
        if (opts.length === 0) {
          return html`<input value=${v} placeholder=${placeholder || "手填"} onInput=${e => onPick(e.target.value)} style=${{ flex: 1 }} />`;
        }
        const inList = opts.includes(v);
        const isCustom = !!customSel[key];
        const effective = isCustom || (v !== "" && !inList);
        const selValue = effective ? "__custom__" : v;
        return html`
          <div style=${{ display: "flex", gap: "6px", flex: 1, minWidth: 0 }}>
            <select value=${selValue}
              onInput=${e => { const sv = e.target.value; if (sv === "__custom__") { setCustomSel(m => ({ ...m, [key]: true })); } else { setCustomSel(m => ({ ...m, [key]: false })); onPick(sv); } }}
              style=${{ flex: 1, minWidth: 0, height: "36px", background: "var(--panel-2)", color: "var(--text)", border: "1px solid var(--border)", borderRadius: "8px", padding: "0 8px", fontSize: 13 }}>
              ${!effective && v === "" ? html`<option value="">${emptyLabel || "（留空）"}</option>` : ""}
              <option value="__custom__">（自定义…）</option>
              ${opts.map(o => html`<option value=${o} selected=${o === v}>${o}</option>`)}
            </select>
            ${effective ? html`<input value=${v} placeholder=${placeholder || "自定义"} onInput=${e => { const newValue = e.target.value; onPick(newValue); if (opts.includes(newValue.trim())) { setCustomSel(m => ({ ...m, [key]: false })); } }} style=${{ flex: 1 }} />` : ""}
          </div>`;
      };

      const renderModelSlot = ({ title, basePath, keyMap, config, update }) => {
        // 嵌套解析 basePath（如 "agents.creative"），避免 config["agents.creative"] 直接索引为 undefined
        const node = basePath.split(".").reduce((acc, k) => (acc && acc[k] !== undefined ? acc[k] : undefined), config) || {};
        const st = slotState[basePath] || {};
        const getv = k => node[keyMap[k]] || "";
        const setv = (k, v) => update(basePath + "." + keyMap[k], v);
        return html`
          <div class="section-title">${title}</div>
          <div class="config-form">
            <div class="form-row"><label>API Base URL</label>
              <input value=${getv("base_url")} onInput=${e => setv("base_url", e.target.value)} placeholder="留空=用全局默认" /></div>
            <div class="form-row"><label>API Key</label>
              <input type="password" value=${getv("api_key")} onInput=${e => setv("api_key", e.target.value)} placeholder="留空=用全局默认" /></div>
            <div class="form-row"><label>模型 model（填好上方 base_url / key 后可点按钮拉取列表选择）</label>
              <div style=${{display:"flex", gap:"8px"}}>
                ${picker({ key: "slot-" + basePath, value: getv("model"), options: st.models || [], onPick: v => setv("model", v),
                  placeholder: "留空=用全局默认；或从下拉选 / 手填", emptyLabel: "（留空=用全局默认）" })}
                <button type="button" class="save-btn" style=${{padding:"8px 12px", whiteSpace:"nowrap"}}
                  disabled=${st.fetching} onClick=${() => fetchModels(basePath, keyMap)}>
                  ${st.fetching ? "获取中…" : "获取模型列表"}
                </button>
              </div>
              ${(st.models||[]).length > 0 && html`<div class="note">已获取 ${st.models.length} 个模型，点下拉可随时改选。</div>`}
              ${st.err && html`<div class="error">${st.err}</div>`}
            </div>
          </div>`;
      };

      // ---- 多模型卡片列表编辑器：折叠 / 手动排序↑↓ / 删除(无确认) / 新增 / 空提示 ----
      // 每个 section（如 agents.creative）在 config 中对应一个 models: [] 卡片数组，
      // 运行时按序 fallback（上一个失败自动用下一个）。折叠状态用 localStorage 持久化。
      const KNOWN_MODEL_SECTIONS = ["agents.creative","agents.planner","agents.executor","providers.image","providers.video","providers.tts","providers.game"];
      const [collapseMap, setCollapseMap] = useState({});
      useEffect(() => {
        const m = {};
        KNOWN_MODEL_SECTIONS.forEach(bp => {
          const k = "mf:collapse:" + bp;
          let v = false;
          try { v = localStorage.getItem(k) === "1"; } catch (e) { v = false; }
          m[k] = v;
        });
        setCollapseMap(m);
      }, []);
      const isCollapsed = (basePath) => !!collapseMap["mf:collapse:" + basePath];
      const toggleCollapse = (basePath) => {
        const k = "mf:collapse:" + basePath;
        const nv = !isCollapsed(basePath);
        try { localStorage.setItem(k, nv ? "1" : "0"); } catch (e) {}
        setCollapseMap(m => ({ ...m, [k]: nv }));
      };
      const resolvePath = (path, obj) =>
        path.split(".").reduce((acc, k) => (acc && acc[k] !== undefined ? acc[k] : undefined), obj) || {};
      const getModelsList = (basePath) => {
        const node = resolvePath(basePath, config);
        return (node && Array.isArray(node.models)) ? node.models : [];
      };

      const renderModelCard = (basePath, idx, card, total) => {
        const cardPath = basePath + ".models." + idx;
        const st = slotState[cardPath] || {};
        const getv = (k) => (card && card[k] != null) ? card[k] : "";
        const setv = (k, v) => update(cardPath + "." + k, v);
        const swap = (dir) => {
          const arr = getModelsList(basePath);
          const j = idx + dir;
          if (j < 0 || j >= arr.length) return;
          const next = [...arr];
          const t = next[idx]; next[idx] = next[j]; next[j] = t;
          update(basePath + ".models", next);
        };
        const del = () => {
          // 删除无需确认，直接移除该卡片
          const arr = getModelsList(basePath);
          update(basePath + ".models", arr.filter((_, i) => i !== idx));
        };
        const tv = getv("temperature");
        return html`
          <div key=${card._id || idx} class="config-form" style=${{ marginTop:"10px", border:"1px solid var(--border)", borderRadius:"10px", padding:"12px" }}>
            <div style=${{ display:"flex", justifyContent:"space-between", alignItems:"center", marginBottom:"6px" }}>
              <div class="note" style=${{ margin:0 }}>模型 #${idx + 1}</div>
              <div style=${{ display:"flex", gap:"6px" }}>
                <button type="button" class="save-btn" style=${{ padding:"4px 8px", background:"transparent", color:"var(--muted)", borderColor:"var(--border)" }}
                  disabled=${idx === 0} onClick=${() => swap(-1)} title="上移">↑</button>
                <button type="button" class="save-btn" style=${{ padding:"4px 8px", background:"transparent", color:"var(--muted)", borderColor:"var(--border)" }}
                  disabled=${idx === total - 1} onClick=${() => swap(1)} title="下移">↓</button>
                <button type="button" class="save-btn" style=${{ padding:"4px 8px", background:"var(--danger)", borderColor:"var(--danger)" }}
                  onClick=${del} title="删除（无确认）">删除</button>
              </div>
            </div>
            <div class="form-row"><label>模型 model</label>
              <div style=${{ display:"flex", gap:"8px" }}>
                ${picker({ key: "card-" + cardPath, value: getv("model"), options: st.models || [], onPick: v => setv("model", v),
                  placeholder: "模型名，如 gpt-4o-mini-tts", emptyLabel: "（手填）" })}
                <button type="button" class="save-btn" style=${{ padding:"8px 12px", whiteSpace:"nowrap" }}
                  disabled=${st.fetching} onClick=${() => fetchModels(cardPath, { model:"model", base_url:"base_url", api_key:"api_key" })}>
                  ${st.fetching ? "获取中…" : "获取列表"}</button>
              </div>
              ${(st.models || []).length > 0 && html`<div class="note">已获取 ${st.models.length} 个模型，点下拉可随时改选。</div>`}
              ${st.err && html`<div class="error">${st.err}</div>`}
            </div>
            <div class="form-row"><label>API Base URL</label>
              <input value=${getv("base_url")} onInput=${e => setv("base_url", e.target.value)} placeholder="留空=用全局默认" /></div>
            <div class="form-row"><label>API Key</label>
              <input type="password" value=${getv("api_key")} onInput=${e => setv("api_key", e.target.value)} placeholder="留空=用全局默认" /></div>
            <div class="form-row"><label>温度 temperature（可选，留空=用全局/默认）</label>
              <input type="number" step="0.1" value=${tv === "" || tv == null ? "" : tv}
                onInput=${e => setv("temperature", e.target.value === "" ? null : Number(e.target.value))} placeholder="如 0.8" /></div>
          </div>`;
      };

      const renderModelCards = ({ title, basePath, note }) => {
        const models = getModelsList(basePath);
        const collapsed = isCollapsed(basePath);
        const add = () => update(basePath + ".models", [...models, { _id: "card_" + Math.random().toString(36).slice(2), model:"", base_url:"", api_key:"", temperature:null }]);
        return html`
          <div class="section-title">${title}</div>
          ${note && html`<div class="note" style=${{ marginBottom: 8 }}>${note}</div>`}
          <div class="config-form">
            <div style=${{ display:"flex", justifyContent:"space-between", alignItems:"center" }}>
              <div class="note" style=${{ margin:0 }}>${models.length} 个模型 · 运行时按序 fallback（上一个失败自动用下一个）</div>
              <button type="button" class="save-btn" style=${{ padding:"6px 12px", background:"transparent", color:"var(--accent)", borderColor:"var(--accent)" }}
                onClick=${() => toggleCollapse(basePath)}>${collapsed ? "展开" : "折叠"}</button>
            </div>
            ${collapsed
              ? html`<div class="note">已折叠（共 ${models.length} 个模型）。点击「展开」编辑。</div>`
              : models.length === 0
                ? html`<div class="note" style=${{ color:"var(--muted)" }}>暂无模型卡片。若留空：Agent 执行回退全局默认模型；Provider 图片/视频回退另一 Provider 置顶项；TTS 回退免费 Edge TTS。</div>`
                : models.map((card, idx) => renderModelCard(basePath, idx, card, models.length))}
            <button type="button" class="save-btn" style=${{ marginTop:"8px" }} onClick=${add}>+ 添加模型</button>
          </div>`;
      };

      const g = config?.global || {};
      const rnd = config?.randomness || {};
      const tp = config?.providers?.tts || {};

      return html`
        <div class="app">
          <header class="topbar">
            <h1>AI 盲盒</h1>
            <div class="tabs">
              <div class=${"tab " + (tab === "box" ? "active" : "")} onClick=${() => setTab("box")}>开盲盒</div>
              <div class=${"tab " + (tab === "history" ? "active" : "")} onClick=${() => { setTab("history"); loadHistory(); }}>历史</div>
              <div class=${"tab " + (tab === "config" ? "active" : "")} onClick=${() => setTab("config")}>配置</div>
            </div>
          </header>
          <div class="banner">免构建演示页：用 preact + htm（已打包到本地 frontend/vendor，无需联网），无需 npm install。生产版请用 Vite 工程（npm install 后 npm run dev）。</div>

          ${tab === "box" && html`
            <div class="section-title">选择模式</div>
            <div class="mode-grid">
              ${modes.map(m => html`
                <div key=${m.id} class=${"mode-card " + (selected === m.id ? "selected" : "")}
                     onClick=${() => setSelected(m.id)}>
                  <div class="name">${m.name}</div>
                  <div class="desc">${m.executor_type}</div>
                </div>`)}
            </div>
            <button class="open-btn" disabled=${loading || !selected} onClick=${openBox}>
              ${loading ? "开启中…" : "🎁 开启盲盒"}
            </button>
            ${error && html`<div class="error">${error}</div>`}
            ${result && html`
              <div class="result">
                <div class="seed-pill">seed: ${result.seed}</div>
                <h3>概念卡（创意 Agent）</h3>
                <div class="concept">${result.concept}</div>
                <h3>规划输出（规划 Agent）</h3>
                <div class="plan">${result.plan}</div>
                <h3>成品</h3>
                ${result.output_kind === "text" && html`<div class="concept">${result.output}</div>`}
                ${result.output_kind === "character_card" && html`
                  <div class="character-card">
                    ${result.image_url && html`
                      <div class="char-frame">
                        <img src=${mediaSrc({output: result.image_url})} alt="avatar" />
                      </div>`}
                    <div class="char-fields">
                      ${parseCharFields(result.output).map(f => html`
                        <div class="char-row">
                          <div class="char-label">${f.label}</div>
                          <div class="char-value">${f.value}</div>
                        </div>`)}
                    </div>
                  </div>`}
                ${result.output_kind === "spec_md" && html`<div class="plan">已生成 spec：<br/><code>${result.output}</code></div>${envCostCard(result)}`}
                ${result.output_kind === "image_url" && html`
                  ${mediaSrc(result)
                    ? (["recipe","tarot","character"].includes(result.mode)
                        ? html`<div style=${{display:"flex",flexDirection:"column",alignItems:"center",marginTop:"8px"}}>
                            <img src=${mediaSrc(result)} style=${{maxWidth:"480px",width:"100%",height:"auto",objectFit:"contain",borderRadius:"12px",display:"block",background:"var(--panel-2)"}} alt="result" />
                            ${result.caption ? html`<div style=${{maxWidth:"480px",width:"100%",marginTop:"10px",padding:"12px 14px",boxSizing:"border-box",background:"var(--panel-2)",border:"1px solid var(--border)",borderRadius:"12px",color:"var(--text)",fontSize:14,lineHeight:1.7,whiteSpace:"pre-wrap",wordBreak:"break-word",textAlign:"left",textShadow:"none"}}>${result.caption}</div>` : null}
                          </div>`
                        : html`<div style=${{position:"relative",display:"inline-block",maxWidth:"100%"}}>
                            <img src=${mediaSrc(result)} style=${{maxWidth:"100%",borderRadius:"12px",marginTop:"8px",display:"block"}} alt="result" />
                            ${result.caption ? html`<div style=${{position:"absolute",left:0,right:0,bottom:0,padding:"10px 12px",borderRadius:"0 0 12px 12px",color:"#fff",background:"linear-gradient(0deg, rgba(0,0,0,0.75), rgba(0,0,0,0))",fontSize:20,fontWeight:700,textAlign:"center",textShadow:"0 1px 3px rgba(0,0,0,0.5)"}}>${result.caption}</div>` : null}
                          </div>`)
                    : html`<div class="plan">${result.output}</div>`}`}
                ${result.output_kind === "video_file" && html`
                  ${mediaSrc(result)
                    ? html`<video src=${mediaSrc(result)} controls style=${{maxWidth:"100%",borderRadius:"12px",marginTop:"8px"}}></video>`
                    : html`<div class="plan">${result.output}</div>`}`}
                ${result.output_kind === "audio_file" && html`
                  ${mediaSrc(result)
                    ? html`<audio src=${mediaSrc(result)} controls preload="metadata" style=${{width:"100%",borderRadius:"12px",marginTop:"8px"}}></audio>`
                    : html`<div class="plan">${result.output}</div>`}`}
                ${(result.output_kind === "game_html" || result.output_kind === "quiz_html") && html`
                  ${mediaSrc(result)
                    ? html`<iframe src=${mediaSrc(result)} sandbox="allow-scripts" data-blindbox=${result.output_kind === "quiz_html" ? "quiz" : "game"} title=${result.output_kind === "quiz_html" ? "趣味测试" : "小游戏"} style=${{width:"100%",height:result.output_kind === "quiz_html" ? "650px" : "520px",border:"0",borderRadius:"12px",marginTop:"8px",display:"block"}}></iframe>`
                    : html`<div class="plan">${result.output}</div>`}
                  <div class="note" style=${{marginTop:"6px"}}>${result.output_kind === "quiz_html" ? "📝 趣味测试（逐题作答，完成后查看结果）" : "🎮 小游戏（点击操作；沙箱隔离运行）"}</div>`}
                ${result.output_kind === "song" && (() => {
                  let audio = "", lyrics = "", ttsInfo = "";
                  try {
                    const parsed = JSON.parse(result.output || "{}");
                    audio = parsed.audio || "";
                    lyrics = parsed.lyrics || "";
                    ttsInfo = parsed.tts_info || "";
                  } catch (e) { console.error("[demo] song parse:", e); }
                  const audioSrc = (() => {
                    if (!audio) return null;
                    if (/^https?:\/\//i.test(audio)) return audio;
                    if (audio.startsWith("/output/")) return outUrl(audio.slice("/output/".length)) || audio;
                    if (audio && !/^[a-zA-Z]:[\\/]/.test(audio) && !audio.startsWith("/")) return outUrl(audio);
                    return null;
                  })();
                  return html`
                    <div style=${{marginTop:8}}>
                      <div style=${{background:"var(--panel-2)",border:"1px solid var(--border)",borderRadius:14,padding:"16px 18px",whiteSpace:"pre-wrap",lineHeight:1.8,fontSize:15,color:"var(--text)",fontFamily:'"PingFang SC","Microsoft YaHei",serif',letterSpacing:0.5}}>
                        ${lyrics || "（歌词为空）"}
                      </div>
                      ${audioSrc && html`<audio src=${audioSrc} controls preload="metadata" style=${{width:"100%",borderRadius:"12px",marginTop:10,display:"block"}}></audio>`}
                      ${ttsInfo && html`<div style=${{marginTop:4,fontSize:12,color:"var(--muted)"}}>${ttsInfo}</div>`}
                    </div>`;
                })()}
                ${result.output_kind === "image_strip" && (() => {
                  let pages = [];
                  try {
                    const parsed = JSON.parse(result.output || "{}");
                    if (Array.isArray(parsed.pages)) pages = parsed.pages;
                  } catch (e) { console.error("[demo] image_strip parse:", e); }
                  if (pages.length === 0) return html`<div class="plan">（插画故事生成中，未获取到图片）</div>`;
                  return html`
                    <div style=${{display:"flex",gap:10,overflowX:"auto",padding:"8px 0",marginTop:8,scrollSnapType:"x mandatory"}}>
                      ${pages.map((p, i) => {
                        const src = (() => {
                          if (p.local) return outUrl(p.local);
                          const u = p.url || "";
                          if (/^https?:\/\//i.test(u)) return u;
                          if (u.startsWith("/output/")) return outUrl(u.slice("/output/".length)) || u;
                          if (u && !/^[a-zA-Z]:[\\/]/.test(u) && !u.startsWith("/")) return outUrl(u);
                          return null;
                        })();
                        return html`
                          <div key=${i} style=${{flex:"0 0 auto",width:"75%",maxWidth:400,scrollSnapAlign:"start",borderRadius:12,overflow:"hidden",background:"#0b1220"}}>
                            ${src
                              ? html`<img src=${src} alt=${"page-" + (i+1)} style=${{width:"100%",display:"block",borderRadius:12}} />`
                              : html`<div style=${{padding:"40px 16px",color:"#888",textAlign:"center",fontSize:13}}>第 ${i+1} 页（图片未生成）</div>`}
                            <div style=${{padding:"6px 10px",fontSize:11,color:"#888",background:"var(--panel-2)"}}>第 ${i+1} / ${pages.length} 页</div>
                          </div>`;
                      })}
                    </div>`;
                })()}
                ${result.model_used ? html`<div class="model-hint">由 ${result.model_used} 生成</div>` : null}
                ${result.archived && html`
                  <div class="archive-box">
                    <span class="archive-badge">✓ 已自动归档</span>
                    <span class="archive-time">${result.archived.timestamp}</span>
                    <div class="archive-links">
                      <a href=${outUrl(result.archived.json) || ""} target="_blank" rel="noreferrer">归档记录 (JSON)</a>
                      ${result.archived.local_file
                        ? html`<a href=${outUrl(result.archived.local_file) || ""} target="_blank" rel="noreferrer">${result.archived.local_file.endsWith(".md") ? "文字成品" : "图片成品"}</a>`
                        : result.output_kind === "image_url" || result.output_kind === "video_file" || result.output_kind === "image_strip"
                          ? html`<span class="archive-note">（远程成品未下载到本地，可手动保存）</span>`
                          : null}
                      ${result.archived.text_file && result.archived.text_file !== result.archived.local_file
                        ? html`<a href=${outUrl(result.archived.text_file) || ""} target="_blank" rel="noreferrer">文字成品</a>`
                        : null}
                      ${result.image_url && /\.(png|jpe?g|gif|webp)$/i.test(result.image_url)
                        ? html`<a href=${outUrl(result.image_url) || ""} target="_blank" rel="noreferrer">图片成品</a>`
                        : null}
                    </div>
                  </div>`}
                <button class="open-btn" style="margin-top:16px" onClick=${openBox}>再抽一次（换种子）</button>
              </div>`}
          `}

          ${tab === "config" && config && html`
            <div class="section-title">全局配置</div>
            <div class="config-form">
              <div class="form-row"><label>
                <input type="checkbox" checked=${!!config.mock} onInput=${e => update("mock", e.target.checked)} /> Mock 模式（无真实 key 时本地模拟）</label></div>
              <div class="section-title">随机性</div>
              <div class="form-row"><label>每抽抽取种子数</label>
                <input type="number" value=${rnd.per_open_draw ?? 2} onInput=${e => update("randomness.per_open_draw", Number(e.target.value))} /></div>

              <div class="section-title">随机种子池（twist pool）</div>
              <div class="note">四个维度各维护一组候选词条，每次开盲盒从中抽取。可手动增删改，也可用「🎲 生成」调用大模型补一条（已自动避开重复）。</div>
              ${poolDims.map(dim => html`
                <div class="config-form" style=${{ marginTop: "10px" }}>
                  <div style=${{ display: "flex", justifyContent: "space-between", alignItems: "center" }}>
                    <div class="section-title" style=${{ margin: "0" }}>${dimCn[dim]}（${dim}）</div>
                    <button type="button" class="save-btn" style=${{ padding: "6px 12px" }}
                      disabled=${poolUI.gen?.[dim]} onClick=${() => genSeed(dim)}>
                      ${poolUI.gen?.[dim] ? "生成中…" : "🎲 生成新种子"}
                    </button>
                  </div>
                  ${getPool(dim).map((it, idx) => html`
                    <div style=${{ display: "flex", gap: "6px", marginTop: "6px" }}>
                      <input value=${it} onInput=${e => editItem(dim, idx, e.target.value)} style=${{ flex: 1 }} />
                      <button type="button" class="save-btn"
                        style=${{ padding: "6px 10px", background: "var(--danger)", borderColor: "var(--danger)" }}
                        onClick=${() => removeItem(dim, idx)}>×</button>
                    </div>`)}
                  <div style=${{ display: "flex", gap: "6px", marginTop: "6px" }}>
                    <input placeholder=${"新增一条" + dimCn[dim] + "…"}
                      value=${poolUI.addText?.[dim] || ""}
                      onInput=${e => setPoolUI(s => ({ ...s, addText: { ...s.addText, [dim]: e.target.value } }))}
                      onKeyDown=${e => { if (e.key === "Enter") addItem(dim); }} style=${{ flex: 1 }} />
                    <button type="button" class="save-btn" style=${{ padding: "6px 10px" }} onClick=${() => addItem(dim)}>添加</button>
                  </div>
                  ${poolUI.genErr?.[dim] && html`<div class="error">${poolUI.genErr[dim]}</div>`}
                </div>`)}
              <button type="button" class="save-btn"
                style=${{ marginTop: "10px", background: "transparent", color: "var(--muted)" }}
                onClick=${resetPool}>↺ 恢复默认种子池</button>
              <button type="button" class="save-btn"
                style=${{ marginTop: "6px", background: "var(--accent)", color: "#fff", width: "100%" }}
                disabled=${refreshingAll}
                onClick=${refreshAllSeeds}>${refreshingAll ? "⏳ 正在刷新..." : "🔀 一键刷新种子池"}</button>
              ${refreshErr && html`<div class="error">${refreshErr}</div>`}

              ${codeModeIdx() >= 0 && html`
                <div class="section-title" style=${{ marginTop: "18px" }}>代码模式独立工具池（code 专用）</div>
                <div class="note">代码盲盒使用独立种子池（与上方全局池互不影响），抽取「实用工具」方向。同样支持手动增删改、🎲 生成、一键刷新。</div>
                ${poolDims.map(dim => html`
                  <div class="config-form" style=${{ marginTop: "10px" }}>
                    <div style=${{ display: "flex", justifyContent: "space-between", alignItems: "center" }}>
                      <div class="section-title" style=${{ margin: "0" }}>${dimCn[dim]}（${dim}）</div>
                      <button type="button" class="save-btn" style=${{ padding: "6px 12px" }}
                        disabled=${modePoolUI.gen?.[dim]} onClick=${() => genModeSeed(dim)}>
                        ${modePoolUI.gen?.[dim] ? "生成中…" : "🎲 生成新种子"}
                      </button>
                    </div>
                    ${getModePool(dim).map((it, idx) => html`
                      <div style=${{ display: "flex", gap: "6px", marginTop: "6px" }}>
                        <input value=${it} onInput=${e => editModeItem(dim, idx, e.target.value)} style=${{ flex: 1 }} />
                        <button type="button" class="save-btn"
                          style=${{ padding: "6px 10px", background: "var(--danger)", borderColor: "var(--danger)" }}
                          onClick=${() => removeModeItem(dim, idx)}>×</button>
                      </div>`)}
                    <div style=${{ display: "flex", gap: "6px", marginTop: "6px" }}>
                      <input placeholder=${"新增一条" + dimCn[dim] + "…"}
                        value=${modePoolUI.addText?.[dim] || ""}
                        onInput=${e => setModePoolUI(s => ({ ...s, addText: { ...s.addText, [dim]: e.target.value } }))}
                        onKeyDown=${e => { if (e.key === "Enter") addModeItem(dim); }} style=${{ flex: 1 }} />
                      <button type="button" class="save-btn" style=${{ padding: "6px 10px" }} onClick=${() => addModeItem(dim)}>添加</button>
                    </div>
                    ${modePoolUI.genErr?.[dim] && html`<div class="error">${modePoolUI.genErr[dim]}</div>`}
                  </div>`)}
                <button type="button" class="save-btn"
                  style=${{ marginTop: "10px", background: "var(--accent)", color: "#fff", width: "100%" }}
                  disabled=${modeRefreshing}
                  onClick=${refreshModeSeeds}>${modeRefreshing ? "⏳ 正在刷新..." : "🔀 一键刷新 code 工具池"}</button>
                ${modeRefreshErr && html`<div class="error">${modeRefreshErr}</div>`}
              `}
            </div>

            ${renderModelSlot({title:"全局默认模型（各 Agent/Provider 留空时回退）", basePath:"global", keyMap:{model:"default_model",base_url:"default_base_url",api_key:"default_api_key"}, config, update, fetchModels})}

            ${["creative","planner","executor"].map(key => {
              const titles = {creative:"Agent1 创意（高温度，脑洞大）", planner:"Agent2 规划（低温度，严谨格式化）", executor:"Agent3 执行（图片/视频由下方 provider 覆盖）"};
              return renderModelCards({title:titles[key], basePath:"agents."+key});
            })}

            <div class="section-title">图片 / 视频 / 游戏 模型（执行 Agent 调多模态时覆盖，运行时按序 fallback）</div>
            ${["image","video","game"].map(pkey => {
              const titles = {image:"图片模型", video:"视频模型", game:"小游戏模型"};
              return renderModelCards({title:titles[pkey], basePath:"providers."+pkey});
            })}

            <div class="section-title">播客 TTS 语音合成（文字 → 语音）</div>
            <div class="config-form">
              <div class="note">无需选择引擎：<b>不填 base_url / api_key</b> → 自动使用免费 Edge TTS；<b>同时填好 base_url / api_key</b> → 走云端大模型（用下方 model 指定模型，任意兼容 OpenAI /audio/speech 的厂商均可）；云端调用出错会自动回退 Edge TTS。</div>
              <div class="form-row"><label>音色 Voice</label>
                ${picker({ key: "tts-voice", value: tp.voice || "", options: [...voices.edge.map(v => v.id), ...voices.cloud.map(v => v.id)],
                  onPick: v => update("providers.tts.voice", v),
                  placeholder: "Edge 例: zh-CN-XiaoxiaoNeural · 云端直接手写音色名", emptyLabel: "（留空=默认音色）" })}
                <div class="note">可从下拉建议中随时改选，也可手写任意音色名</div>
              </div>
            ${renderModelCards({title:"TTS 模型（云端模式必填 model / base_url / api_key；未填 base_url/api_key 则默认免费 Edge TTS；云端出错自动回退 Edge）", basePath:"providers.tts", note:"未填 base_url / api_key → 免费 Edge TTS（忽略 model）；同时填了 → 用此处 model 调用云端大模型，出错自动回退 Edge。"})}

            <div class="paths">${"大文件目录（默认项目目录内，可配置）：\n缓存: " + (paths.cache_dir||"") + "\n产物: " + (paths.output_dir||"") + "\n上传: " + (paths.data_dir||"")}</div>
            ${saved && html`<div class="note" style="color:var(--accent-2)">✓ 已保存</div>`}
            ${error && html`<div class="error">${error}</div>`}
            <button class="save-btn" style="margin-top:12px" onClick=${save}>保存配置</button>
            </div>
          `}

          ${tab === "history" && html`
            <div class="section-title">历史记录（${history.length} 条）</div>
            ${histLoading && html`<div class="note">加载中…</div>`}
            ${histError && html`<div class="error">${histError}</div>`}
            ${!histLoading && !histError && history.length === 0
              && html`<div class="note">还没有开盒记录，去「开盲盒」抽一个吧。</div>`}
            <div class="hist-list">
              ${history.map(it => html`
                <div class="hist-item" key=${it.id}>
                  <div class="hist-head" onClick=${() => setExpandedId(expandedId === it.id ? null : it.id)}>
                    <span class="hist-mode">${modeName(it.mode)}</span>
                    <span class="hist-time">${it.timestamp || ""}</span>
                    <span class="hist-kind">${it.output_kind || ""}</span>
                  </div>
                  <div class="seed-pill">seed: ${it.seed || "（无）"}</div>
                  ${expandedId === it.id ? html`
                    <h3>概念卡</h3>
                    <div class="concept">${it.concept || ""}</div>
                    <h3>规划输出</h3>
                    <div class="plan">${it.plan || "(无规划输出)"}</div>
                    <h3>成品</h3>
                     ${it.output_kind === "text" && html`<div class="concept">${it.output || ""}</div>`}
                     ${it.output_kind === "character_card" && html`
                       <div class="character-card">
                         ${it.image_url && html`
                           <div class="char-frame">
                             <img src=${mediaSrc({output: it.image_url})} alt="avatar" />
                           </div>`}
                         <div class="char-fields">
                           ${parseCharFields(it.output).map(f => html`
                             <div class="char-row">
                               <div class="char-label">${f.label}</div>
                               <div class="char-value">${f.value}</div>
                             </div>`)}
                         </div>
                       </div>`}
                     ${it.output_kind === "spec_md" && html`<div class="plan"><code>${it.output || ""}</code></div>${envCostCard(it)}`}
                      ${(it.output_kind === "game_html" || it.output_kind === "quiz_html") && html`
                        ${it.local_file
                          ? html`<iframe src=${outUrl(it.local_file) || ""} sandbox="allow-scripts" data-blindbox=${it.output_kind === "quiz_html" ? "quiz" : "game"} title=${it.output_kind === "quiz_html" ? "趣味测试" : "小游戏"} style=${{width:"100%",height:it.output_kind === "quiz_html" ? "650px" : "520px",border:"0",borderRadius:"12px",marginTop:"8px",display:"block"}}></iframe>`
                          : html`<div class="plan">${it.output || ""}</div>`}`}
                     ${it.output_kind === "image_strip" && (() => {
                       let pages = [];
                       try {
                         const parsed = JSON.parse(it.output || "{}");
                         if (Array.isArray(parsed.pages)) pages = parsed.pages;
                       } catch (e) { console.error("[demo-hist] image_strip parse:", e); }
                       if (pages.length === 0) return html`<div class="plan">（插画故事 · 共 0 页）</div>`;
                       return html`
                         <div style=${{display:"flex",gap:8,overflowX:"auto"}}>
                           ${pages.map((p, i) => {
                            const src = (() => {
                              if (p.local) return outUrl(p.local);
                              const u = p.url || "";
                              if (/^https?:\/\//i.test(u)) return u;
                              if (u.startsWith("/output/")) return outUrl(u.slice("/output/".length)) || u;
                              if (u && !/^[a-zA-Z]:[\\/]/.test(u) && !u.startsWith("/")) return outUrl(u);
                              return null;
                            })();
                             return html`
                               <div key=${i} style=${{flex:"0 0 auto",width:"60%",maxWidth:280,borderRadius:8,overflow:"hidden",background:"#0b1220"}}>
                                 ${src
                                   ? html`<img src=${src} alt=${"p" + (i+1)} style=${{width:"100%",display:"block"}} />`
                                   : html`<div style=${{padding:20,color:"#888",textAlign:"center",fontSize:12}}>第 ${i+1} 页（未生成）</div>`}
                                 <div style=${{padding:"4px 8px",fontSize:10,color:"#888",background:"#1f232c"}}>第 ${i+1} / ${pages.length} 页</div>
                               </div>`;
                           })}
                         </div>`;
                     })()}
                     ${it.output_kind === "song" && (() => {
                       let audio = "", lyrics = "", ttsInfo = "";
                       try {
                         const parsed = JSON.parse(it.output || "{}");
                         audio = parsed.audio || "";
                         lyrics = parsed.lyrics || "";
                         ttsInfo = parsed.tts_info || "";
                       } catch (e) { console.error("[demo-hist] song parse:", e); }
                      const audioSrc = (() => {
                        if (!audio) return null;
                        if (/^https?:\/\//i.test(audio)) return audio;
                        if (audio.startsWith("/output/")) return outUrl(audio.slice("/output/".length)) || audio;
                        if (audio && !/^[a-zA-Z]:[\\/]/.test(audio) && !audio.startsWith("/")) return outUrl(audio);
                        return null;
                      })();
                       return html`
                         <div class="concept" style=${{whiteSpace:"pre-wrap",fontFamily:'"PingFang SC","Microsoft YaHei",serif',lineHeight:1.8}}>${lyrics || "（歌词为空）"}</div>
                         ${audioSrc && html`<audio src=${audioSrc} controls preload="metadata" style=${{width:"100%",borderRadius:"12px",marginTop:10,display:"block"}}></audio>`}
                         ${ttsInfo && html`<div style=${{marginTop:4,fontSize:12,color:"var(--muted)"}}>${ttsInfo}</div>`}`;
                     })()}
                     ${(it.output_kind === "image_url" || it.output_kind === "video_file" || it.output_kind === "audio_file") && html`
                       ${it.output_kind === "video_file"
                         ? html`<video src=${outUrl(it.local_file) || it.output} controls style=${{maxWidth:"100%",borderRadius:"12px",marginTop:"8px"}}></video>`
                         : it.output_kind === "audio_file"
                           ? html`<audio src=${outUrl(it.local_file) || it.output} controls preload="metadata" style=${{width:"100%",borderRadius:"12px",marginTop:"8px"}}></audio>`
                           : ["recipe","tarot","character"].includes(it.mode)
                             ? html`<div style=${{display:"flex",flexDirection:"column",alignItems:"center",marginTop:"8px"}}>
                                 <img src=${outUrl(it.local_file) || it.output} style=${{maxWidth:"480px",width:"100%",height:"auto",objectFit:"contain",borderRadius:"12px",display:"block",background:"var(--panel-2)"}} alt="result" />
                                 ${it.caption ? html`<div style=${{maxWidth:"480px",width:"100%",marginTop:"10px",padding:"12px 14px",boxSizing:"border-box",background:"var(--panel-2)",border:"1px solid var(--border)",borderRadius:"12px",color:"var(--text)",fontSize:14,lineHeight:1.7,whiteSpace:"pre-wrap",wordBreak:"break-word",textAlign:"left",textShadow:"none"}}>${it.caption}</div>` : null}
                               </div>`
                             : html`<div style=${{position:"relative",display:"inline-block",maxWidth:"100%"}}>
                                 <img src=${outUrl(it.local_file) || it.output} style=${{maxWidth:"100%",borderRadius:"12px",marginTop:"8px",display:"block"}} alt="result" />
                                 ${it.caption ? html`<div style=${{position:"absolute",left:0,right:0,bottom:0,padding:"10px 12px",borderRadius:"0 0 12px 12px",color:"#fff",background:"linear-gradient(0deg, rgba(0,0,0,0.75), rgba(0,0,0,0))",fontSize:20,fontWeight:700,textAlign:"center",textShadow:"0 1px 3px rgba(0,0,0,0.5)"}}>${it.caption}</div>` : null}
                               </div>`}
                     `}
                     ${it.model_used ? html`<div class="model-hint">由 ${it.model_used} 生成</div>` : null}
                    <div class="archive-links">
                      <a href=${outUrl(it.json) || ""} target="_blank" rel="noreferrer">归档 JSON</a>
                      ${it.local_file && html`<a href=${outUrl(it.local_file) || ""} target="_blank" rel="noreferrer">${it.local_file.endsWith(".md") ? "文字成品" : "图片成品"}</a>`}
                      ${it.text_file && it.text_file !== it.local_file && html`<a href=${outUrl(it.text_file) || ""} target="_blank" rel="noreferrer">文字成品</a>`}
                      ${it.image_url && /\.(png|jpe?g|gif|webp)$/i.test(it.image_url) && html`<a href=${outUrl(it.image_url) || ""} target="_blank" rel="noreferrer">图片成品</a>`}
                    </div>
                    <button class="save-btn" style=${{marginTop:"10px"}}
                      onClick=${() => { setSelected(it.mode); setTab("box"); runOpen(it.mode, it.seed); }}>用此 seed 重抽</button>
                  ` : html`<div class="hist-snippet">${(it.output || "").slice(0, 90)}</div>`}
                </div>`)}
            </div>
            ${history.length > 0 && html`
              <button class="save-btn" style=${{marginTop:"12px",background:"transparent",color:"var(--muted)"}} onClick=${loadHistory}>↻ 刷新</button>`}
          `}
        </div>
      `;
    }

    try {
      render(html`<${App} />`, document.getElementById("root"));
    } catch (e) {
      console.error("Error rendering App:", e);
      document.getElementById("root").innerHTML = 
        '<p style="color:#e24b4a;padding:24px">渲染错误: ' + e.message + '</p>';
    }
  </script>
</body>
</html>
