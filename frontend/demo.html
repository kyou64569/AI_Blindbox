        const totalChars = list.reduce((n, s) => n + (s.text || "").length, 0);
        return html`
          <div style=${{ margin: "10px 0", border: "1px solid var(--accent)", borderRadius: 10, background: "rgba(127,119,221,0.06)", padding: "10px 12px" }}>
            <div style=${{ display: "flex", alignItems: "center", gap: 8, fontSize: 12, fontWeight: 600, color: "var(--accent)", letterSpacing: 0.5, marginBottom: 8 }}>
              <span>思考中…（${totalChars} 字）</span>
              ${live ? html`<span style=${{ width: 6, height: 6, borderRadius: "50%", background: "var(--accent)", animation: "blink 1s steps(2, start) infinite", display: "inline-block" }} />` : ""}
            </div>
            ${list.map((s, i) => html`
              <div style=${i === 0 ? undefined : { marginTop: 8, paddingTop: 8, borderTop: "1px dashed var(--border)" }}>
                <div style=${{ fontSize: 11, color: "var(--accent)", fontWeight: 600, marginBottom: 4, display: "flex", gap: 8, flexWrap: "wrap" }}>
                  <span>${s.stage || "模型思考"}</span>
                  ${s.model ? html`<span style=${{ color: "var(--muted)", fontWeight: 400 }}>· ${s.model}</span>` : ""}
                </div>
                <div style=${{ fontSize: 13, lineHeight: 1.75, color: "var(--muted)", whiteSpace: "pre-wrap", wordBreak: "break-word", fontFamily: 'ui-monospace, SFMono-Regular, Menlo, Consolas, "Microsoft YaHei", monospace' }}>
                  ${s.text}${live && i === list.length - 1
                    ? html`<span style=${{ display: "inline-block", width: 7, height: 13, marginLeft: 2, verticalAlign: "text-bottom", background: "var(--accent)", animation: "blink 1s steps(2, start) infinite" }} />`
                    : ""}
                </div>
              </div>`)}
          </div>`;
      };

      const cancelTask = async () => {
        const tid = task && task.task_id;
        if (!tid) return;
        try {
          await fetch("/api/task/" + tid + "/cancel", { method: "POST" });
        } catch (e) { /* 忽略网络错误，轮询会兜底 */ }
      };
      const openBox = () => runOpen(selected);

      // ---- 批量开盒：一次创建 N 个异步任务，并排展示进度与结果 ----
      const cancelBatch = async () => {
        if (batchPollRef.current) { clearInterval(batchPollRef.current); batchPollRef.current = null; }
        for (const t of batchTasks) {
          try { await fetch("/api/task/" + t.task_id + "/cancel", { method: "POST" }); } catch (e) {}
        }
      };
      const runBatchOpen = async () => {
        const m = selected;
        if (!m) return;
        const finalSeed = (customSeed || "").trim();
        setLoading(true); setError(null); setBatchError(null); setResult(null);
        if (batchPollRef.current) { clearInterval(batchPollRef.current); batchPollRef.current = null; }
        // 1) 创建批量任务
        let resp, data;
        try {
          resp = await fetch("/api/open-batch", {
            method: "POST", headers: { "Content-Type": "application/json" },
            body: JSON.stringify(finalSeed ? { mode: m, count: batchCount, seed: finalSeed } : { mode: m, count: batchCount }),
          });
          data = await resp.json();
        } catch (e) {
          setLoading(false);
          setBatchError("创建批量任务失败: " + e.message);
          return;
        }
        if (!resp.ok) { setLoading(false); setBatchError((data && data.detail) || "批量开盲盒失败"); return; }
        const tasks = (data.tasks || []).map(t => ({
          task_id: t.task_id, status: "running", stage_label: "排队中", progress: 0, elapsed: 0, result: null,
        }));
        setBatchTasks(tasks);
        // 2) 统一轮询全部任务
        const pollAll = async () => {
          const next = [];
          let allDone = true;
          for (const t of tasks) {
            let cur;
            try {
              const r = await fetch("/api/task/" + t.task_id);
              cur = await r.json();
            } catch (e) { cur = null; }
            if (cur && cur.status) {
              next.push({ ...t, status: cur.status, stage_label: cur.stage_label, progress: cur.progress, elapsed: cur.elapsed, result: cur.result, error: cur.error });
              if (cur.status !== "done" && cur.status !== "error" && cur.status !== "cancelled") allDone = false;
            } else {
              next.push(t);
              allDone = false;
            }
          }
          setBatchTasks(next);
          if (allDone) {
            if (batchPollRef.current) { clearInterval(batchPollRef.current); batchPollRef.current = null; }
            setLoading(false);
            const anyDone = next.some(t => t.status === "done" && t.result);
            if (!anyDone) {
              const errs = next.filter(t => t.error).map(t => t.error).join("；");
              setBatchError("批量任务均未成功: " + (errs || "未知"));
            }
          }
        };
        setLoading(true);
        await pollAll();
        if (!batchPollRef.current) batchPollRef.current = setInterval(pollAll, 1200);
      };

      // 已下线模式的兜底名称（历史记录仍显示可读名）
      const LEGACY_MODE_NAMES = { novella: "中篇播客（已合并）", longpod: "长播客（已合并）" };
      const modeName = (id) => (modes.find(m => m.id === id)?.name || LEGACY_MODE_NAMES[id] || id || "");

      // 把 output 目录内的相对文件名转成可安全放进 href/src 的 URL。
      // 逐段 encodeURIComponent：产物名由提示词生成（中文/空格/#/%/&），
      // 直接 "/output/" + name 会被浏览器把 # 之后当锚点丢掉（output/ 里确有含 # 的文件）。
      const outUrl = (name) => {
        if (typeof name !== "string") return null;
        const raw = name.trim().replace(/\\/g, "/");
        if (!raw) return null;
        if (raw.startsWith("/") || /^[a-zA-Z]:\//.test(raw) || raw.split("/").includes("..")) return null;
        return "/output/" + raw.split("/").map(encodeURIComponent).join("/");
      };

      // 解析图片/视频成品的可渲染地址：
      // 归档后后端会把 output 改写为本地相对文件名（如 asset_xxx.png，无 /output/ 前缀），
      // 此时必须读取 archived.local_file 并补 /output/ 前缀；否则就当纯文本显示。
      const mediaSrc = (r) => {
        if (!r) return null;
        if (r.archived && r.archived.local_file) return outUrl(r.archived.local_file);
        const o = r.output || "";
        if (/^https?:\/\//.test(o)) return o;
        if (o.startsWith("/output/")) return outUrl(o.slice("/output/".length)) || o;
        // 裸相对文件名（output 目录内）——自动补 /output/ 也能渲染
        if (o && !/^[a-zA-Z]:[\\/]/.test(o) && !o.startsWith("/")) return outUrl(o);
        return null; // 无法渲染 -> 退回纯文本
      };
      // 角色卡：解析 "Name | xxx" 或 "Name: xxx" 格式的结构化文本 → [{label, value}]
      // 思考强度可选项：与后端 agents._THINKING_VALUES 一一对应
      // 说明：Gemini 3+ 原生端点用 thinkingLevel（不支持 thinkingBudget），"关闭"映射为 minimal；
      // OpenAI 兼容层由下方「思考参数方言」决定具体字段（不同网关写法不同）。
      const THINKING_OPTIONS = [
        { value: "default", label: "默认（不指定，沿用模型默认思考水平）" },
        { value: "off", label: "关闭（Gemini 3 映射为 minimal，最接近关闭）" },
        { value: "low", label: "低（更快、更省 token）" },
        { value: "medium", label: "中（平衡）" },
        { value: "high", label: "高（推理最深，最慢）" },
      ];
      // 思考参数方言：与后端 thinking_profiles.THINKING_PROFILES 一一对应。
      // 新增厂商 = 后端注册表加一条 + 这里加一个选项，主流程零改动。
      const THINKING_PROFILE_OPTIONS = [
        { value: "", label: "默认（未设置）：仅 reasoning_effort", hint: "兼容旧配置，请求体不变；接新网关时选下方对应方言" },
        { value: "openai-native", label: "openai-native · Qwen3 / vLLM", hint: "顶层 enable_thinking 开关；开启时附 reasoning_effort" },
        { value: "chat-template", label: "chat-template · Agnes 3.0 / 小红书 Dots", hint: "chat_template_kwargs.enable_thinking；顶层字段会被忽略" },
        { value: "thinking-flag", label: "thinking-flag · MiniMax-M3（字符串）", hint: "thinking:\"enabled\"/\"disabled\"，附 reasoning_effort" },
        { value: "thinking-type", label: "thinking-type · 腾讯混元 hy3/hy4（对象）", hint: "thinking:{type:\"enabled\"/\"disabled\"}；与上一条同名不同形状" },
        { value: "effort-only", label: "effort-only · 仅 reasoning_effort", hint: "off 发 reasoning_effort:\"none\"；无独立 thinking 开关" },
        { value: "thinking-mode", label: "thinking-mode · Intern-S1（布尔）", hint: "thinking_mode:true/false，无强度档；须配 binary" },
        { value: "nvidia", label: "nvidia · NVIDIA NIM（布尔）", hint: "thinking:true/false，无强度档；发字符串会 400；须配 binary" },
      ];
      const THINKING_CAPABILITY_OPTIONS = [
        { value: "", label: "默认 graded（真分级）", hint: "low / medium / high 各自生效" },
        { value: "graded", label: "graded · 真分级", hint: "低/中/高档分别下发" },
        { value: "binary", label: "binary · 只支持开/关", hint: "低/中/高归一成满血 + 高预算；NVIDIA NIM / Intern-S1 必选" },
        { value: "none", label: "none · 无思考能力", hint: "一个思考参数都不发" },
      ];
      // 通用下拉：值非法时回退到第一项（空 = 未配置），并显示当前项 hint
      const dialectSelect = (opts, value, onPick, label) => {
        const cur = opts.some(o => o.value === value) ? value : "";
        const hit = opts.find(o => o.value === cur);
        return html`
          <div class="form-row">
            <label>${label}</label>
            <select value=${cur} onChange=${e => onPick(e.target.value)}>
              ${opts.map(o => html`<option key=${o.value} value=${o.value}>${o.label}</option>`)}
            </select>
            <div class="note">${hit.hint}</div>
          </div>`;
      };
      const profileSelect = (value, onPick) =>
        dialectSelect(THINKING_PROFILE_OPTIONS, value, onPick, "思考参数方言 thinking_profile（按网关选择）");
      const capabilitySelect = (value, onPick) =>
        dialectSelect(THINKING_CAPABILITY_OPTIONS, value, onPick, "思考能力 thinking_capability");
      // 思考强度下拉：每张模型卡片一个，紧跟 temperature 之后
      const thinkingSelect = (value, onPick) => {
        // 值收敛到合法选项：配置文件里若被手改成非法值（如 "HIGH"/"关闭"/乱码），
        // 直接透传给<select> 会让下拉显示空白，这里兜底回 default。
        const cur = THINKING_OPTIONS.some(o => o.value === value) ? value : "default";
        const hit = THINKING_OPTIONS.find(o => o.value === cur);
        return html`
          <div class="form-row">
            <label>思考强度 thinking（可选）</label>
            <select value=${cur} onChange=${e => onPick(e.target.value)}>
              ${THINKING_OPTIONS.map(o => html`<option key=${o.value} value=${o.value}>${o.label}</option>`)}
            </select>
            <div class="note">当前：${hit.label}。Gemini 原生端点走 thinkingLevel；OpenAI 兼容层按下方「思考参数方言」注入字段。</div>
          </div>`;
      };
      // 温度输入框组件。
      // 为什么不能用受控 <input type="number"> + Number(value)：
      // 输入 "0.8" 到 "0" 后立刻把 0 存回 state，浏览器此时再收到 "." 会认为
      // "0." 不是合法数字而把 value 置空，小数点根本进不来（中文输入法下更明显）。
      // 改为「本地字符串态 + 失焦提交」：编辑期间不碰外部 state，
      // 用户可自由输入 "0." / "0.8" / "1"，失焦或回车时才解析成数字写入配置。
      // 解析不通过（空/非法）回退 null，即"留空=用全局默认"。
      const TemperatureInput = ({ value, onChange, id }) => {
        const [draft, setDraft] = useState(() =>
          value === null || value === undefined || value === "" ? "" : String(value));
        const lastExternal = useRef(value);

        // 外部值变化（如切换卡片/保存后重载）时同步回本地编辑态
        useEffect(() => {
          if (value === lastExternal.current) return;
          lastExternal.current = value;
          setDraft(value === null || value === undefined || value === "" ? "" : String(value));
        }, [value]);

        const commit = () => {
          const s = String(draft || "").trim();
          if (s === "") { lastExternal.current = null; onChange(null); return; }
          const n = Number(s);
          if (isFinite(n)) {
            // 界面承诺 0~2，超范围直接收敛：否则 5 会原样写进配置发给供应商（多数端点 400）
            const clamped = Math.min(2, Math.max(0, n));
            lastExternal.current = clamped;
            onChange(clamped);
            if (clamped !== n) setDraft(String(clamped));
          }
          else {
            // 非法输入：还原成当前有效值，不把垃圾写进配置
            const cur = value === null || value === undefined || value === "" ? "" : String(value);
            lastExternal.current = value;
            setDraft(cur);
          }
        };

        return html`
          <div class="form-row">
            <label>温度 temperature（可选，留空=用全局/默认）</label>
            <input id=${id} type="text" inputMode="decimal" autocomplete="off"
              value=${draft}
              onInput=${e => setDraft(e.target.value)}
              onBlur=${commit}
              onKeyDown=${e => { if (e.key === "Enter") { e.preventDefault(); e.currentTarget.blur(); } }}
              placeholder="如 0.8" />
            <div class="note">支持 0 ~ 2 的小数，直接键入即可（如 0.8 / 1.2），回车或失焦生效。</div>
          </div>`;
      };
      // 最大输出 token 输入框：复用 temperature 的「本地字符串态 + 失焦提交」模式，
      // 但解析为非负整数；空 -> null（留空=用模型默认上限）。
      const MaxTokensInput = ({ value, onChange, id }) => {
        const [draft, setDraft] = useState(() =>
          value === null || value === undefined || value === "" ? "" : String(value));
        const lastExternal = useRef(value);
        useEffect(() => {
          if (value === lastExternal.current) return;
          lastExternal.current = value;
          setDraft(value === null || value === undefined || value === "" ? "" : String(value));
        }, [value]);
        const commit = () => {
          const s = String(draft || "").trim();
          if (s === "") { lastExternal.current = null; onChange(null); return; }
          const n = Number(s);
          if (isFinite(n) && n > 0) { const v = Math.floor(n); lastExternal.current = v; onChange(v); }
          else {
            const cur = value === null || value === undefined || value === "" ? "" : String(value);
            lastExternal.current = value;
            setDraft(cur);
          }
        };
        return html`
          <div class="form-row">
            <label>最大输出 token max_tokens（可选，留空=用模型默认上限）</label>
            <input id=${id} type="text" inputMode="numeric" autocomplete="off"
              value=${draft}
              onInput=${e => setDraft(e.target.value)}
              onBlur=${commit}
              onKeyDown=${e => { if (e.key === "Enter") { e.preventDefault(); e.currentTarget.blur(); } }}
              placeholder="如 4096" />
            <div class="note">限制模型单次输出的最大 token 数，正整数。留空则不限制，沿用模型默认上限。</div>
          </div>`;
      };
      // 请求超时输入框：复用 temperature 的「本地字符串态 + 失焦提交」模式，
      // 解析为正数（秒，允许小数）；空 -> null（留空=用调用点默认超时）。
      const TimeoutInput = ({ value, onChange, id }) => {
        const [draft, setDraft] = useState(() =>
          value === null || value === undefined || value === "" ? "" : String(value));
        const lastExternal = useRef(value);
        useEffect(() => {
          if (value === lastExternal.current) return;
          lastExternal.current = value;
          setDraft(value === null || value === undefined || value === "" ? "" : String(value));
        }, [value]);
        const commit = () => {
          const s = String(draft || "").trim();
          if (s === "") { lastExternal.current = null; onChange(null); return; }
          const n = Number(s);
          if (isFinite(n) && n > 0) { lastExternal.current = n; onChange(n); }
          else {
            const cur = value === null || value === undefined || value === "" ? "" : String(value);
            lastExternal.current = value;
            setDraft(cur);
          }
        };
        return html`
          <div class="form-row">
            <label>请求超时 timeout（秒，可选，留空=用默认 90/120/180）</label>
            <input id=${id} type="text" inputMode="decimal" autocomplete="off"
              value=${draft}
              onInput=${e => setDraft(e.target.value)}
              onBlur=${commit}
              onKeyDown=${e => { if (e.key === "Enter") { e.preventDefault(); e.currentTarget.blur(); } }}
              placeholder="如 180" />
            <div class="note">单次 API 调用最长等待秒数。调大 max_tokens 且开启思考时，长输出可能超时，可在此调高。留空沿用默认。</div>
          </div>`;
      };

      const parseCharFields = (text) => {
        if (!text) return [];
        return text.split("\n").map(l => l.trim()).filter(Boolean).map(line => {
          // "Name | value" 或 "Name: value" 或 【Name】value
          const m = line.match(/^(?:【|[\[])?\s*(.+?)\s*(?:】|[\]]?)\s*[:|：]\s*(.+)/);
          if (m) return { label: m[1].trim(), value: m[2].trim() };
          return { label: "", value: line };
        }).filter(f => f.value);
      };
      // spec 章节提取：【环境依赖清单】/【磁盘占用预估】等，取到下一个【章节】或结尾
      const extractSection = (text, name) => {
        if (!text) return "";
        const re = new RegExp("【" + name + "】([\\s\\S]*?)(?=【|$)", "i");
        const m = text.match(re);
        return m ? m[1].trim().replace(/\n{3,}/g, "\n\n").slice(0, 300) : "";
      };
      // 环境成本卡：代码模式 spec 展示区下方的依赖/磁盘预估 + 黑名单警告
      const envCostCard = (r) => {
        if (!r || r.output_kind !== "spec_md") return null;
        const plan = r.plan || "";
        const warn = r.env_warning || "";
        const dep = extractSection(plan, "环境依赖清单");
        const size = extractSection(plan, "磁盘占用预估");
        const rows = [];
        if (warn) rows.push(html`
          <div style=${{ marginTop: "10px", padding: "10px 12px", background: "rgba(227,75,74,0.12)", border: "1px solid rgba(227,75,74,0.5)", borderRadius: "10px", color: "#f09595", fontSize: 13, lineHeight: 1.6, whiteSpace: "pre-wrap" }}>
            ${warn}
          </div>`);
        if (dep || size) rows.push(html`
          <div style=${{ marginTop: "10px", padding: "12px 14px", background: "var(--panel-2)", border: "1px solid var(--border)", borderRadius: "10px", fontSize: 13, lineHeight: 1.7 }}>
            <div style=${{ fontSize: 12, color: "var(--accent, #7f77dd)", fontWeight: 600, marginBottom: 6, letterSpacing: 0.5 }}>环境成本</div>
            ${dep ? html`<div style=${{ color: "var(--muted)" }}>依赖：${dep}</div>` : ""}
            ${size ? html`<div style=${{ color: "var(--muted)", marginTop: 4 }}>磁盘：${size}</div>` : ""}
          </div>`);
        return rows.length ? rows : null;
      };
      // 思考内容打字机回放：按字符递增显示，模拟流式逐字输出的观感。
      // 「思考过程」折叠面板：展示各阶段模型返回的 reasoning / thinking 文本。
      // 无思考内容（reasoning 为空）时整块不渲染。
      // 展开后直接显示全文——实时思考已在开盒过程中逐字展示过，
      // 结果页再演一遍打字机是重复劳动（数千字要拖近 3 秒）。
      const ThinkingPanel = ({ reasoning }) => {
        const entries = Array.isArray(reasoning) ? reasoning.filter(e => e && e.text) : [];
        const [open, setOpen] = useState(false);
        if (entries.length === 0) return null;
        const totalChars = entries.reduce((n, e) => n + (e.text || "").length, 0);
        return html`
          <div style=${{ margin: "10px 0", border: "1px solid var(--border)", borderRadius: 10, background: "var(--panel-2)", overflow: "hidden" }}>
            <button type="button" onClick=${() => setOpen(!open)}
              style=${{ width: "100%", display: "flex", alignItems: "center", justifyContent: "space-between", gap: 8, padding: "9px 12px", background: "transparent", border: "none", color: "var(--text)", fontSize: 13, fontWeight: 600, cursor: "pointer", textAlign: "left" }}>
              <span>思考过程（${entries.length} 段 · ${totalChars} 字）</span>
              <span style=${{ color: "var(--muted)", fontWeight: 400, fontSize: 12 }}>${open ? "收起 ▲" : "展开 ▼"}</span>
            </button>
            ${open && html`<div style=${{ padding: "0 12px 12px" }}>
              ${entries.map((e, i) => html`
                <div style=${i === 0 ? undefined : { marginTop: 10, paddingTop: 10, borderTop: "1px dashed var(--border)" }}>
                  <div style=${{ fontSize: 11, color: "var(--accent, #7f77dd)", fontWeight: 600, letterSpacing: 0.4, marginBottom: 5, display: "flex", gap: 8, flexWrap: "wrap", alignItems: "center" }}>
                    <span>${e.stage || "模型思考"}</span>
                    ${e.model ? html`<span style=${{ color: "var(--muted)", fontWeight: 400 }}>· ${e.model}</span>` : ""}
                  </div>
                  <div style=${{ fontSize: 13, lineHeight: 1.75, color: "var(--muted, #b9bdc7)", whiteSpace: "pre-wrap", wordBreak: "break-word", fontFamily: 'ui-monospace, SFMono-Regular, Menlo, Consolas, "Microsoft YaHei", monospace' }}>
                    ${e.text}
                  </div>
                </div>`)}
            </div>`}
          </div>`;
      };
      const loadHistory = async () => {
        setHistLoading(true); setHistError(null);
        try {
          const params = new URLSearchParams({ limit: "200" });
          if (histQuery.trim()) params.set("q", histQuery.trim());
          if (histModeFilter) params.set("mode", histModeFilter);
          const resp = await fetch("/api/history?" + params.toString());
          const data = await resp.json();
          if (!resp.ok) throw new Error(data.detail || "加载历史失败");
          const items = data.items || [];
          setHistory(histFavOnly ? items.filter(x => x.favorite) : items);
        } catch (e) { setHistError("加载历史失败: " + e.message); }
        finally { setHistLoading(false); }
      };

      const toggleFavorite = async (rid, fav) => {
        try {
          const resp = await fetch("/api/history/" + rid + "/favorite", {
            method: "POST", headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ favorite: fav }),
          });
          const data = await resp.json();
          if (!resp.ok) throw new Error(data.detail || "更新收藏失败");
          setHistory(prev => prev.map(x => x.id === rid ? { ...x, favorite: fav } : x));
          if (histFavOnly && !fav) setHistory(prev => prev.filter(x => x.id !== rid));
        } catch (e) { setHistError("更新收藏失败: " + e.message); }
      };

      const rateItem = async (rid, rating) => {
        try {
          const resp = await fetch("/api/history/" + rid + "/rating", {
            method: "POST", headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ rating }),
          });
          const data = await resp.json();
          if (!resp.ok) throw new Error(data.detail || "评分失败");
          setHistory(prev => prev.map(x => x.id === rid ? { ...x, rating } : x));
        } catch (e) { setHistError("评分失败: " + e.message); }
      };

      const loadStats = async () => {
        setStatsLoading(true);
        try {
          const resp = await fetch("/api/stats");
          const data = await resp.json();
          if (!resp.ok) throw new Error(data.detail || "加载统计失败");
          setStats(data);
        } catch (e) { setError("加载统计失败: " + e.message); }
        finally { setStatsLoading(false); }
      };

      // ---- 配置页：未保存改动计数 / 撤销 / 左侧导航 ----
      const cloneCfg = (o) => { try { return JSON.parse(JSON.stringify(o)); } catch (e) { return null; } };
      // 递归比对叶子差异，数组按整体长度变化计 1 处，其余逐元素递归
      const countDiff = (a, b) => {
        if (a === b) return 0;
        if (a === null || b === null || typeof a !== "object" || typeof b !== "object") return 1;
        if (Array.isArray(a) !== Array.isArray(b)) return 1;
        if (Array.isArray(a)) {
          if (a.length !== b.length) return 1;
          let n = 0;
          for (let i = 0; i < a.length; i++) n += countDiff(a[i], b[i]);
          return n;
        }
        const keys = new Set([...Object.keys(a), ...Object.keys(b)]);
        let n = 0;
        keys.forEach(k => { n += countDiff(a[k], b[k]); });
        return n;
      };
      const dirtyCount = (savedSnap && config) ? countDiff(savedSnap, config) : 0;
      const undoConfig = () => {
        if (!savedSnap) return;
        setConfig(cloneCfg(savedSnap));
        setSaved(false);
        setError(null);
      };
      const CFG_NAV = [
        { id: "connect", label: "模型与连接" },
        { id: "behavior", label: "行为与成本" },
        { id: "seeds", label: "种子池" },
        { id: "modes", label: "模式管理" },
        { id: "storage", label: "存储与路径" },
      ];
      const jumpCfg = (id) => {
        setCfgActive(id);
        const el = document.getElementById("cfg-" + id);
        if (el) el.scrollIntoView({ behavior: "smooth", block: "start" });
      };
      // 滚动联动高亮：取最后一个已滚过阈值线的分组
      useEffect(() => {
        if (tab !== "config") return;
        const onScroll = () => {
          let cur = CFG_NAV[0].id;
          CFG_NAV.forEach(s => {
            const el = document.getElementById("cfg-" + s.id);
            if (el && el.getBoundingClientRect().top <= 130) cur = s.id;
          });
          setCfgActive(prev => (prev === cur ? prev : cur));
        };
        window.addEventListener("scroll", onScroll, { passive: true });
        onScroll();
        return () => window.removeEventListener("scroll", onScroll);
      }, [tab]);
      // 从 base_url 提取 host 用于摘要行展示
      const slotHost = (u) => {
        const s = (u || "").trim();
        if (!s) return "";
        try { return new URL(s.replace(/\/+$/, "")).host; }
        catch (e) { return s.replace(/^https?:\/\//i, "").split("/")[0]; }
      };
      const toggleSlot = (k) => setOpenSlots(m => ({ ...m, [k]: !m[k] }));
      const toggleAdv = (k) => setAdvOpen(m => ({ ...m, [k]: !m[k] }));

      // ---- 连接池（connections）：共享的 base_url + api_key，供所有模型槽位按 id 引用 ----
      const connList = () => (Array.isArray(config?.connections) ? config.connections : []);
      const connById = (id) => connList().find(c => String(c.id ?? "").trim() === (id || "").trim()) || null;
      const SLOT_SECTIONS = ["agents", "providers"];
      // 统计某连接被多少个槽位/卡片引用
      const connUsage = (id) => {
        let n = 0;
        SLOT_SECTIONS.forEach(sec => {
          Object.values(config?.[sec] || {}).forEach(node => {
            if (!node || typeof node !== "object") return;
            (node.models || []).forEach(c => { if (c && c.connection === id) n++; });
            if (node.connection === id) n++;
          });
        });
        return n;
      };
      // 模型槽位卡片总数（用于顶部汇总）
      const slotTotal = () => {
        let n = 0;
        SLOT_SECTIONS.forEach(sec => {
          Object.values(config?.[sec] || {}).forEach(node => {
            if (node && typeof node === "object" && Array.isArray(node.models)) n += node.models.length;
          });
        });
        return n;
      };
      const addConnection = () => {
        const id = "conn_" + Math.random().toString(36).slice(2, 8);
        update("connections", [...connList(), { id, name: "新连接", base_url: "", api_key: "" }]);
        setOpenSlots(m => ({ ...m, ["conn-" + id]: true }));
        setCfgQuery("");
      };
      const updateConnection = (id, field, value) => {
        update("connections", connList().map(c => (c.id === id ? { ...c, [field]: value } : c)));
      };
      // 删除连接：引用处「落地」凭据后再解除引用 —— 等价于撤销共享，
      // 模型不会因为删掉连接而突然失去 base_url/key（否则下次开盒直接失败）。
      const deleteConnection = (id) => {
        const conn = connById(id) || {};
        SLOT_SECTIONS.forEach(sec => {
          Object.entries(config?.[sec] || {}).forEach(([k, node]) => {
            if (!node || typeof node !== "object") return;
            (node.models || []).forEach((c, i) => {
              if (!c || c.connection !== id) return;
              if (!(c.base_url || "").trim()) update(`${sec}.${k}.models.${i}.base_url`, conn.base_url || "");
              if (!(c.api_key || "").trim()) update(`${sec}.${k}.models.${i}.api_key`, conn.api_key || "");
              update(`${sec}.${k}.models.${i}.connection`, "");
            });
            if (node.connection === id) {
              if (!(node.base_url || "").trim()) update(`${sec}.${k}.base_url`, conn.base_url || "");
              if (!(node.api_key || "").trim()) update(`${sec}.${k}.api_key`, conn.api_key || "");
              update(`${sec}.${k}.connection`, "");
            }
          });
        });
        update("connections", connList().filter(c => c.id !== id));
        setConnTest(m => { const n = { ...m }; delete n[id]; return n; });
      };
      // 测试连通：直接复用 /api/models（能拉到模型列表即视为可用）
      const testConnection = async (c) => {
        setConnTest(m => ({ ...m, [c.id]: { state: "loading" } }));
        try {
          const resp = await fetch("/api/models", {
            method: "POST", headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ base_url: c.base_url || "", api_key: c.api_key || "" }),
          });
          let data = {};
          try { data = await resp.json(); } catch (e) {}
          if (!resp.ok) throw new Error(data.detail || ("HTTP " + resp.status));
          const n = (data.models || []).length;
          setConnTest(m => ({ ...m, [c.id]: n ? { state: "ok", count: n } : { state: "empty" } }));
        } catch (e) {
          setConnTest(m => ({ ...m, [c.id]: { state: "fail", err: e.message } }));
        }
      };
      const renderConnections = () => {
        const conns = connList();
        return html`
          <div style=${{ display: "flex", alignItems: "center", gap: "10px", margin: "2px 0 6px" }}>
            <div class="cfg-sec-hint" style=${{ flex: "1 1 auto" }}>
              供下方全部槽位复用，改一处即全局生效
            </div>
            <button type="button" class="icon-btn" onClick=${addConnection}>+ 新增连接</button>
          </div>
          ${conns.length === 0
            ? html`<div class="config-form" style=${{ marginTop: "4px" }}><div class="note" style=${{ margin: 0 }}>还没有连接。加一个连接（base_url + api_key），下面所有模型槽位就能直接选用，不必逐个重复填写；改 key 只需改这一处。</div></div>`
            : html`<div class="slot-list">
                ${conns.map(c => {
                  const t = connTest[c.id] || {};
                  const used = connUsage(c.id);
                  const k = "conn-" + c.id;
                  const open = !!openSlots[k];
                  return html`
                    <div class="slot-item" key=${c.id}>
                      <div class=${"slot-row" + (open ? " open" : "")} onClick=${() => toggleSlot(k)}>
                        <span class=${"slot-dot" + (t.state === "ok" ? " on" : "")}></span>
                        <span class="slot-name">${c.name || c.id}</span>
                        <span class="slot-model">${c.base_url || "（未填 base_url）"}</span>
                        <span class="slot-meta">${c.api_key ? "key ✓" : "无 key"}</span>
                        <span class="slot-meta">${used} 引用</span>
                        <span class="slot-actions" onClick=${e => e.stopPropagation()}>
                          <button type="button" class="icon-btn" disabled=${t.state === "loading"}
                            onClick=${() => testConnection(c)}>${t.state === "loading" ? "…" : "测试"}</button>
                          <button type="button" class="icon-btn danger" onClick=${() => deleteConnection(c.id)}
                            title=${"删除并清除 " + used + " 处引用"}>删</button>
                        </span>
                        <span class="slot-meta">${open ? "▾" : "▸"}</span>
                      </div>
                      ${t.state === "fail" && html`<div class="error" style=${{ padding: "0 12px 8px", margin: 0 }}>${t.err}</div>`}
                      ${t.state === "ok" && html`<div class="note" style=${{ padding: "0 12px 8px", margin: 0, color: "var(--accent-2)" }}>连通正常，可用模型 ${t.count} 个</div>`}
                      ${t.state === "empty" && html`<div class="note" style=${{ padding: "0 12px 8px", margin: 0 }}>接口可达，但未返回模型列表（部分厂商不开放 /models）</div>`}
                      ${open && html`<div class="slot-body">
                        <div class="form-row" style=${{ marginTop: "10px" }}><label>显示名称</label>
                          <input value=${c.name || ""} onInput=${e => updateConnection(c.id, "name", e.target.value)}
                            placeholder="如 鲸鱼云 / 阶跃" /></div>
                        <div class="form-row"><label>API Base URL</label>
                          <input value=${c.base_url || ""} onInput=${e => updateConnection(c.id, "base_url", e.target.value)}
                            placeholder="https://api.example.com/v1" /></div>
                        <div class="form-row"><label>API Key</label>
                          <input type="password" value=${c.api_key || ""} onInput=${e => updateConnection(c.id, "api_key", e.target.value)}
                            placeholder="sk-..." /></div>
                        <div class="note" style=${{ margin: 0 }}>连接 id：<code>${c.id}</code>（改名不影响引用）</div>
                      </div>`}
                    </div>`;
                })}
              </div>`}`;
      };

      const save = async () => {
        setError(null);
        try {
          const resp = await fetch("/api/config", {
            method: "POST", headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ config }),
          });
          if (!resp.ok) {
            let detail = "保存失败（HTTP " + resp.status + "）";
            try { const d = await resp.json(); if (d && d.detail) detail = typeof d.detail === "string" ? d.detail : JSON.stringify(d.detail); } catch (e) {}
            throw new Error(detail);
          }
          setSaved(true);
          setSavedSnap(cloneCfg(config));
          // Reload voices after save to reflect the new config
          fetch("/api/tts/voices").then(r => r.json()).then(d => {
            setVoices({ edge: d.edge || [], cloud: d.cloud || [], current: d.current || "" });
          }).catch(() => {});
        } catch (e) { setError("保存失败: " + e.message); }
      };

      const update = (path, value) => {
        setConfig(prev => {
          // prev 为 null（配置还没加载完用户就操作）时直接跳过，避免 JSON.stringify(null) -> "null"
          if (!prev || typeof prev !== "object") return prev;
          const next = JSON.parse(JSON.stringify(prev));
          const keys = path.split(".");
          let node = next;
          for (let i = 0; i < keys.length - 1; i++) {
            const k = keys[i];
            // 中间层缺失或不是对象时按需创建：原实现直接 node = node[k]，
            // 一旦某层不存在，下一轮就是 undefined[k] -> TypeError，整个面板白屏。
            // 下一段 key 是纯数字则建数组，否则建对象。
            if (node[k] === null || typeof node[k] !== "object") {
              node[k] = /^\d+$/.test(keys[i + 1]) ? [] : {};
            }
            node = node[k];
          }
          node[keys[keys.length - 1]] = value;
          return next;
        });
        setSaved(false);
      };

      // ---- twist pool 编辑器（推荐混合方案：4 维可手动增删改 + 🎲 大模型生成） ----
      const poolDims = ["theme", "style", "constraint", "twist"];
      const dimCn = { theme: "主题", style: "风格", constraint: "约束", twist: "反转" };
      const getPool = (dim) => (config?.randomness?.pool?.[dim] || []);

      const editItem = (dim, idx, val) => {
        const arr = [...getPool(dim)];
        arr[idx] = val;
        update(`randomness.pool.${dim}`, arr);
      };
      const removeItem = (dim, idx) => {
        update(`randomness.pool.${dim}`, getPool(dim).filter((_, i) => i !== idx));
      };
      const addItem = (dim) => {
        const v = (poolUI.addText?.[dim] || "").trim();
        if (!v) return;
        if (getPool(dim).includes(v)) {  // 去重校验
          setPoolUI(s => ({ ...s, addText: { ...s.addText, [dim]: "" } }));
          return;
        }
        update(`randomness.pool.${dim}`, [...getPool(dim), v]);
        setPoolUI(s => ({ ...s, addText: { ...s.addText, [dim]: "" } }));
      };
      const genSeed = async (dim) => {
        setPoolUI(s => ({ ...s, gen: { ...s.gen, [dim]: true }, genErr: { ...s.genErr, [dim]: null } }));
        try {
          const resp = await fetch("/api/generate-seed", {
            method: "POST", headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ dimension: dim, existing: getPool(dim) }),
          });
          const data = await resp.json();
          if (!resp.ok) throw new Error(data.detail || "生成失败");
          const v = (data.seed || "").trim();
          if (!v) throw new Error("模型返回为空");
          if (!getPool(dim).includes(v)) update(`randomness.pool.${dim}`, [...getPool(dim), v]);
        } catch (e) {
          setPoolUI(s => ({ ...s, genErr: { ...s.genErr, [dim]: e.message } }));
        } finally {
          setPoolUI(s => ({ ...s, gen: { ...s.gen, [dim]: false } }));
        }
      };
      const resetPool = () => {
        if (initialPoolRef.current) update("randomness.pool", JSON.parse(JSON.stringify(initialPoolRef.current)));
      };
      const refreshAllSeeds = async () => {
        setRefreshingAll(true); setRefreshErr(null);
        try {
          const resp = await fetch("/api/seed/refresh-all", { method: "POST" });
          const data = await resp.json();
          if (!resp.ok) throw new Error(data.detail || "刷新失败");
          update("randomness.pool", data.pool);
        } catch (e) {
          setRefreshErr(e.message);
        } finally {
          setRefreshingAll(false);
        }
      };
      const [refreshingAll, setRefreshingAll] = useState(false);
      const [refreshErr, setRefreshErr] = useState(null);

      // ---- code 模式独立工具池（与全局池同能力：手动增删 + 🎲 生成 + 整体刷新） ----
      const codeModeIdx = () => { const ms = config?.modes || []; return ms.findIndex(m => m.id === "code"); };
      const getModePool = (dim) => { const i = codeModeIdx(); return (i >= 0 && config?.modes?.[i]?.pool?.[dim]) || []; };
      const [modePoolUI, setModePoolUI] = useState({ addText: {}, gen: {}, genErr: {} });
      const [modeRefreshing, setModeRefreshing] = useState(false);
      const [modeRefreshErr, setModeRefreshErr] = useState(null);
      const modePoolPath = (dim) => {
        const idx = codeModeIdx();
        if (idx < 0) return null;
        return `modes.${idx}.pool.${dim}`;
      };
      const editModeItem = (dim, idx, val) => {
        const path = modePoolPath(dim);
        if (!path) return;
        const arr = [...getModePool(dim)];
        arr[idx] = val;
        update(path, arr);
      };
      const removeModeItem = (dim, idx) => {
        const path = modePoolPath(dim);
        if (!path) return;
        update(path, getModePool(dim).filter((_, i) => i !== idx));
      };
      const addModeItem = (dim) => {
        const path = modePoolPath(dim);
        if (!path) return;
        const v = (modePoolUI.addText?.[dim] || "").trim();
        if (!v || getModePool(dim).includes(v)) return;
        update(path, [...getModePool(dim), v]);
        setModePoolUI(s => ({ ...s, addText: { ...s.addText, [dim]: "" } }));
      };
      const genModeSeed = async (dim) => {
        setModePoolUI(s => ({ ...s, gen: { ...s.gen, [dim]: true }, genErr: { ...s.genErr, [dim]: null } }));
        try {
          const resp = await fetch("/api/generate-seed", {
            method: "POST", headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ dimension: dim, existing: getModePool(dim), mode_id: "code" }),
          });
          const data = await resp.json();
          if (!resp.ok) throw new Error(data.detail || "生成失败");
          const v = (data.seed || "").trim();
          if (!v) throw new Error("模型返回为空");
          const path = modePoolPath(dim);
          if (path && !getModePool(dim).includes(v)) update(path, [...getModePool(dim), v]);
        } catch (e) {
          setModePoolUI(s => ({ ...s, genErr: { ...s.genErr, [dim]: e.message } }));
        } finally {
          setModePoolUI(s => ({ ...s, gen: { ...s.gen, [dim]: false } }));
        }
      };
      const refreshModeSeeds = async () => {
        const idx = codeModeIdx();
        if (idx < 0) return;
        setModeRefreshing(true); setModeRefreshErr(null);
        try {
          const resp = await fetch("/api/seed/refresh-all", {
            method: "POST", headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ mode_id: "code" }),
          });
          const data = await resp.json();
          if (!resp.ok) throw new Error(data.detail || "刷新失败");
          update(`modes.${idx}.pool`, data.pool);
        } catch (e) {
          setModeRefreshErr(e.message);
        } finally {
          setModeRefreshing(false);
        }
      };

      // 每个模型槽位的「获取模型列表」状态：以 basePath 为 key 存 {models, fetching, err}
      const [slotState, setSlotState] = useState({});
      const fetchModels = async (basePath, keyMap) => {
        setSlotState(s => ({ ...s, [basePath]: { ...(s[basePath]||{}), fetching: true, err: null } }));
        try {
          // 嵌套解析 basePath（如 "agents.creative"），避免 config["agents.creative"] 直接索引为 undefined
          const resolve = (path, obj) => path.split(".").reduce((acc, k) => (acc && acc[k] !== undefined ? acc[k] : undefined), obj) || {};
          const node = resolve(basePath, config);
          // 槽位若引用了连接，凭据以连接为准（与运行时 _resolve_models 的优先级一致）
          const conn = connById(node.connection) || {};
          const body = {
            base_url: conn.base_url || node[keyMap.base_url] || config.global?.default_base_url || "",
            api_key: conn.api_key || node[keyMap.api_key] || config.global?.default_api_key || "",
          };
          const resp = await fetch("/api/models", {
            method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body),
          });
          const data = await resp.json();
          if (!resp.ok) throw new Error(data.detail || "获取失败");
          setSlotState(s => ({ ...s, [basePath]: { models: data.models || [], fetching: false, err: null } }));
        } catch (e) {
          setSlotState(s => ({ ...s, [basePath]: { ...(s[basePath]||{}), fetching: false, err: e.message } }));
        }
      };

      // 渲染一个模型配置组（base_url + api_key + 模型下拉/手填）
      // ---- 模型/音色选择器：有选项列表时用 <select>（可随时改选）；下拉恒含「自定义…」项，
      // 选择后显示手填输入框（保留自由输入）；无列表时退化为单个普通输入框 ----
      const [customSel, setCustomSel] = useState({});
      const picker = ({ key, value, options, onPick, placeholder, emptyLabel }) => {
        const v = (value || "").trim();
        const opts = options || [];
        if (opts.length === 0) {
          return html`<input value=${v} placeholder=${placeholder || "手填"} onInput=${e => onPick(e.target.value)} style=${{ flex: 1 }} />`;
        }
        const inList = opts.includes(v);
        const isCustom = !!customSel[key];
        const effective = isCustom || (v !== "" && !inList);
        const selValue = effective ? "__custom__" : v;
        return html`
          <div style=${{ display: "flex", gap: "6px", flex: 1, minWidth: 0 }}>
            <select value=${selValue}
              onInput=${e => { const sv = e.target.value; if (sv === "__custom__") { setCustomSel(m => ({ ...m, [key]: true })); } else { setCustomSel(m => ({ ...m, [key]: false })); onPick(sv); } }}
              style=${{ flex: 1, minWidth: 0, height: "36px", background: "var(--panel-2)", color: "var(--text)", border: "1px solid var(--border)", borderRadius: "8px", padding: "0 8px", fontSize: 13 }}>
              ${!effective && v === "" ? html`<option value="">${emptyLabel || "（留空）"}</option>` : ""}
              <option value="__custom__">（自定义…）</option>
              ${opts.map(o => html`<option value=${o} selected=${o === v}>${o}</option>`)}
            </select>
            ${effective ? html`<input value=${v} placeholder=${placeholder || "自定义"} onInput=${e => { const newValue = e.target.value; onPick(newValue); if (opts.includes(newValue.trim())) { setCustomSel(m => ({ ...m, [key]: false })); } }} style=${{ flex: 1 }} />` : ""}
          </div>`;
      };

      const renderModelSlot = ({ title, note, basePath, keyMap, config, update }) => {
        // 嵌套解析 basePath（如 "agents.creative"），避免 config["agents.creative"] 直接索引为 undefined
        const node = basePath.split(".").reduce((acc, k) => (acc && acc[k] !== undefined ? acc[k] : undefined), config) || {};
        const st = slotState[basePath] || {};
        const getv = k => node[keyMap[k]] || "";
        const setv = (k, v) => update(basePath + "." + keyMap[k], v);
        const advKey = "adv-" + basePath;
        const adv = !!advOpen[advKey];
        const advBadge = [
          getv("thinking") && getv("thinking") !== "default" ? getv("thinking") : "",
          getv("thinking_profile") || "",
          getv("max_tokens") ? "max " + getv("max_tokens") : "",
          getv("timeout") ? getv("timeout") + "s" : "",
        ].filter(Boolean).join(" · ");
        const slotOpen = !isCollapsed(basePath);
        const mdl = (getv("model") || "").trim();
        const host = slotHost(getv("base_url"));
        return html`
          <div class="slot-group">
            <div class=${"slot-group-head" + (slotOpen ? " open" : "")} onClick=${() => toggleCollapse(basePath)}>
              <span class="slot-group-caret">${slotOpen ? "▾" : "▸"}</span>
              <span class="slot-group-title">${title}</span>
              ${mdl
                ? html`<span class="slot-group-model">${mdl}</span>`
                : html`<span class="slot-group-model empty">未配置 · 回退内置默认</span>`}
              ${host ? html`<span class="slot-group-meta">${host}</span>` : ""}
            </div>
            ${slotOpen && html`<div class="slot-group-body">
              ${note && html`<div class="note" style=${{ marginBottom: 8 }}>${note}</div>`}
              <div class="form-row"><label>API Base URL</label>
              <input value=${getv("base_url")} onInput=${e => setv("base_url", e.target.value)} placeholder="留空=用全局默认" /></div>
            <div class="form-row"><label>API Key</label>
              <input type="password" value=${getv("api_key")} onInput=${e => setv("api_key", e.target.value)} placeholder="留空=用全局默认" /></div>
            <div class="form-row"><label>模型 model（填好上方 base_url / key 后可点按钮拉取列表选择）</label>
              <div style=${{display:"flex", gap:"8px"}}>
                ${picker({ key: "slot-" + basePath, value: getv("model"), options: st.models || [], onPick: v => setv("model", v),
                  placeholder: "留空=用全局默认；或从下拉选 / 手填", emptyLabel: "（留空=用全局默认）" })}
                <button type="button" class="save-btn" style=${{padding:"8px 12px", whiteSpace:"nowrap"}}
                  disabled=${st.fetching} onClick=${() => fetchModels(basePath, keyMap)}>
                  ${st.fetching ? "获取中…" : "获取模型列表"}
                </button>
              </div>
              ${(st.models||[]).length > 0 && html`<div class="note">已获取 ${st.models.length} 个模型，点下拉可随时改选。</div>`}
              ${st.err && html`<div class="error">${st.err}</div>`}
            </div>
            <div class="adv-toggle" onClick=${() => toggleAdv(advKey)}>
              ${adv ? "▾" : "▸"} 高级：思考模式 / 预算 / 超时${advBadge ? "（" + advBadge + "）" : ""}
            </div>
            ${adv && html`<div class="adv-body">
              ${thinkingSelect(getv("thinking"), v => setv("thinking", v))}
              ${profileSelect(getv("thinking_profile"), v => setv("thinking_profile", v))}
              ${capabilitySelect(getv("thinking_capability"), v => setv("thinking_capability", v))}
              <${MaxTokensInput} id=${"maxtok-" + basePath} value=${getv("max_tokens")}
                onChange=${v => setv("max_tokens", v)} />
              <${TimeoutInput} id=${"to-" + basePath} value=${getv("timeout")}
                onChange=${v => setv("timeout", v)} />
            </div>`}
            </div>`}
          </div>`;
      };

      // ---- 多模型卡片列表编辑器：折叠 / 手动排序↑↓ / 删除(无确认) / 新增 / 空提示 ----
      // 每个 section（如 agents.creative）在 config 中对应一个 models: [] 卡片数组，
      // 运行时按序 fallback（上一个失败自动用下一个）。折叠状态用 localStorage 持久化。
      const KNOWN_MODEL_SECTIONS = ["global","agents.creative","agents.planner","agents.executor","providers.image","providers.video","providers.tts","providers.game"];
      // 折叠状态按分组持久化。默认折叠：8 个分组全展开就是 8 屏，用户只需要看摘要。
      const GRP_KEY = "mf:grp:";
      const [collapseMap, setCollapseMap] = useState({});
      useEffect(() => {
        const m = {};
        KNOWN_MODEL_SECTIONS.forEach(bp => {
          const k = GRP_KEY + bp;
          let v = true;
          try { const raw = localStorage.getItem(k); if (raw !== null) v = raw === "1"; } catch (e) {}
          m[k] = v;
        });
        setCollapseMap(m);
      }, []);
      // 初始化完成前也按「折叠」处理，避免首帧闪一下全展开
      const isCollapsed = (basePath) => {
        const k = GRP_KEY + basePath;
        return (k in collapseMap) ? !!collapseMap[k] : true;
      };
      const toggleCollapse = (basePath) => {
        const k = GRP_KEY + basePath;
        const nv = !isCollapsed(basePath);
        try { localStorage.setItem(k, nv ? "1" : "0"); } catch (e) {}
        setCollapseMap(m => ({ ...m, [k]: nv }));
      };
      const setAllGroups = (collapsed) => {
        const m = {};
        KNOWN_MODEL_SECTIONS.forEach(bp => {
          const k = GRP_KEY + bp;
          m[k] = collapsed;
          try { localStorage.setItem(k, collapsed ? "1" : "0"); } catch (e) {}
        });
        setCollapseMap(m);
      };
      const resolvePath = (path, obj) =>
        path.split(".").reduce((acc, k) => (acc && acc[k] !== undefined ? acc[k] : undefined), obj) || {};
      const getModelsList = (basePath) => {
        const node = resolvePath(basePath, config);
        return (node && Array.isArray(node.models)) ? node.models : [];
      };

      const renderModelCard = (basePath, idx, card, total) => {
        const cardPath = basePath + ".models." + idx;
        const st = slotState[cardPath] || {};
        const getv = (k) => (card && card[k] != null) ? card[k] : "";
        const setv = (k, v) => update(cardPath + "." + k, v);
        const swap = (dir) => {
          const arr = getModelsList(basePath);
          const j = idx + dir;
          if (j < 0 || j >= arr.length) return;
          const next = [...arr];
          const t = next[idx]; next[idx] = next[j]; next[j] = t;
          update(basePath + ".models", next);
        };
        const del = () => {
          // 删除无需确认，直接移除该卡片
          const arr = getModelsList(basePath);
          update(basePath + ".models", arr.filter((_, i) => i !== idx));
        };
        const tv = getv("temperature");
        const open = !!openSlots[cardPath];
        const adv = !!advOpen["adv-" + cardPath];
        const mdl = (getv("model") || "").trim();
        const connId = (getv("connection") || "").trim();
        const conn = connById(connId);
        // 摘要行显示「生效地址」：选了连接就用连接地址，否则用卡片自身的
        const host = slotHost(conn ? conn.base_url : getv("base_url"));
        const advBadge = [
          getv("thinking") && getv("thinking") !== "default" ? getv("thinking") : "",
          getv("thinking_profile") || "",
          getv("max_tokens") ? "max " + getv("max_tokens") : "",
          getv("timeout") ? getv("timeout") + "s" : "",
        ].filter(Boolean).join(" · ");
        // 折叠态 = 单行摘要（序号 · 模型 · host · 温度 · 状态点 · 排序/删除）；点击整行展开编辑。
        // 展开态只常显「模型 / base_url / key / 温度」，思考与预算收进「高级」折叠区。
        return html`
          <div key=${card._id || idx} class="slot-item">
            <div class=${"slot-row" + (open ? " open" : "")} onClick=${() => toggleSlot(cardPath)}>
              <span class="slot-idx">${idx + 1}</span>
              <span class=${"slot-model" + (mdl ? "" : " empty")}>${mdl || "（未填 · 回退上级默认）"}</span>
              ${conn ? html`<span class="slot-meta" style=${{ color: "var(--accent-2)" }}>${conn.name || conn.id}</span>` : ""}
              ${host ? html`<span class="slot-meta">${host}</span>` : ""}
              ${(tv !== "" && tv != null) ? html`<span class="slot-meta">T ${tv}</span>` : ""}
              <span class=${"slot-dot" + (mdl ? " on" : "")}></span>
              <span class="slot-actions" onClick=${e => e.stopPropagation()}>
                <button type="button" class="icon-btn" disabled=${idx === 0} onClick=${() => swap(-1)} title="上移">↑</button>
                <button type="button" class="icon-btn" disabled=${idx === total - 1} onClick=${() => swap(1)} title="下移">↓</button>
                <button type="button" class="icon-btn danger" onClick=${del} title="删除（无确认）">删</button>
              </span>
              <span class="slot-meta">${open ? "▾" : "▸"}</span>
            </div>
            ${open && html`<div class="slot-body">
              <div class="form-row" style=${{ marginTop:"10px" }}><label>模型 model</label>
                <div style=${{ display:"flex", gap:"8px" }}>
                  ${picker({ key: "card-" + cardPath, value: getv("model"), options: st.models || [], onPick: v => setv("model", v),
                    placeholder: "模型名，如 gpt-4o-mini-tts", emptyLabel: "（手填）" })}
                  <button type="button" class="save-btn" style=${{ padding:"8px 12px", whiteSpace:"nowrap" }}
                    disabled=${st.fetching} onClick=${() => fetchModels(cardPath, { model:"model", base_url:"base_url", api_key:"api_key" })}>
                    ${st.fetching ? "获取中…" : "获取列表"}</button>
                </div>
                ${(st.models || []).length > 0 && html`<div class="note">已获取 ${st.models.length} 个模型，点下拉可随时改选。</div>`}
                ${st.err && html`<div class="error">${st.err}</div>`}
              </div>
              <div class="form-row"><label>连接（复用 base_url + api_key）</label>
                <select value=${connId}
                  onChange=${e => { const v = e.target.value; setv("connection", v); if (v) { setv("base_url", ""); setv("api_key", ""); } }}
                  style=${{ height: "36px", background: "var(--panel)", color: "var(--text)", border: "1px solid var(--border)", borderRadius: "8px", padding: "0 8px", fontSize: 13 }}>
                  <option value="">（不用连接 · 下方手填）</option>
                  ${connList().map(c => html`<option value=${c.id}>${c.name || c.id} — ${slotHost(c.base_url)}</option>`)}
                </select>
              </div>
              ${conn
                ? html`<div class="note" style=${{ margin: "-6px 0 12px" }}>走连接「${conn.name || conn.id}」：${conn.base_url || "（地址为空）"} · ${conn.api_key ? "key 已配置" : "key 未配置"}</div>`
                : html`
                  <div class="form-row"><label>API Base URL</label>
                    <input value=${getv("base_url")} onInput=${e => setv("base_url", e.target.value)} placeholder="留空=用全局默认" /></div>
                  <div class="form-row"><label>API Key</label>
                    <input type="password" value=${getv("api_key")} onInput=${e => setv("api_key", e.target.value)} placeholder="留空=用全局默认" /></div>`}
              <${TemperatureInput} id=${"temp-" + basePath + "-" + idx} value=${tv}
                onChange=${v => setv("temperature", v)} />
              <div class="adv-toggle" onClick=${() => toggleAdv("adv-" + cardPath)}>
                ${adv ? "▾" : "▸"} 高级：思考模式 / 预算 / 超时${advBadge ? "（" + advBadge + "）" : ""}
              </div>
              ${adv && html`<div class="adv-body">
                <${MaxTokensInput} id=${"maxtok-" + basePath + "-" + idx} value=${getv("max_tokens")}
                  onChange=${v => setv("max_tokens", v)} />
                <${TimeoutInput} id=${"to-" + basePath + "-" + idx} value=${getv("timeout")}
                  onChange=${v => setv("timeout", v)} />
                ${thinkingSelect(getv("thinking"), v => setv("thinking", v))}
                ${profileSelect(getv("thinking_profile"), v => setv("thinking_profile", v))}
                ${capabilitySelect(getv("thinking_capability"), v => setv("thinking_capability", v))}
              </div>`}
            </div>`}
          </div>`;
      };

      const renderModelCards = ({ title, basePath, note }) => {
        const all = getModelsList(basePath);
        const q = (cfgQuery || "").trim().toLowerCase();
        // 搜索命中：模型名 / 卡片地址 / 连接名 / 连接地址。（索引必须指回原数组，
        // 否则编辑会写到错误的卡片上）
        const pairs = q
          ? all.map((card, idx) => ({ card, idx }))
              .filter(({ card }) => {
                const c = connById(card.connection) || {};
                return [card.model, card.base_url, c.name, c.base_url]
                  .join(" ").toLowerCase().includes(q);
              })
          : all.map((card, idx) => ({ card, idx }));
        if (q && pairs.length === 0) return null;
        // 搜索时强制展开，否则「搜到了却看不见」
        const open = q ? true : !isCollapsed(basePath);
        const first = all[0] || {};
        const primary = (first.model || "").trim();
        const host = slotHost(first.base_url || (connById(first.connection) || {}).base_url);
        const add = () => update(basePath + ".models", [...all, { _id: "card_" + Math.random().toString(36).slice(2), model:"", base_url:"", api_key:"", temperature:null, thinking:"default", max_tokens:null, timeout:null }]);
        return html`
          <div class="slot-group">
            <div class=${"slot-group-head" + (open ? " open" : "")} onClick=${() => toggleCollapse(basePath)}>
              <span class="slot-group-caret">${open ? "▾" : "▸"}</span>
              <span class="slot-group-title">${title}</span>
              <span class="slot-group-count">${all.length} 个</span>
              ${primary
                ? html`<span class="slot-group-model">${primary}</span>`
                : html`<span class="slot-group-model empty">未配置 · 回退上级</span>`}
              ${primary && all.length > 1 ? html`<span class="slot-group-meta">+${all.length - 1}</span>` : ""}
              ${host ? html`<span class="slot-group-meta">${host}</span>` : ""}
            </div>
            ${open && html`<div class="slot-group-body">
              ${note && html`<div class="note" style=${{ marginBottom: 8 }}>${note}</div>`}
              <div class="cfg-sec-hint" style=${{ margin: "0 0 6px" }}>${pairs.length}${q ? " / " + all.length : ""} 个模型 · 运行时按序 fallback（上一个失败自动用下一个）</div>
              ${all.length === 0
                ? html`<div class="note" style=${{ color:"var(--muted)" }}>暂无模型卡片。若留空：Agent 执行回退全局默认模型；Provider 图片/视频回退另一 Provider 置顶项；TTS 回退免费 Edge TTS。</div>`
                : html`<div class="slot-list" style=${{ marginTop: 0 }}>${pairs.map(({ card, idx }) => renderModelCard(basePath, idx, card, all.length))}</div>`}
              <button type="button" class="save-btn"
                style=${{ marginTop:"10px", padding:"7px 14px", background:"transparent", color:"var(--accent)", borderColor:"var(--accent)" }}
                onClick=${add}>+ 添加模型</button>
            </div>`}
          </div>`;
      };

      const g = config?.global || {};
      const rnd = config?.randomness || {};
      const tp = config?.providers?.tts || {};

      return html`
        <div class="app">
          <header class="topbar">
            <h1>AI 盲盒</h1>
            <div class="tabs">
              <div class=${"tab " + (tab === "box" ? "active" : "")} onClick=${() => setTab("box")}>开盲盒</div>
              <div class=${"tab " + (tab === "history" ? "active" : "")} onClick=${() => { setTab("history"); loadHistory(); }}>历史</div>
              <div class=${"tab " + (tab === "stats" ? "active" : "")} onClick=${() => { setTab("stats"); loadStats(); }}>统计</div>
              <div class=${"tab " + (tab === "config" ? "active" : "")} onClick=${() => setTab("config")}>配置</div>
            </div>
          </header>
          <div class="banner">免构建演示页：用 preact + htm（已打包到本地 frontend/vendor，无需联网），无需 npm install。生产版请用 Vite 工程（npm install 后 npm run dev）。</div>

          <${ErrorBoundary}>
          ${tab === "box" && html`
            <div class="section-title">选择模式</div>
            <div class="mode-grid">
              ${modes.map(m => html`
                <div key=${m.id} class=${"mode-card " + (selected === m.id ? "selected" : "")}
                     onClick=${() => setSelected(m.id)}>
                  <div class="name">${m.name}</div>
                  <div class="desc">${m.executor_type}</div>
                </div>`)}
            </div>
            <div class="control-card">
              <div class="seed-edit">
                <input
                  class="seed-input"
                  value=${customSeed}
                  placeholder="自定义种子（可选）：手写灵感词，锁定开盒方向，如「赛博茶馆 雨天」"
                  onInput=${(e) => setCustomSeed(e.target.value)}
                />
                ${customSeed ? html`<div class="seed-lock-note">已锁定种子：${customSeed}（留空则随机抽取）</div>` : ""}
              </div>
              <div class="action-row">
                <button class="open-btn" disabled=${loading || !selected} onClick=${openBox}>
                  ${loading ? "⏳ 开启中…" : "🎁 开启盲盒"}
                </button>
                <div class="batch-group">
                  <span class="batch-label">连开</span>
                  <select class="batch-count" value=${batchCount}
                    title="连开数量"
                    onChange=${(e) => setBatchCount(Number(e.target.value))}>
                    ${[2, 3, 4, 5, 6].map(n => html`<option value=${n}>${n} 个</option>`)}
                  </select>
                  <button class="save-btn batch-btn" disabled=${loading || !selected} onClick=${runBatchOpen}>
                    ${batchTasks.length > 0 && batchTasks.some(t => t.status === "running") ? "连开中…" : "🎁 连开盲盒"}
                  </button>
                  ${batchTasks.length > 0 && batchTasks.some(t => t.status === "running") && html`
                    <button class="save-btn batch-btn batch-cancel" onClick=${cancelBatch}>取消全部</button>`}
                </div>
              </div>
            </div>
            ${loading && task && html`
              <div class="task-progress">
                <div class="task-bar-track"><div class="task-bar-fill" style=${{width: Math.round((task.progress || 0) * 100) + "%"}} /></div>
                <div class="task-status">
                  <span>${task.stage_label || "处理中"}</span>
                  <span style=${{color:"var(--muted)"}}>${task.elapsed >= 1 ? "已等待 " + Math.floor(task.elapsed) + "s" : ""}</span>
                </div>
                <button class="save-btn" style=${{padding:"6px 14px",background:"var(--danger)",borderColor:"var(--danger)",marginTop:6}} onClick=${cancelTask}>取消</button>
              </div>`}
            ${loading && liveStreams.length > 0 && html`<${LiveThinkingPanel} streams=${liveStreams} live=${true} />`}
            ${loading && streamNote && html`<div class="note" style=${{ marginTop: 8, color: "var(--muted)" }}>⚠️ ${streamNote}</div>`}
            ${error && html`<div class="error">${error}</div>`}
            ${batchError && html`<div class="error">${batchError}</div>`}
            ${batchTasks.length > 0 && html`
              <div class="batch-grid">
                ${batchTasks.map((bt, idx) => html`
                  <div class="batch-card" key=${bt.task_id}>
                    <div class="batch-head">#${idx + 1} ${bt.status === "done" ? "✓" : bt.status === "error" ? "✗" : bt.status === "cancelled" ? "✕" : "…"}</div>
                    ${bt.status === "done" && bt.result ? html`
                      <div class="seed-pill" style=${{ fontSize: 11, marginBottom: 6 }}>seed: ${bt.result.seed || "（无）"}</div>
                      <div class="concept" style=${{ fontSize: 12 }}>${(bt.result.concept || "").slice(0, 120)}${(bt.result.concept || "").length > 120 ? "…" : ""}</div>
                      <div class="batch-links">
                        <button class="save-btn" style=${{ padding: "4px 10px", fontSize: 12, marginTop: 8 }}
                          onClick=${() => setResult(bt.result)}>查看</button>
                        <button class="save-btn" style=${{ padding: "4px 10px", fontSize: 12, marginTop: 8, background: "transparent", color: "var(--muted)" }}
                          onClick=${() => { setSelected(m); runOpen(bt.result.mode, bt.result.seed); }}>同种子重开</button>
                      </div>`
                      : html`
                      <div class="task-bar-track" style=${{ marginTop: 6 }}><div class="task-bar-fill" style=${{ width: Math.round((bt.progress || 0) * 100) + "%" }} /></div>
                      <div class="task-status" style=${{ marginTop: 4, fontSize: 12 }}><span>${bt.stage_label || "处理中"}</span><span style=${{ color: "var(--muted)" }}>${bt.elapsed >= 1 ? Math.floor(bt.elapsed) + "s" : ""}</span></div>`}
                  </div>`)}
              </div>`}
            ${result && html`
              <div class="result">
                <div class="seed-pill">seed: ${result.seed}</div>
                <${ThinkingPanel} reasoning=${result.reasoning} />
                <h3>概念卡（创意 Agent）</h3>
                <div class="concept">${result.concept}</div>
                <h3>规划输出（规划 Agent）</h3>
                <div class="plan">${result.plan}</div>
                <h3>成品</h3>
                ${result.output_kind === "text" && html`<div class="concept">${result.output}</div>`}
                ${result.output_kind === "character_card" && html`
                  <div class="character-card">
                    ${result.image_url && html`
                      <div class="char-frame">
                        <img src=${mediaSrc({output: result.image_url})} alt="avatar" />
                      </div>`}
                    <div class="char-fields">
                      ${parseCharFields(result.output).map(f => html`
                        <div class="char-row">
                          <div class="char-label">${f.label}</div>
                          <div class="char-value">${f.value}</div>
                        </div>`)}
                    </div>
                  </div>`}
                ${result.output_kind === "spec_md" && html`<div class="plan">已生成 spec：<br/><code>${result.output}</code></div>${envCostCard(result)}`}
                ${result.output_kind === "image_url" && html`
                  ${mediaSrc(result)
                    ? (["recipe","tarot","character"].includes(result.mode)
                        ? html`<div style=${{display:"flex",flexDirection:"column",alignItems:"center",marginTop:"8px"}}>
                            <img src=${mediaSrc(result)} style=${{maxWidth:"480px",width:"100%",height:"auto",objectFit:"contain",borderRadius:"12px",display:"block",background:"var(--panel-2)"}} alt="result" />
                            ${result.caption ? html`<div style=${{maxWidth:"480px",width:"100%",marginTop:"10px",padding:"12px 14px",boxSizing:"border-box",background:"var(--panel-2)",border:"1px solid var(--border)",borderRadius:"12px",color:"var(--text)",fontSize:14,lineHeight:1.7,whiteSpace:"pre-wrap",wordBreak:"break-word",textAlign:"left",textShadow:"none"}}>${result.caption}</div>` : null}
                          </div>`
                        : html`<div style=${{position:"relative",display:"inline-block",maxWidth:"100%"}}>
                            <img src=${mediaSrc(result)} style=${{maxWidth:"100%",borderRadius:"12px",marginTop:"8px",display:"block"}} alt="result" />
                            ${result.caption ? html`<div style=${{position:"absolute",left:0,right:0,bottom:0,padding:"10px 12px",borderRadius:"0 0 12px 12px",color:"#fff",background:"linear-gradient(0deg, rgba(0,0,0,0.75), rgba(0,0,0,0))",fontSize:20,fontWeight:700,textAlign:"center",textShadow:"0 1px 3px rgba(0,0,0,0.5)"}}>${result.caption}</div>` : null}
                          </div>`)
                    : html`<div class="plan">${result.output}</div>`}`}
                ${result.output_kind === "video_file" && html`
                  ${mediaSrc(result)
                    ? html`<video src=${mediaSrc(result)} controls style=${{maxWidth:"100%",borderRadius:"12px",marginTop:"8px"}}></video>`
                    : html`<div class="plan">${result.output}</div>`}`}
                ${result.output_kind === "audio_file" && html`
                  ${mediaSrc(result)
                    ? html`<audio src=${mediaSrc(result)} controls preload="metadata" style=${{width:"100%",borderRadius:"12px",marginTop:"8px"}}></audio>`
                    : html`<div class="plan">${result.output}</div>`}`}
                ${(result.output_kind === "game_html" || result.output_kind === "quiz_html") && html`
                  ${mediaSrc(result)
                    ? html`<iframe src=${mediaSrc(result)} sandbox="allow-scripts" data-blindbox=${result.output_kind === "quiz_html" ? "quiz" : "game"} title=${result.output_kind === "quiz_html" ? "趣味测试" : "小游戏"} style=${{width:"100%",height:result.output_kind === "quiz_html" ? "650px" : "520px",border:"0",borderRadius:"12px",marginTop:"8px",display:"block"}}></iframe>`
                    : html`<div class="plan">${result.output}</div>`}
                  <div class="note" style=${{marginTop:"6px"}}>${result.output_kind === "quiz_html" ? "📝 趣味测试（逐题作答，完成后查看结果）" : "🎮 小游戏（点击操作；沙箱隔离运行）"}</div>`}
                ${result.output_kind === "song" && (() => {
                  let audio = "", lyrics = "", ttsInfo = "";
                  try {
                    const parsed = JSON.parse(result.output || "{}");
                    audio = parsed.audio || "";
                    lyrics = parsed.lyrics || "";
                    ttsInfo = parsed.tts_info || "";
                  } catch (e) { console.error("[demo] song parse:", e); }
                  const audioSrc = (() => {
                    if (!audio) return null;
                    if (/^https?:\/\//i.test(audio)) return audio;
                    if (audio.startsWith("/output/")) return outUrl(audio.slice("/output/".length)) || audio;
                    if (audio && !/^[a-zA-Z]:[\\/]/.test(audio) && !audio.startsWith("/")) return outUrl(audio);
                    return null;
                  })();
                  return html`
                    <div style=${{marginTop:8}}>
                      <div style=${{background:"var(--panel-2)",border:"1px solid var(--border)",borderRadius:14,padding:"16px 18px",whiteSpace:"pre-wrap",lineHeight:1.8,fontSize:15,color:"var(--text)",fontFamily:'"PingFang SC","Microsoft YaHei",serif',letterSpacing:0.5}}>
                        ${lyrics || "（歌词为空）"}
                      </div>
                      ${audioSrc && html`<audio src=${audioSrc} controls preload="metadata" style=${{width:"100%",borderRadius:"12px",marginTop:10,display:"block"}}></audio>`}
                      ${ttsInfo && html`<div style=${{marginTop:4,fontSize:12,color:"var(--muted)"}}>${ttsInfo}</div>`}
                    </div>`;
                })()}
                ${result.output_kind === "image_strip" && (() => {
                  let pages = [];
                  try {
                    const parsed = JSON.parse(result.output || "{}");
                    if (Array.isArray(parsed.pages)) pages = parsed.pages;
                  } catch (e) { console.error("[demo] image_strip parse:", e); }
                  if (pages.length === 0) return html`<div class="plan">（插画故事生成中，未获取到图片）</div>`;
                  return html`
                    <div style=${{display:"flex",gap:10,overflowX:"auto",padding:"8px 0",marginTop:8,scrollSnapType:"x mandatory"}}>
                      ${pages.map((p, i) => {
                        const src = (() => {
                          if (p.local) return outUrl(p.local);
                          const u = p.url || "";
                          if (/^https?:\/\//i.test(u)) return u;
                          if (u.startsWith("/output/")) return outUrl(u.slice("/output/".length)) || u;
                          if (u && !/^[a-zA-Z]:[\\/]/.test(u) && !u.startsWith("/")) return outUrl(u);
                          return null;
                        })();
                        return html`
                          <div key=${i} style=${{flex:"0 0 auto",width:"75%",maxWidth:400,scrollSnapAlign:"start",borderRadius:12,overflow:"hidden",background:"#0b1220"}}>
                            ${src
                              ? html`<img src=${src} alt=${"page-" + (i+1)} style=${{width:"100%",display:"block",borderRadius:12}} />`
                              : html`<div style=${{padding:"40px 16px",color:"#888",textAlign:"center",fontSize:13}}>第 ${i+1} 页（图片未生成）</div>`}
                            <div style=${{padding:"6px 10px",fontSize:11,color:"#888",background:"var(--panel-2)"}}>第 ${i+1} / ${pages.length} 页</div>
                          </div>`;
                      })}
                    </div>`;
                })()}
                ${result.model_used ? html`<div class="model-hint">由 ${result.model_used} 生成</div>` : null}
                ${(() => {
                  const u = result.usage || null;
                  const tt = u && Number(u.total_tokens || 0);
                  const pt = u ? Number(u.prompt_tokens || 0) : 0;
                  const ct = u ? Number(u.completion_tokens || 0) : 0;
                  const cost = tokensPrice && (pt || ct) ? ((pt + ct) / 1000.0 * tokensPrice).toFixed(4) : null;
                  if (!tt && !cost) return null;
                  return html`<div style=${{marginTop:4,fontSize:12,color:"var(--muted)"}}>${[tt ? tt.toLocaleString() + " tokens" : null, cost ? "约 ¥" + cost : null].filter(Boolean).join(" · ")}</div>`;
                })()}
                ${result.archived && html`
                  <div class="archive-box">
                    <span class="archive-badge">✓ 已自动归档</span>
                    <span class="archive-time">${result.archived.timestamp}</span>
                    <div class="archive-links">
                      <a href=${outUrl(result.archived.json) || ""} target="_blank" rel="noreferrer">归档记录 (JSON)</a>
                      ${result.archived.local_file
                        ? html`<a href=${outUrl(result.archived.local_file) || ""} target="_blank" rel="noreferrer">${result.archived.local_file.endsWith(".md") ? "文字成品" : "图片成品"}</a>`
                        : result.output_kind === "image_url" || result.output_kind === "video_file" || result.output_kind === "image_strip"
                          ? html`<span class="archive-note">（远程成品未下载到本地，可手动保存）</span>`
                          : null}
                      ${result.archived.text_file && result.archived.text_file !== result.archived.local_file
                        ? html`<a href=${outUrl(result.archived.text_file) || ""} target="_blank" rel="noreferrer">文字成品</a>`
                        : null}
                      ${result.image_url && /\.(png|jpe?g|gif|webp)$/i.test(result.image_url)
                        ? html`<a href=${outUrl(result.image_url) || ""} target="_blank" rel="noreferrer">图片成品</a>`
                        : null}
                    </div>
                  </div>`}
                <button class="open-btn" style="margin-top:16px" onClick=${openBox}>再抽一次（换种子）</button>
              </div>`}
          `}

          ${tab === "config" && config && html`
            <div class="cfg-layout">
              <nav class="cfg-nav">
                ${CFG_NAV.map(s => html`<div key=${s.id} class=${"cfg-nav-item" + (cfgActive === s.id ? " active" : "")} onClick=${() => jumpCfg(s.id)}>${s.label}</div>`)}
              </nav>
              <div class="cfg-main">

              <section id="cfg-connect" class="cfg-sec">
                <div class="cfg-sec-head">模型与连接<span class="cfg-sec-hint">同一槽位内自上而下按序 fallback；留空即回退全局默认</span></div>
                <div class="cfg-toolbar">
                  <input class="seed-input" style=${{ flex: "1 1 auto", minWidth: "150px", maxWidth: "320px" }}
                    placeholder="搜索模型 / host / 连接名…" value=${cfgQuery}
                    onInput=${e => setCfgQuery(e.target.value)} />
                  ${cfgQuery ? html`<button type="button" class="icon-btn" onClick=${() => setCfgQuery("")}>清除</button>` : ""}
                  <button type="button" class="icon-btn" onClick=${() => setAllGroups(false)}>全部展开</button>
                  <button type="button" class="icon-btn" onClick=${() => setAllGroups(true)}>全部折叠</button>
                  <span class="cfg-sec-hint" style=${{ marginLeft: "auto", whiteSpace: "nowrap" }}>
                    ${connList().length} 个连接 · ${slotTotal()} 个模型槽位
                  </span>
                </div>
                ${renderConnections()}
            ${renderModelSlot({title:"全局默认模型", note:"各 Agent / Provider 留空时回退到这里", basePath:"global", keyMap:{model:"default_model",base_url:"default_base_url",api_key:"default_api_key",thinking:"default_thinking",thinking_profile:"default_thinking_profile",thinking_capability:"default_thinking_capability",max_tokens:"default_max_tokens",timeout:"default_timeout"}, config, update, fetchModels})}

            ${["creative","planner","executor"].map(key => {
              const titles = {creative:"Agent1 · 创意", planner:"Agent2 · 规划", executor:"Agent3 · 执行"};
              const notes = {creative:"高温度，脑洞大", planner:"低温度，严谨格式化", executor:"图片 / 视频由下方 provider 覆盖"};
