<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI 盲盒（免构建演示）</title>
  <style>
    :root{
      --bg:#0f1115;--panel:#171a21;--panel-2:#1f232c;--border:#2a2f3a;
      --text:#e6e8ec;--muted:#9aa0aa;--accent:#7f77dd;--accent-2:#1d9e75;--danger:#e24b4a;
    }
    *{box-sizing:border-box}
    body{margin:0;font-family:-apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
      background:var(--bg);color:var(--text)}
    .app{max-width:980px;margin:0 auto;padding:24px 20px 64px}
    header.topbar{display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100;background:var(--bg);padding:12px 0 10px;margin-bottom:14px;border-bottom:1px solid var(--border)}
    header.topbar h1{font-size:22px;font-weight:600;margin:0}
    .tabs{display:flex;gap:8px}
    .tab{padding:6px 14px;border-radius:8px;cursor:pointer;background:var(--panel);
      border:1px solid var(--border);color:var(--muted);font-size:14px}
    .tab.active{background:var(--accent);color:#fff;border-color:var(--accent)}
    .section-title{font-size:15px;font-weight:600;margin:18px 0 10px}
    .mode-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:12px}
    .mode-card{background:var(--panel);border:1px solid var(--border);border-radius:12px;
      padding:16px;cursor:pointer;text-align:center;transition:.15s}
    .mode-card:hover{border-color:var(--accent)}
    .mode-card.selected{border-color:var(--accent);background:var(--panel-2)}
    .mode-card .name{font-size:16px;font-weight:600}
    .mode-card .desc{font-size:12px;color:var(--muted);margin-top:6px}
    .open-btn{flex:1 1 0;min-width:0;padding:13px;border-radius:12px;border:none;
      background:linear-gradient(90deg,var(--accent),var(--accent-2));color:#fff;
      font-size:15px;font-weight:600;cursor:pointer;transition:opacity .15s}
    .open-btn:disabled{opacity:.5;cursor:not-allowed}
    .seed-edit{display:flex;flex-direction:column;gap:6px}
    .seed-input{width:100%;background:var(--panel-2);
      border:1px solid var(--border);border-radius:10px;padding:11px 12px;color:var(--text);
      font-size:13px;font-family:inherit;box-sizing:border-box}
    .seed-input:focus{outline:none;border-color:var(--accent)}
    .seed-lock-note{font-size:12px;color:var(--accent-2)}
    /* 开盒操作控制台：与模式网格同宽，统一卡片式容器 */
    .control-card{margin-top:18px;background:var(--panel);border:1px solid var(--border);
      border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:14px}
    .action-row{display:flex;gap:12px;align-items:stretch}
    .batch-group{flex:1 1 0;min-width:0;display:flex;align-items:center;gap:8px;
      background:var(--panel-2);border:1px solid var(--border);border-radius:12px;padding:6px 8px}
    .batch-label{font-size:13px;color:var(--muted);white-space:nowrap;padding:0 2px}
    .batch-count{flex:0 0 auto;height:38px;width:72px;background:var(--panel);border:1px solid var(--border);
      border-radius:8px;color:var(--text);font-size:13px;font-family:inherit;padding:0 8px;cursor:pointer}
    .batch-count:focus{outline:none;border-color:var(--accent)}
    .batch-btn{flex:1 1 auto;min-width:0;height:38px;padding:0 16px;font-size:14px;white-space:nowrap}
    .batch-btn:disabled{opacity:.5;cursor:not-allowed}
    .batch-cancel{flex:0 0 auto;background:var(--danger);border-color:var(--danger);color:#fff}
    .task-progress{margin-top:18px}
    .task-bar-track{background:var(--panel-2);border:1px solid var(--border);border-radius:999px;height:10px;overflow:hidden}
    .task-bar-fill{height:100%;background:linear-gradient(90deg,var(--accent),var(--accent-2));border-radius:999px;transition:width .5s ease}
    .task-status{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--text);margin-top:8px}
    .batch-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px;margin-top:14px}
    .batch-card{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:12px}
    .batch-head{font-size:13px;font-weight:600;color:var(--accent);margin-bottom:4px}
    .batch-links{display:flex;gap:6px;flex-wrap:wrap}
    .result{margin-top:22px;background:var(--panel);border:1px solid var(--border);
      border-radius:12px;padding:18px}
    .result h3{margin:0 0 8px;font-size:14px;color:var(--accent)}
    .concept{white-space:pre-wrap;line-height:1.6;font-size:14px}
    .model-hint{font-size:12px;color:#888;margin-top:6px;opacity:.8}
    .plan{white-space:pre-wrap;line-height:1.6;font-size:13px;color:var(--muted);
      background:var(--panel-2);padding:12px;border-radius:8px;margin-top:8px}
    .seed-pill{display:inline-block;padding:2px 10px;border-radius:999px;background:var(--panel-2);
      border:1px solid var(--border);font-size:12px;color:var(--muted);margin-bottom:10px}
    .archive-box{margin-top:14px;padding:12px;border:1px dashed var(--accent);border-radius:10px;
      background:var(--panel-2)}
    .archive-badge{display:inline-block;color:var(--accent);font-weight:600;font-size:13px}
    .archive-time{display:inline-block;margin-left:10px;color:var(--muted);font-size:12px}
    .archive-links{margin-top:8px;display:flex;flex-wrap:wrap;gap:14px;font-size:13px}
    .archive-links a{color:var(--accent-2);text-decoration:underline}
    .archive-note{color:var(--muted);font-size:12px}
    .character-card{margin:8px auto 0;background:var(--panel-2);border:1px solid var(--border);
      border-radius:14px;overflow:hidden;max-width:480px;width:100%}
    .char-frame{width:100%;padding-top:100%;position:relative;background:#0b1220}
    .char-frame img{position:absolute;top:0;left:0;width:100%;height:100%;object-fit:cover}
    .char-fields{padding:14px 16px}
    .char-row{margin-bottom:8px}
    .char-row:last-child{margin-bottom:0}
    .char-label{font-size:11px;color:var(--accent);font-weight:600;letter-spacing:0.5px}
    .char-value{font-size:14px;color:var(--text);line-height:1.5;margin-top:2px}
    .config-form{background:var(--panel);border:1px solid var(--border);border-radius:12px;
      padding:18px;margin-top:12px}
    .form-row{display:flex;flex-direction:column;margin-bottom:14px}
    .form-row label{font-size:13px;color:var(--muted);margin-bottom:6px}
    .form-row input,.form-row select{background:var(--panel-2);border:1px solid var(--border);
      border-radius:8px;padding:8px 10px;color:var(--text);font-size:14px;font-family:inherit}
    .save-btn{padding:10px 18px;border-radius:8px;border:1px solid var(--accent);
      background:var(--accent);color:#fff;cursor:pointer;font-size:14px}
    .note{font-size:12px;color:var(--muted);margin-top:10px}
    .paths{font-size:12px;color:var(--muted);background:var(--panel-2);padding:10px;
      border-radius:8px;margin-top:10px;white-space:pre-line}
    .error{color:var(--danger);font-size:13px;margin-top:10px;white-space:pre-wrap;line-height:1.5}
    .banner{font-size:12px;color:var(--accent-2);background:var(--panel-2);
      padding:8px 12px;border-radius:8px;margin-bottom:14px}
    .hist-list{display:flex;flex-direction:column;gap:10px}
    .hist-item{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:14px}
    .hist-head{display:flex;align-items:center;gap:10px;cursor:pointer}
    .hist-mode{font-weight:600;font-size:14px}
    .hist-time{color:var(--muted);font-size:12px}
    .hist-kind{margin-left:auto;font-size:11px;color:var(--accent-2);
      background:var(--panel-2);padding:2px 8px;border-radius:999px}
    .hist-snippet{color:var(--muted);font-size:13px;margin-top:6px;
      white-space:pre-wrap;line-height:1.5;overflow:hidden;
      display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;line-clamp:2}
    .hist-filters{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:12px}
    .hist-filters .seed-input{width:auto;margin:0}
    .fav-filter{display:flex;align-items:center;gap:4px;font-size:13px;color:var(--muted);cursor:pointer}
    .fav-filter input{width:auto}
    .fav-toggle{cursor:pointer;font-size:16px;color:var(--muted);user-select:none;padding:0 2px}
    .fav-toggle.fav-on{color:#f5c542}
    .stats-cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px}
    .stat-card{background:var(--panel);border:1px solid var(--border);border-radius:12px;
      padding:14px;text-align:center}
    .stat-num{font-size:22px;font-weight:700;color:var(--accent)}
    .stat-label{font-size:12px;color:var(--muted);margin-top:4px}
    .stat-bars{display:flex;flex-direction:column;gap:8px}
    .stat-bar-row{display:flex;align-items:center;gap:8px;font-size:13px}
    .stat-bar-label{flex:0 0 auto;min-width:90px;color:var(--text);white-space:nowrap;
      overflow:hidden;text-overflow:ellipsis}
    .stat-bar-track{flex:1;background:var(--panel-2);border-radius:6px;height:14px;overflow:hidden}
    .stat-bar-fill{height:100%;background:var(--accent);border-radius:6px;min-width:2px;transition:width .4s ease}
    .stat-bar-fill.fill-alt{background:var(--accent-2)}
    .stat-bar-num{flex:0 0 auto;min-width:28px;text-align:right;color:var(--muted);font-variant-numeric:tabular-nums}
    @media (max-width:640px){
      .app{padding:14px 12px 48px}
      header.topbar h1{font-size:18px}
      .tabs{gap:4px}
      .tab{padding:5px 10px;font-size:13px}
      .mode-grid{grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:8px}
      .mode-card{padding:10px 8px}
      .mode-card .name{font-size:14px}
      .config-form{padding:12px}
      .hist-head{flex-wrap:wrap;gap:6px}
      .hist-kind{margin-left:0}
      .stats-cards{grid-template-columns:repeat(2,1fr)}
      .stat-bar-label{min-width:70px;font-size:12px}
      .archive-links{gap:8px;font-size:12px}
      .banner{font-size:11px}
      /* 窄屏：操作区控件纵向排列，避免挤压 */
      .control-card{padding:14px}
      .action-row{flex-wrap:wrap}
      .open-btn{flex:1 1 100%}
      .batch-group{flex:1 1 100%}
      .batch-count{flex:0 0 72px}
      .batch-btn{flex:1 1 auto}
    }
    @media (max-width:380px){
      .mode-grid{grid-template-columns:repeat(2,1fr)}
      .tab{padding:5px 8px;font-size:12px}
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <!-- 免构建：本地 vendor（preact + htm + hooks），无需联网 / 不依赖 CDN -->
  <script src="vendor/preact.umd.js"></script>
  <script src="vendor/htm.umd.js"></script>
  <script src="vendor/preact-hooks.umd.js"></script>
  <script>
    // 依赖缺失时给出明确提示，避免白屏
    if (typeof preact === "undefined" || typeof htm === "undefined" || typeof preactHooks === "undefined") {
      document.getElementById("root").innerHTML =
        '<p style="color:#e24b4a;padding:24px">前端依赖未加载：请确认 frontend/vendor/ 下的 preact.umd.js、htm.umd.js、preact-hooks.umd.js 存在。<br>preact: ' + typeof preact + '<br>htm: ' + typeof htm + '<br>preactHooks: ' + typeof preactHooks + '</p>';
      throw new Error("vendor missing");
    }
    
    const { h, render } = preact;
    const { useState, useEffect, useRef } = preactHooks;
    const html = htm.bind(h);

    // ---- 全局兜底：捕获未被错误边界兜住的运行时错误，在页面顶部显示可读信息，
    // 避免「点击配置后整页变黑、什么也不显示」却无从排查。 ----
    function showFatal(msg) {
      let el = document.getElementById("__fatal");
      if (!el) {
        el = document.createElement("div");
        el.id = "__fatal";
        el.style.cssText =
          "position:fixed;left:0;right:0;top:0;z-index:99999;background:#2a0d0d;color:#ff8a8a;" +
          "font:13px/1.6 ui-monospace,Menlo,monospace;padding:14px 18px;white-space:pre-wrap;" +
          "word-break:break-word;border-bottom:1px solid #ff5c5c;max-height:50vh;overflow:auto;";
        document.body.appendChild(el);
      }
      el.textContent = "⚠️ 运行时错误：\n" + msg;
    }
    window.addEventListener("error", (e) => showFatal((e.error && e.error.stack) || e.message || String(e)));
    window.addEventListener("unhandledrejection", (e) =>
      showFatal("Unhandled Promise: " + ((e.reason && (e.reason.stack || e.reason.message)) || e.reason))
    );

    // ---- 错误边界：捕获子树渲染/effect 异常，避免整棵 preact 树被卸载导致整页变黑 ----
    class ErrorBoundary extends preact.Component {
      constructor(props) { super(props); this.state = { error: null }; }
      componentDidCatch(error, info) {
        console.error("[demo ErrorBoundary] 捕获到渲染异常:", error, info);
      }
      render(props, state) {
        if (state.error) {
          const e = state.error;
          return html`<div style=${{ padding: "24px", color: "#ff8a8a", fontFamily: "ui-monospace, Menlo, monospace", whiteSpace: "pre-wrap", wordBreak: "break-word", fontSize: "13px", lineHeight: "1.7" }}>
            <h2 style=${{ color: "#ff5c5c", marginTop: "0" }}>⚠️ 页面渲染出错（已被错误边界捕获，未导致整页崩溃）</h2>
            <div style=${{ marginBottom: "10px" }}>${String(e && e.message ? e.message : e)}</div>
            ${e && e.stack ? html`<div style=${{ opacity: "0.75", borderTop: "1px solid #444", paddingTop: "10px" }}>${e.stack}</div>` : null}
            <div style=${{ marginTop: "14px", opacity: "0.7" }}>请按 F12 打开控制台复制完整报错，或把上方红字反馈给开发者。</div>
          </div>`;
        }
        return props.children;
      }
    }

    // ---- 沙箱 iframe 高度自适应 ----
    // quiz/game 的 iframe 使用 sandbox="allow-scripts"（不含 allow-same-origin）以保留 origin 隔离，
    // 父页面因此无法读取其 contentDocument；改由子页面 postMessage 上报高度
    // （上报脚本由后端 _inject_height_reporter 注入）。
    // 通过 event.source 反查是页面上的哪个 iframe，避免信任任意来源的消息。
    window.addEventListener("message", (e) => {
      const height = Number(e.data && e.data.__blindbox_height);
      if (!Number.isFinite(height) || height <= 0) return;
      // 封顶：iframe 最高不超过视口的 1.5 倍，超出部分由 iframe 自身内部滚动。
      // 否则游戏若无限追加 DOM（LLM 常见），外层页面会被撑到无限长、永远滚不到底。
      const CAP = Math.max(800, Math.floor(window.innerHeight * 1.5));
      for (const frame of document.querySelectorAll("iframe[data-blindbox]")) {
        if (frame.contentWindow === e.source) {
          const min = frame.dataset.blindbox === "quiz" ? 400 : 520;
          frame.style.height = Math.min(CAP, Math.max(min, height + 20)) + "px";
          frame.style.overflow = "auto";
          break;
        }
      }
    });

    function App() {
      const [tab, setTab] = useState("box");
      const [modes, setModes] = useState([]);
      const [selected, setSelected] = useState(null);
      const [loading, setLoading] = useState(false);
      const [result, setResult] = useState(null);
      const [error, setError] = useState(null);
      const [customSeed, setCustomSeed] = useState("");
      const [config, setConfig] = useState(null);
      const [paths, setPaths] = useState({});
      const [saved, setSaved] = useState(false);
      const [poolUI, setPoolUI] = useState({ addText: {}, gen: {}, genErr: {} });
      const initialPoolRef = useRef(null);
      const [voices, setVoices] = useState({ edge: [], cloud: [], current: "" });
      const [history, setHistory] = useState([]);
      const [histLoading, setHistLoading] = useState(false);
      const [histError, setHistError] = useState(null);
      const [expandedId, setExpandedId] = useState(null);
      // 异步开盒任务进度
      const [task, setTask] = useState(null);      // {task_id, stage_label, progress, elapsed}
      const pollRef = useRef(null);                 // 轮询定时器句柄
      const sseRef = useRef(null);                   // SSE 连接句柄
      const [liveStreams, setLiveStreams] = useState([]); // SSE 实时思考流 [{stage, model, text}]
      const [streamNote, setStreamNote] = useState(null); // SSE 降级提示（后端未重启/代理不支持时可见）
      // 批量开盒
      const [batchCount, setBatchCount] = useState(3);
      const [batchTasks, setBatchTasks] = useState([]);  // [{task_id, status, stage_label, progress, elapsed, result}]
      const [batchError, setBatchError] = useState(null);
      const batchPollRef = useRef(null);
      // 历史搜索 / 筛选
      const [histQuery, setHistQuery] = useState("");
      const [histModeFilter, setHistModeFilter] = useState("");
      const [histFavOnly, setHistFavOnly] = useState(false);
      // 统计
      const [stats, setStats] = useState(null);
      const [statsLoading, setStatsLoading] = useState(false);
      // token 单价（来自配置，用于成本估算）
      const [tokensPrice, setTokensPrice] = useState(0);
      // 自定义模式
      const [showNewMode, setShowNewMode] = useState(false);
      const [newMode, setNewMode] = useState({});
      const [newModeErr, setNewModeErr] = useState(null);
      const VALID_EXECUTOR_TYPES = ["text","image","video","tts","game","quiz","character_card","code-spec","code-cli","illustrated_story","video_storyboard","song"];
      const VALID_OUTPUT_HANDLERS = ["text","image_url","video_file","audio_file","spec_md","game_html","quiz_html","character_card","image_strip","song"];
      const addCustomMode = () => {
        setNewModeErr(null);
        const m = newMode || {};
        const id = (m.id || "").trim();
        const name = (m.name || "").trim();
        if (!id) { setNewModeErr("模式 id 不能为空"); return; }
        if (!/^[a-z][a-z0-9-]*$/.test(id)) { setNewModeErr("id 只能包含小写字母、数字与中划线，且以字母开头"); return; }
        if (!name) { setNewModeErr("模式名称不能为空"); return; }
        const etype = m.executor_type || "text";
        if (!VALID_EXECUTOR_TYPES.includes(etype)) { setNewModeErr("executor_type 不在合法枚举内"); return; }
        const oh = m.output_handler || "text";
        if (!VALID_OUTPUT_HANDLERS.includes(oh)) { setNewModeErr("output_handler 不在合法枚举内"); return; }
        if ((config.modes || []).some(x => x.id === id)) { setNewModeErr("该 id 已存在，请换一个"); return; }
        const newModeObj = {
          id, name,
          executor_type: etype,
          output_handler: oh,
          creative_prompt: (m.creative_prompt || "").trim(),
          planner_template: (m.planner_template || "").trim(),
        };
        // 加入配置并在开盲盒页选中
        update("modes", [...(config.modes || []), newModeObj]);
        setSelected(id);
        setShowNewMode(false);
        setNewMode({});
        setSaved(false);
      };

      useEffect(() => {
        fetch("/api/modes").then(r => r.json()).then(d => {
          setModes(d.modes || []);
          if (d.modes && d.modes.length) setSelected(d.modes[0].id);
        }).catch(e => setError("加载模式失败: " + e.message));
        fetch("/api/config").then(r => r.json()).then(d => {
          setConfig(d.config); setPaths(d.paths || {});
          if (initialPoolRef.current === null) initialPoolRef.current = d.config?.randomness?.pool || {};
          setTokensPrice(Number(d.config?.global?.tokens_price) || 0);
        }).catch(() => {});
        // Load available TTS voices
        fetch("/api/tts/voices").then(r => r.json()).then(d => {
          setVoices({ edge: d.edge || [], cloud: d.cloud || [], current: d.current || "" });
        }).catch(() => {});
      }, []);

      // 统一停止：轮询定时器 + SSE 连接（两者并存，停止时一并关掉）
      // 注意：必须定义在 runOpen 之前——const 没有提升，定义在后面会 TDZ 报错。
      const stopTaskWatch = () => {
        if (pollRef.current) { clearInterval(pollRef.current); pollRef.current = null; }
        if (sseRef.current) { try { sseRef.current.close(); } catch (e) {} sseRef.current = null; }
      };
      // 组件卸载时清理 SSE 长连接（否则切页签会残留连接）
      useEffect(() => () => {
        try { sseRef.current && sseRef.current.close(); } catch (e) {}
        if (pollRef.current) { clearInterval(pollRef.current); pollRef.current = null; }
      }, []);

      const runOpen = async (modeId, seed) => {
        const m = modeId || selected;
        if (!m) return;
        // 自定义种子优先于历史 seed（「用此 seed 重抽」时种子来自历史，仍可被手动输入覆盖）
        const finalSeed = (customSeed || "").trim() || seed;
        setLoading(true); setError(null); setResult(null); setTask(null);

        // 1) 创建异步任务，立即拿到 task_id
        let resp;
        try {
          resp = await fetch("/api/open", {
            method: "POST", headers: { "Content-Type": "application/json" },
            body: JSON.stringify(finalSeed ? { mode: m, seed: finalSeed } : { mode: m }),
          });
        } catch (e) {
          setLoading(false);
          setError(e.message === "Failed to fetch"
            ? "与服务器连接中断。请确认前后端服务正常后重试。"
            : "创建任务失败: " + e.message);
          return;
        }
        let data;
        try { data = await resp.json(); } catch (e) { data = {}; }
        if (!resp.ok) { setLoading(false); setError((data && data.detail) || "开盲盒失败"); return; }
        const taskId = data && data.task_id;
        if (!taskId) { setLoading(false); setError("服务未返回 task_id，请检查后端版本"); return; }

        // 2) SSE 实时思考流（轮询仍并行保留作兜底）
        setLiveStreams([]);
        setStreamNote(null);
        sseRef.current = subscribeTaskStream(taskId, {
          onStage: (_s, label) => setTask(prev => (prev ? { ...prev, stage_label: label } : prev)),
          onReasonStart: (stage, model) => setLiveStreams(prev => {
            if (prev.length && prev[prev.length - 1].stage === stage) return prev;
            return [...prev, { stage, model, text: "" }];
          }),
          onDelta: text => setLiveStreams(prev => {
            if (prev.length === 0) return [{ stage: "模型思考", model: "", text }];
            const next = prev.slice();
            const last = { ...next[next.length - 1] };
            last.text = (last.text || "") + text;
            next[next.length - 1] = last;
            return next;
          }),
          onDone: result => {
            stopTaskWatch();
            setLoading(false); setTask(null);
            if (result) setResult(result); else setError("任务完成但结果为空");
          },
          onError: (msg, d) => {
            if (!d) return; // 连接层错误交给轮询兜底
            stopTaskWatch();
            setLoading(false); setTask(null);
            setError(d.type === "cancelled" ? "任务已取消。" : "开盲盒失败: " + (d.error || msg));
          },
          onFallback: () => {
            // SSE 不可用（后端未重启 / 代理不支持）——给可见提示，
            // 否则用户只看到进度条却不知道思考流为什么没出来。
            setStreamNote("实时思考流不可用（后端可能需要重启），已自动降级为进度条模式");
          },
        }, { fallbackMs: 8000 });

        // 3) 轮询 GET /api/task/{id}，更新进度；完成后展示结果（SSE 不可用时的兜底）
        const poll = async () => {
          let t;
          try {
            const r = await fetch("/api/task/" + taskId);
            t = await r.json();
            if (!r.ok) throw new Error((t && t.detail) || "查询任务失败");
          } catch (e) {
            stopTaskWatch();
            setLoading(false); setTask(null);
            setError("查询任务失败: " + e.message);
            return;
          }
          setTask({ task_id: taskId, stage_label: t.stage_label, progress: t.progress, elapsed: t.elapsed });
          if (t.status === "done") {
            stopTaskWatch();
            setLoading(false); setTask(null);
            if (t.result) setResult(t.result);
            else setError("任务完成但结果为空");
          } else if (t.status === "cancelled") {
            stopTaskWatch();
            setLoading(false); setTask(null);
            setError("任务已取消。");
          } else if (t.status === "error") {
            stopTaskWatch();
            setLoading(false); setTask(null);
            setError("开盲盒失败: " + (t.error || "未知错误"));
          }
        };
        await poll();
        if (!pollRef.current) pollRef.current = setInterval(poll, 1200);
      };

      // SSE 客户端：订阅 /api/task/{id}/stream，实时接收思考增量与阶段切换。
      // 与轮询并存：SSE 是增强，连接异常时轮询兜底，保证不卡死。
      // 事件对应后端 stream_bus.py：stage / reasoning_start / reasoning_delta /
      // reasoning_end / done / error / cancelled / end
      const subscribeTaskStream = (taskId, handlers = {}, opts = {}) => {
        if (typeof window === "undefined" || typeof window.EventSource === "undefined") return null;
        const { onStage, onReasonStart, onDelta, onReasonEnd, onDone, onError, onFallback } = handlers;
        const fallbackMs = opts.fallbackMs || 15000;
        let closed = false, gotAny = false, es;
        try {
          es = new window.EventSource("/api/task/" + encodeURIComponent(taskId) + "/stream");
        } catch (e) {
          if (onFallback) onFallback(e);
          return null;
        }
        const parse = ev => { try { return JSON.parse(ev.data); } catch (e) { return null; } };
        const shut = () => { closed = true; try { es.close(); } catch (e) {} };

        es.onopen = () => { gotAny = true; };
        es.addEventListener("stage", ev => { const d = parse(ev); if (d && onStage) onStage(d.stage, d.label, d); });
        es.addEventListener("reasoning_start", ev => { const d = parse(ev); if (d && onReasonStart) onReasonStart(d.stage, d.model, d); });
        es.addEventListener("reasoning_delta", ev => {
          const d = parse(ev);
          if (d && d.text) { gotAny = true; if (onDelta) onDelta(d.text, d); }
        });
        es.addEventListener("reasoning_end", ev => { const d = parse(ev); if (onReasonEnd) onReasonEnd(d); });
        es.addEventListener("done", ev => { const d = parse(ev); shut(); if (onDone) onDone(d && d.result, d); });
        es.addEventListener("error", ev => {
          // 终态 error/cancelled/cancelling（服务端用 event 名区分）vs 连接层错误
          if (ev && typeof ev.data === "string" && ev.data && ev.data !== "{}") {
            const d = parse(ev);
            if (d && (d.type === "error" || d.type === "cancelled" || d.type === "cancelling")) {
              shut();
              if (onError) onError((d.error || "开盒失败"), d);
              return;
            }
          }
          if (closed) return;
          if (onError) onError("SSE 连接中断", null);
          if (onFallback) onFallback(ev);
          shut();
        });
        es.addEventListener("end", shut);

        // 静默兜底：连上但一直没数据（后端老版本无 SSE），通知上层走轮询
        const timer = setTimeout(() => {
          if (!gotAny && !closed && onFallback) onFallback(new Error("SSE 无响应"));
        }, fallbackMs);

        return {
          close() {
            closed = true;
            clearTimeout(timer);
            try { es && es.close(); } catch (e) {}
          },
        };
      };

      // 实时思考面板：开盒进行中随 SSE 增量逐字显示（任务结束后由静态思考面板接管）
      // 实时思考流面板：开盒进行中随 SSE 增量逐字显示（任务结束后由静态思考面板接管）
      const LiveThinkingPanel = ({ streams, live }) => {
        const list = (streams || []).filter(s => s.text);
        if (list.length === 0) return null;
        const totalChars = list.reduce((n, s) => n + (s.text || "").length, 0);
        return html`
          <div style=${{ margin: "10px 0", border: "1px solid var(--accent)", borderRadius: 10, background: "rgba(127,119,221,0.06)", padding: "10px 12px" }}>
            <div style=${{ display: "flex", alignItems: "center", gap: 8, fontSize: 12, fontWeight: 600, color: "var(--accent)", letterSpacing: 0.5, marginBottom: 8 }}>
              <span>思考中…（${totalChars} 字）</span>
              ${live ? html`<span style=${{ width: 6, height: 6, borderRadius: "50%", background: "var(--accent)", animation: "blink 1s steps(2, start) infinite", display: "inline-block" }} />` : ""}
            </div>
            ${list.map((s, i) => html`
              <div style=${i === 0 ? undefined : { marginTop: 8, paddingTop: 8, borderTop: "1px dashed var(--border)" }}>
                <div style=${{ fontSize: 11, color: "var(--accent)", fontWeight: 600, marginBottom: 4, display: "flex", gap: 8, flexWrap: "wrap" }}>
                  <span>${s.stage || "模型思考"}</span>
                  ${s.model ? html`<span style=${{ color: "var(--muted)", fontWeight: 400 }}>· ${s.model}</span>` : ""}
                </div>
                <div style=${{ fontSize: 13, lineHeight: 1.75, color: "var(--muted)", whiteSpace: "pre-wrap", wordBreak: "break-word", fontFamily: 'ui-monospace, SFMono-Regular, Menlo, Consolas, "Microsoft YaHei", monospace' }}>
                  ${s.text}${live && i === list.length - 1
                    ? html`<span style=${{ display: "inline-block", width: 7, height: 13, marginLeft: 2, verticalAlign: "text-bottom", background: "var(--accent)", animation: "blink 1s steps(2, start) infinite" }} />`
                    : ""}
                </div>
              </div>`)}
          </div>`;
      };

      const cancelTask = async () => {
        const tid = task && task.task_id;
        if (!tid) return;
        try {
          await fetch("/api/task/" + tid + "/cancel", { method: "POST" });
        } catch (e) { /* 忽略网络错误，轮询会兜底 */ }
      };
      const openBox = () => runOpen(selected);

      // ---- 批量开盒：一次创建 N 个异步任务，并排展示进度与结果 ----
      const cancelBatch = async () => {
        if (batchPollRef.current) { clearInterval(batchPollRef.current); batchPollRef.current = null; }
        for (const t of batchTasks) {
          try { await fetch("/api/task/" + t.task_id + "/cancel", { method: "POST" }); } catch (e) {}
        }
      };
      const runBatchOpen = async () => {
        const m = selected;
        if (!m) return;
        const finalSeed = (customSeed || "").trim();
        setLoading(true); setError(null); setBatchError(null); setResult(null);
        if (batchPollRef.current) { clearInterval(batchPollRef.current); batchPollRef.current = null; }
        // 1) 创建批量任务
        let resp, data;
        try {
          resp = await fetch("/api/open-batch", {
            method: "POST", headers: { "Content-Type": "application/json" },
            body: JSON.stringify(finalSeed ? { mode: m, count: batchCount, seed: finalSeed } : { mode: m, count: batchCount }),
          });
          data = await resp.json();
        } catch (e) {
          setLoading(false);
          setBatchError("创建批量任务失败: " + e.message);
          return;
        }
        if (!resp.ok) { setLoading(false); setBatchError((data && data.detail) || "批量开盲盒失败"); return; }
        const tasks = (data.tasks || []).map(t => ({
          task_id: t.task_id, status: "running", stage_label: "排队中", progress: 0, elapsed: 0, result: null,
        }));
        setBatchTasks(tasks);
        // 2) 统一轮询全部任务
        const pollAll = async () => {
          const next = [];
          let allDone = true;
          for (const t of tasks) {
            let cur;
            try {
              const r = await fetch("/api/task/" + t.task_id);
              cur = await r.json();
            } catch (e) { cur = null; }
            if (cur && cur.status) {
              next.push({ ...t, status: cur.status, stage_label: cur.stage_label, progress: cur.progress, elapsed: cur.elapsed, result: cur.result, error: cur.error });
              if (cur.status !== "done" && cur.status !== "error" && cur.status !== "cancelled") allDone = false;
            } else {
              next.push(t);
              allDone = false;
            }
          }
          setBatchTasks(next);
          if (allDone) {
            if (batchPollRef.current) { clearInterval(batchPollRef.current); batchPollRef.current = null; }
            setLoading(false);
            const anyDone = next.some(t => t.status === "done" && t.result);
            if (!anyDone) {
              const errs = next.filter(t => t.error).map(t => t.error).join("；");
              setBatchError("批量任务均未成功: " + (errs || "未知"));
            }
          }
        };
        setLoading(true);
        await pollAll();
        if (!batchPollRef.current) batchPollRef.current = setInterval(pollAll, 1200);
      };

      // 已下线模式的兜底名称（历史记录仍显示可读名）
      const LEGACY_MODE_NAMES = { novella: "中篇播客（已合并）", longpod: "长播客（已合并）" };
      const modeName = (id) => (modes.find(m => m.id === id)?.name || LEGACY_MODE_NAMES[id] || id || "");

      // 把 output 目录内的相对文件名转成可安全放进 href/src 的 URL。
      // 逐段 encodeURIComponent：产物名由提示词生成（中文/空格/#/%/&），
      // 直接 "/output/" + name 会被浏览器把 # 之后当锚点丢掉（output/ 里确有含 # 的文件）。
      const outUrl = (name) => {
        if (typeof name !== "string") return null;
        const raw = name.trim().replace(/\\/g, "/");
        if (!raw) return null;
        if (raw.startsWith("/") || /^[a-zA-Z]:\//.test(raw) || raw.split("/").includes("..")) return null;
        return "/output/" + raw.split("/").map(encodeURIComponent).join("/");
      };

      // 解析图片/视频成品的可渲染地址：
      // 归档后后端会把 output 改写为本地相对文件名（如 asset_xxx.png，无 /output/ 前缀），
      // 此时必须读取 archived.local_file 并补 /output/ 前缀；否则就当纯文本显示。
      const mediaSrc = (r) => {
        if (!r) return null;
        if (r.archived && r.archived.local_file) return outUrl(r.archived.local_file);
        const o = r.output || "";
        if (/^https?:\/\//.test(o)) return o;
        if (o.startsWith("/output/")) return outUrl(o.slice("/output/".length)) || o;
        // 裸相对文件名（output 目录内）——自动补 /output/ 也能渲染
        if (o && !/^[a-zA-Z]:[\\/]/.test(o) && !o.startsWith("/")) return outUrl(o);
        return null; // 无法渲染 -> 退回纯文本
      };
      // 角色卡：解析 "Name | xxx" 或 "Name: xxx" 格式的结构化文本 → [{label, value}]
      // 思考强度可选项：与后端 agents._THINKING_VALUES 一一对应
      // 说明：Gemini 3+ 用 thinkingLevel（不支持 thinkingBudget），"关闭"映射为 minimal
      // （Gemini 3 无法真正关闭思考）；非 Gemini 厂商走 reasoning_effort，default/off 不注入参数。
      const THINKING_OPTIONS = [
        { value: "default", label: "默认（不指定，沿用模型默认思考水平）" },
        { value: "off", label: "关闭（Gemini 3 映射为 minimal，最接近关闭）" },
        { value: "low", label: "低（更快、更省 token）" },
        { value: "medium", label: "中（平衡）" },
        { value: "high", label: "高（推理最深，最慢）" },
      ];
      // 思考强度下拉：每张模型卡片一个，紧跟 temperature 之后
      const thinkingSelect = (value, onPick) => {
        // 值收敛到合法选项：配置文件里若被手改成非法值（如 "HIGH"/"关闭"/乱码），
        // 直接透传给<select> 会让下拉显示空白，这里兜底回 default。
        const cur = THINKING_OPTIONS.some(o => o.value === value) ? value : "default";
        const hit = THINKING_OPTIONS.find(o => o.value === cur);
        return html`
          <div class="form-row">
            <label>思考强度 thinking（可选）</label>
            <select value=${cur} onChange=${e => onPick(e.target.value)}>
              ${THINKING_OPTIONS.map(o => html`<option key=${o.value} value=${o.value}>${o.label}</option>`)}
            </select>
            <div class="note">当前：${hit.label}。Gemini 3+ 原生端点用 thinkingLevel；其他厂商走 reasoning_effort。</div>
          </div>`;
      };
      // 温度输入框组件。
      // 为什么不能用受控 <input type="number"> + Number(value)：
      // 输入 "0.8" 到 "0" 后立刻把 0 存回 state，浏览器此时再收到 "." 会认为
      // "0." 不是合法数字而把 value 置空，小数点根本进不来（中文输入法下更明显）。
      // 改为「本地字符串态 + 失焦提交」：编辑期间不碰外部 state，
      // 用户可自由输入 "0." / "0.8" / "1"，失焦或回车时才解析成数字写入配置。
      // 解析不通过（空/非法）回退 null，即"留空=用全局默认"。
      const TemperatureInput = ({ value, onChange, id }) => {
        const [draft, setDraft] = useState(() =>
          value === null || value === undefined || value === "" ? "" : String(value));
        const lastExternal = useRef(value);

        // 外部值变化（如切换卡片/保存后重载）时同步回本地编辑态
        useEffect(() => {
          if (value === lastExternal.current) return;
          lastExternal.current = value;
          setDraft(value === null || value === undefined || value === "" ? "" : String(value));
        }, [value]);

        const commit = () => {
          const s = String(draft || "").trim();
          if (s === "") { lastExternal.current = null; onChange(null); return; }
          const n = Number(s);
          if (isFinite(n)) { lastExternal.current = n; onChange(n); }
          else {
            // 非法输入：还原成当前有效值，不把垃圾写进配置
            const cur = value === null || value === undefined || value === "" ? "" : String(value);
            lastExternal.current = value;
            setDraft(cur);
          }
        };

        return html`
          <div class="form-row">
            <label>温度 temperature（可选，留空=用全局/默认）</label>
            <input id=${id} type="text" inputMode="decimal" autocomplete="off"
              value=${draft}
              onInput=${e => setDraft(e.target.value)}
              onBlur=${commit}
              onKeyDown=${e => { if (e.key === "Enter") { e.preventDefault(); e.currentTarget.blur(); } }}
              placeholder="如 0.8" />
            <div class="note">支持 0 ~ 2 的小数，直接键入即可（如 0.8 / 1.2），回车或失焦生效。</div>
          </div>`;
      };

      const parseCharFields = (text) => {
        if (!text) return [];
        return text.split("\n").map(l => l.trim()).filter(Boolean).map(line => {
          // "Name | value" 或 "Name: value" 或 【Name】value
          const m = line.match(/^(?:【|[\[])?\s*(.+?)\s*(?:】|[\]]?)\s*[:|：]\s*(.+)/);
          if (m) return { label: m[1].trim(), value: m[2].trim() };
          return { label: "", value: line };
        }).filter(f => f.value);
      };
      // spec 章节提取：【环境依赖清单】/【磁盘占用预估】等，取到下一个【章节】或结尾
      const extractSection = (text, name) => {
        if (!text) return "";
        const re = new RegExp("【" + name + "】([\\s\\S]*?)(?=【|$)", "i");
        const m = text.match(re);
        return m ? m[1].trim().replace(/\n{3,}/g, "\n\n").slice(0, 300) : "";
      };
      // 环境成本卡：代码模式 spec 展示区下方的依赖/磁盘预估 + 黑名单警告
      const envCostCard = (r) => {
        if (!r || r.output_kind !== "spec_md") return null;
        const plan = r.plan || "";
        const warn = r.env_warning || "";
        const dep = extractSection(plan, "环境依赖清单");
        const size = extractSection(plan, "磁盘占用预估");
        const rows = [];
        if (warn) rows.push(html`
          <div style=${{ marginTop: "10px", padding: "10px 12px", background: "rgba(227,75,74,0.12)", border: "1px solid rgba(227,75,74,0.5)", borderRadius: "10px", color: "#f09595", fontSize: 13, lineHeight: 1.6, whiteSpace: "pre-wrap" }}>
            ${warn}
          </div>`);
        if (dep || size) rows.push(html`
          <div style=${{ marginTop: "10px", padding: "12px 14px", background: "var(--panel-2)", border: "1px solid var(--border)", borderRadius: "10px", fontSize: 13, lineHeight: 1.7 }}>
            <div style=${{ fontSize: 12, color: "var(--accent, #7f77dd)", fontWeight: 600, marginBottom: 6, letterSpacing: 0.5 }}>环境成本</div>
            ${dep ? html`<div style=${{ color: "var(--muted)" }}>依赖：${dep}</div>` : ""}
            ${size ? html`<div style=${{ color: "var(--muted)", marginTop: 4 }}>磁盘：${size}</div>` : ""}
          </div>`);
        return rows.length ? rows : null;
      };
      // 思考内容打字机回放：按字符递增显示，模拟流式逐字输出的观感。
      // 「思考过程」折叠面板：展示各阶段模型返回的 reasoning / thinking 文本。
      // 无思考内容（reasoning 为空）时整块不渲染。
      // 展开后直接显示全文——实时思考已在开盒过程中逐字展示过，
      // 结果页再演一遍打字机是重复劳动（数千字要拖近 3 秒）。
      const ThinkingPanel = ({ reasoning }) => {
        const entries = Array.isArray(reasoning) ? reasoning.filter(e => e && e.text) : [];
        const [open, setOpen] = useState(false);
        if (entries.length === 0) return null;
        const totalChars = entries.reduce((n, e) => n + (e.text || "").length, 0);
        return html`
          <div style=${{ margin: "10px 0", border: "1px solid var(--border)", borderRadius: 10, background: "var(--panel-2)", overflow: "hidden" }}>
            <button type="button" onClick=${() => setOpen(!open)}
              style=${{ width: "100%", display: "flex", alignItems: "center", justifyContent: "space-between", gap: 8, padding: "9px 12px", background: "transparent", border: "none", color: "var(--text)", fontSize: 13, fontWeight: 600, cursor: "pointer", textAlign: "left" }}>
              <span>思考过程（${entries.length} 段 · ${totalChars} 字）</span>
              <span style=${{ color: "var(--muted)", fontWeight: 400, fontSize: 12 }}>${open ? "收起 ▲" : "展开 ▼"}</span>
            </button>
            ${open && html`<div style=${{ padding: "0 12px 12px" }}>
              ${entries.map((e, i) => html`
                <div style=${i === 0 ? undefined : { marginTop: 10, paddingTop: 10, borderTop: "1px dashed var(--border)" }}>
                  <div style=${{ fontSize: 11, color: "var(--accent, #7f77dd)", fontWeight: 600, letterSpacing: 0.4, marginBottom: 5, display: "flex", gap: 8, flexWrap: "wrap", alignItems: "center" }}>
                    <span>${e.stage || "模型思考"}</span>
                    ${e.model ? html`<span style=${{ color: "var(--muted)", fontWeight: 400 }}>· ${e.model}</span>` : ""}
                  </div>
                  <div style=${{ fontSize: 13, lineHeight: 1.75, color: "var(--muted, #b9bdc7)", whiteSpace: "pre-wrap", wordBreak: "break-word", fontFamily: 'ui-monospace, SFMono-Regular, Menlo, Consolas, "Microsoft YaHei", monospace' }}>
                    ${e.text}
                  </div>
                </div>`)}
            </div>`}
          </div>`;
      };
      const loadHistory = async () => {
        setHistLoading(true); setHistError(null);
        try {
          const params = new URLSearchParams({ limit: "200" });
          if (histQuery.trim()) params.set("q", histQuery.trim());
          if (histModeFilter) params.set("mode", histModeFilter);
          const resp = await fetch("/api/history?" + params.toString());
          const data = await resp.json();
          if (!resp.ok) throw new Error(data.detail || "加载历史失败");
          const items = data.items || [];
          setHistory(histFavOnly ? items.filter(x => x.favorite) : items);
        } catch (e) { setHistError("加载历史失败: " + e.message); }
        finally { setHistLoading(false); }
      };

      const toggleFavorite = async (rid, fav) => {
        try {
          const resp = await fetch("/api/history/" + rid + "/favorite", {
            method: "POST", headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ favorite: fav }),
          });
          const data = await resp.json();
          if (!resp.ok) throw new Error(data.detail || "更新收藏失败");
          setHistory(prev => prev.map(x => x.id === rid ? { ...x, favorite: fav } : x));
          if (histFavOnly && !fav) setHistory(prev => prev.filter(x => x.id !== rid));
        } catch (e) { setHistError("更新收藏失败: " + e.message); }
      };

      const rateItem = async (rid, rating) => {
        try {
          const resp = await fetch("/api/history/" + rid + "/rating", {
            method: "POST", headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ rating }),
          });
          const data = await resp.json();
          if (!resp.ok) throw new Error(data.detail || "评分失败");
          setHistory(prev => prev.map(x => x.id === rid ? { ...x, rating } : x));
        } catch (e) { setHistError("评分失败: " + e.message); }
      };

      const loadStats = async () => {
        setStatsLoading(true);
        try {
          const resp = await fetch("/api/stats");
          const data = await resp.json();
          if (!resp.ok) throw new Error(data.detail || "加载统计失败");
          setStats(data);
        } catch (e) { setError("加载统计失败: " + e.message); }
        finally { setStatsLoading(false); }
      };

      const save = async () => {
        setError(null);
        try {
          const resp = await fetch("/api/config", {
            method: "POST", headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ config }),
          });
          if (!resp.ok) throw new Error("保存失败");
          setSaved(true);
          // Reload voices after save to reflect the new config
          fetch("/api/tts/voices").then(r => r.json()).then(d => {
            setVoices({ edge: d.edge || [], cloud: d.cloud || [], current: d.current || "" });
          }).catch(() => {});
        } catch (e) { setError("保存失败: " + e.message); }
      };

      const update = (path, value) => {
        setConfig(prev => {
          // prev 为 null（配置还没加载完用户就操作）时直接跳过，避免 JSON.stringify(null) -> "null"
          if (!prev || typeof prev !== "object") return prev;
          const next = JSON.parse(JSON.stringify(prev));
          const keys = path.split(".");
          let node = next;
          for (let i = 0; i < keys.length - 1; i++) {
            const k = keys[i];
            // 中间层缺失或不是对象时按需创建：原实现直接 node = node[k]，
            // 一旦某层不存在，下一轮就是 undefined[k] -> TypeError，整个面板白屏。
            // 下一段 key 是纯数字则建数组，否则建对象。
            if (node[k] === null || typeof node[k] !== "object") {
              node[k] = /^\d+$/.test(keys[i + 1]) ? [] : {};
            }
            node = node[k];
          }
          node[keys[keys.length - 1]] = value;
          return next;
        });
        setSaved(false);
      };

      // ---- twist pool 编辑器（推荐混合方案：4 维可手动增删改 + 🎲 大模型生成） ----
      const poolDims = ["theme", "style", "constraint", "twist"];
      const dimCn = { theme: "主题", style: "风格", constraint: "约束", twist: "反转" };
      const getPool = (dim) => (config?.randomness?.pool?.[dim] || []);

      const editItem = (dim, idx, val) => {
        const arr = [...getPool(dim)];
        arr[idx] = val;
        update(`randomness.pool.${dim}`, arr);
      };
      const removeItem = (dim, idx) => {
        update(`randomness.pool.${dim}`, getPool(dim).filter((_, i) => i !== idx));
      };
      const addItem = (dim) => {
        const v = (poolUI.addText?.[dim] || "").trim();
        if (!v) return;
        if (getPool(dim).includes(v)) {  // 去重校验
          setPoolUI(s => ({ ...s, addText: { ...s.addText, [dim]: "" } }));
          return;
        }
        update(`randomness.pool.${dim}`, [...getPool(dim), v]);
        setPoolUI(s => ({ ...s, addText: { ...s.addText, [dim]: "" } }));
      };
      const genSeed = async (dim) => {
        setPoolUI(s => ({ ...s, gen: { ...s.gen, [dim]: true }, genErr: { ...s.genErr, [dim]: null } }));
        try {
          const resp = await fetch("/api/generate-seed", {
            method: "POST", headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ dimension: dim, existing: getPool(dim) }),
          });
          const data = await resp.json();
          if (!resp.ok) throw new Error(data.detail || "生成失败");
          const v = (data.seed || "").trim();
          if (!v) throw new Error("模型返回为空");
          if (!getPool(dim).includes(v)) update(`randomness.pool.${dim}`, [...getPool(dim), v]);
        } catch (e) {
          setPoolUI(s => ({ ...s, genErr: { ...s.genErr, [dim]: e.message } }));
        } finally {
          setPoolUI(s => ({ ...s, gen: { ...s.gen, [dim]: false } }));
        }
      };
      const resetPool = () => {
        if (initialPoolRef.current) update("randomness.pool", JSON.parse(JSON.stringify(initialPoolRef.current)));
      };
      const refreshAllSeeds = async () => {
        setRefreshingAll(true); setRefreshErr(null);
        try {
          const resp = await fetch("/api/seed/refresh-all", { method: "POST" });
          const data = await resp.json();
          if (!resp.ok) throw new Error(data.detail || "刷新失败");
          update("randomness.pool", data.pool);
        } catch (e) {
          setRefreshErr(e.message);
        } finally {
          setRefreshingAll(false);
        }
      };
      const [refreshingAll, setRefreshingAll] = useState(false);
      const [refreshErr, setRefreshErr] = useState(null);

      // ---- code 模式独立工具池（与全局池同能力：手动增删 + 🎲 生成 + 整体刷新） ----
      const codeModeIdx = () => { const ms = config?.modes || []; return ms.findIndex(m => m.id === "code"); };
      const getModePool = (dim) => { const i = codeModeIdx(); return (i >= 0 && config?.modes?.[i]?.pool?.[dim]) || []; };
      const [modePoolUI, setModePoolUI] = useState({ addText: {}, gen: {}, genErr: {} });
      const [modeRefreshing, setModeRefreshing] = useState(false);
      const [modeRefreshErr, setModeRefreshErr] = useState(null);
      const modePoolPath = (dim) => {
        const idx = codeModeIdx();
        if (idx < 0) return null;
        return `modes.${idx}.pool.${dim}`;
      };
      const editModeItem = (dim, idx, val) => {
        const path = modePoolPath(dim);
        if (!path) return;
        const arr = [...getModePool(dim)];
        arr[idx] = val;
        update(path, arr);
      };
      const removeModeItem = (dim, idx) => {
        const path = modePoolPath(dim);
        if (!path) return;
        update(path, getModePool(dim).filter((_, i) => i !== idx));
      };
      const addModeItem = (dim) => {
        const path = modePoolPath(dim);
        if (!path) return;
        const v = (modePoolUI.addText?.[dim] || "").trim();
        if (!v || getModePool(dim).includes(v)) return;
        update(path, [...getModePool(dim), v]);
        setModePoolUI(s => ({ ...s, addText: { ...s.addText, [dim]: "" } }));
      };
      const genModeSeed = async (dim) => {
        setModePoolUI(s => ({ ...s, gen: { ...s.gen, [dim]: true }, genErr: { ...s.genErr, [dim]: null } }));
        try {
          const resp = await fetch("/api/generate-seed", {
            method: "POST", headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ dimension: dim, existing: getModePool(dim), mode_id: "code" }),
          });
          const data = await resp.json();
          if (!resp.ok) throw new Error(data.detail || "生成失败");
          const v = (data.seed || "").trim();
          if (!v) throw new Error("模型返回为空");
          const path = modePoolPath(dim);
          if (path && !getModePool(dim).includes(v)) update(path, [...getModePool(dim), v]);
        } catch (e) {
          setModePoolUI(s => ({ ...s, genErr: { ...s.genErr, [dim]: e.message } }));
        } finally {
          setModePoolUI(s => ({ ...s, gen: { ...s.gen, [dim]: false } }));
        }
      };
      const refreshModeSeeds = async () => {
        const idx = codeModeIdx();
        if (idx < 0) return;
        setModeRefreshing(true); setModeRefreshErr(null);
        try {
          const resp = await fetch("/api/seed/refresh-all", {
            method: "POST", headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ mode_id: "code" }),
          });
          const data = await resp.json();
          if (!resp.ok) throw new Error(data.detail || "刷新失败");
          update(`modes.${idx}.pool`, data.pool);
        } catch (e) {
          setModeRefreshErr(e.message);
        } finally {
          setModeRefreshing(false);
        }
      };

      // 每个模型槽位的「获取模型列表」状态：以 basePath 为 key 存 {models, fetching, err}
      const [slotState, setSlotState] = useState({});
      const fetchModels = async (basePath, keyMap) => {
        setSlotState(s => ({ ...s, [basePath]: { ...(s[basePath]||{}), fetching: true, err: null } }));
        try {
          // 嵌套解析 basePath（如 "agents.creative"），避免 config["agents.creative"] 直接索引为 undefined
          const resolve = (path, obj) => path.split(".").reduce((acc, k) => (acc && acc[k] !== undefined ? acc[k] : undefined), obj) || {};
          const node = resolve(basePath, config);
          const body = {
            base_url: node[keyMap.base_url] || config.global?.default_base_url || "",
            api_key: node[keyMap.api_key] || config.global?.default_api_key || "",
          };
          const resp = await fetch("/api/models", {
            method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body),
          });
          const data = await resp.json();
          if (!resp.ok) throw new Error(data.detail || "获取失败");
          setSlotState(s => ({ ...s, [basePath]: { models: data.models || [], fetching: false, err: null } }));
        } catch (e) {
          setSlotState(s => ({ ...s, [basePath]: { ...(s[basePath]||{}), fetching: false, err: e.message } }));
        }
      };

      // 渲染一个模型配置组（base_url + api_key + 模型下拉/手填）
      // ---- 模型/音色选择器：有选项列表时用 <select>（可随时改选）；下拉恒含「自定义…」项，
      // 选择后显示手填输入框（保留自由输入）；无列表时退化为单个普通输入框 ----
      const [customSel, setCustomSel] = useState({});
      const picker = ({ key, value, options, onPick, placeholder, emptyLabel }) => {
        const v = (value || "").trim();
        const opts = options || [];
        if (opts.length === 0) {
          return html`<input value=${v} placeholder=${placeholder || "手填"} onInput=${e => onPick(e.target.value)} style=${{ flex: 1 }} />`;
        }
        const inList = opts.includes(v);
        const isCustom = !!customSel[key];
        const effective = isCustom || (v !== "" && !inList);
        const selValue = effective ? "__custom__" : v;
        return html`
          <div style=${{ display: "flex", gap: "6px", flex: 1, minWidth: 0 }}>
            <select value=${selValue}
              onInput=${e => { const sv = e.target.value; if (sv === "__custom__") { setCustomSel(m => ({ ...m, [key]: true })); } else { setCustomSel(m => ({ ...m, [key]: false })); onPick(sv); } }}
              style=${{ flex: 1, minWidth: 0, height: "36px", background: "var(--panel-2)", color: "var(--text)", border: "1px solid var(--border)", borderRadius: "8px", padding: "0 8px", fontSize: 13 }}>
              ${!effective && v === "" ? html`<option value="">${emptyLabel || "（留空）"}</option>` : ""}
              <option value="__custom__">（自定义…）</option>
              ${opts.map(o => html`<option value=${o} selected=${o === v}>${o}</option>`)}
            </select>
            ${effective ? html`<input value=${v} placeholder=${placeholder || "自定义"} onInput=${e => { const newValue = e.target.value; onPick(newValue); if (opts.includes(newValue.trim())) { setCustomSel(m => ({ ...m, [key]: false })); } }} style=${{ flex: 1 }} />` : ""}
          </div>`;
      };

      const renderModelSlot = ({ title, basePath, keyMap, config, update }) => {
        // 嵌套解析 basePath（如 "agents.creative"），避免 config["agents.creative"] 直接索引为 undefined
        const node = basePath.split(".").reduce((acc, k) => (acc && acc[k] !== undefined ? acc[k] : undefined), config) || {};
        const st = slotState[basePath] || {};
        const getv = k => node[keyMap[k]] || "";
        const setv = (k, v) => update(basePath + "." + keyMap[k], v);
        return html`
          <div class="section-title">${title}</div>
          <div class="config-form">
            <div class="form-row"><label>API Base URL</label>
              <input value=${getv("base_url")} onInput=${e => setv("base_url", e.target.value)} placeholder="留空=用全局默认" /></div>
            <div class="form-row"><label>API Key</label>
              <input type="password" value=${getv("api_key")} onInput=${e => setv("api_key", e.target.value)} placeholder="留空=用全局默认" /></div>
            <div class="form-row"><label>模型 model（填好上方 base_url / key 后可点按钮拉取列表选择）</label>
              <div style=${{display:"flex", gap:"8px"}}>
                ${picker({ key: "slot-" + basePath, value: getv("model"), options: st.models || [], onPick: v => setv("model", v),
                  placeholder: "留空=用全局默认；或从下拉选 / 手填", emptyLabel: "（留空=用全局默认）" })}
                <button type="button" class="save-btn" style=${{padding:"8px 12px", whiteSpace:"nowrap"}}
                  disabled=${st.fetching} onClick=${() => fetchModels(basePath, keyMap)}>
                  ${st.fetching ? "获取中…" : "获取模型列表"}
                </button>
              </div>
              ${(st.models||[]).length > 0 && html`<div class="note">已获取 ${st.models.length} 个模型，点下拉可随时改选。</div>`}
              ${st.err && html`<div class="error">${st.err}</div>`}
            </div>
            ${thinkingSelect(getv("thinking"), v => setv("thinking", v))}
          </div>`;
      };

      // ---- 多模型卡片列表编辑器：折叠 / 手动排序↑↓ / 删除(无确认) / 新增 / 空提示 ----
      // 每个 section（如 agents.creative）在 config 中对应一个 models: [] 卡片数组，
      // 运行时按序 fallback（上一个失败自动用下一个）。折叠状态用 localStorage 持久化。
      const KNOWN_MODEL_SECTIONS = ["agents.creative","agents.planner","agents.executor","providers.image","providers.video","providers.tts","providers.game"];
      const [collapseMap, setCollapseMap] = useState({});
      useEffect(() => {
        const m = {};
        KNOWN_MODEL_SECTIONS.forEach(bp => {
          const k = "mf:collapse:" + bp;
          let v = false;
          try { v = localStorage.getItem(k) === "1"; } catch (e) { v = false; }
          m[k] = v;
        });
        setCollapseMap(m);
      }, []);
      const isCollapsed = (basePath) => !!collapseMap["mf:collapse:" + basePath];
      const toggleCollapse = (basePath) => {
        const k = "mf:collapse:" + basePath;
        const nv = !isCollapsed(basePath);
        try { localStorage.setItem(k, nv ? "1" : "0"); } catch (e) {}
        setCollapseMap(m => ({ ...m, [k]: nv }));
      };
      const resolvePath = (path, obj) =>
        path.split(".").reduce((acc, k) => (acc && acc[k] !== undefined ? acc[k] : undefined), obj) || {};
      const getModelsList = (basePath) => {
        const node = resolvePath(basePath, config);
        return (node && Array.isArray(node.models)) ? node.models : [];
      };

      const renderModelCard = (basePath, idx, card, total) => {
        const cardPath = basePath + ".models." + idx;
        const st = slotState[cardPath] || {};
        const getv = (k) => (card && card[k] != null) ? card[k] : "";
        const setv = (k, v) => update(cardPath + "." + k, v);
        const swap = (dir) => {
          const arr = getModelsList(basePath);
          const j = idx + dir;
          if (j < 0 || j >= arr.length) return;
          const next = [...arr];
          const t = next[idx]; next[idx] = next[j]; next[j] = t;
          update(basePath + ".models", next);
        };
        const del = () => {
          // 删除无需确认，直接移除该卡片
          const arr = getModelsList(basePath);
          update(basePath + ".models", arr.filter((_, i) => i !== idx));
        };
        const tv = getv("temperature");
        return html`
          <div key=${card._id || idx} class="config-form" style=${{ marginTop:"10px", border:"1px solid var(--border)", borderRadius:"10px", padding:"12px" }}>
            <div style=${{ display:"flex", justifyContent:"space-between", alignItems:"center", marginBottom:"6px" }}>
              <div class="note" style=${{ margin:0 }}>模型 #${idx + 1}</div>
              <div style=${{ display:"flex", gap:"6px" }}>
                <button type="button" class="save-btn" style=${{ padding:"4px 8px", background:"transparent", color:"var(--muted)", borderColor:"var(--border)" }}
                  disabled=${idx === 0} onClick=${() => swap(-1)} title="上移">↑</button>
                <button type="button" class="save-btn" style=${{ padding:"4px 8px", background:"transparent", color:"var(--muted)", borderColor:"var(--border)" }}
                  disabled=${idx === total - 1} onClick=${() => swap(1)} title="下移">↓</button>
                <button type="button" class="save-btn" style=${{ padding:"4px 8px", background:"var(--danger)", borderColor:"var(--danger)" }}
                  onClick=${del} title="删除（无确认）">删除</button>
              </div>
            </div>
            <div class="form-row"><label>模型 model</label>
              <div style=${{ display:"flex", gap:"8px" }}>
                ${picker({ key: "card-" + cardPath, value: getv("model"), options: st.models || [], onPick: v => setv("model", v),
                  placeholder: "模型名，如 gpt-4o-mini-tts", emptyLabel: "（手填）" })}
                <button type="button" class="save-btn" style=${{ padding:"8px 12px", whiteSpace:"nowrap" }}
                  disabled=${st.fetching} onClick=${() => fetchModels(cardPath, { model:"model", base_url:"base_url", api_key:"api_key" })}>
                  ${st.fetching ? "获取中…" : "获取列表"}</button>
              </div>
              ${(st.models || []).length > 0 && html`<div class="note">已获取 ${st.models.length} 个模型，点下拉可随时改选。</div>`}
              ${st.err && html`<div class="error">${st.err}</div>`}
            </div>
            <div class="form-row"><label>API Base URL</label>
              <input value=${getv("base_url")} onInput=${e => setv("base_url", e.target.value)} placeholder="留空=用全局默认" /></div>
            <div class="form-row"><label>API Key</label>
              <input type="password" value=${getv("api_key")} onInput=${e => setv("api_key", e.target.value)} placeholder="留空=用全局默认" /></div>
            <${TemperatureInput} id=${"temp-" + basePath + "-" + idx} value=${tv}
              onChange=${v => setv("temperature", v)} />
            ${thinkingSelect(getv("thinking"), v => setv("thinking", v))}
          </div>`;
      };

      const renderModelCards = ({ title, basePath, note }) => {
        const models = getModelsList(basePath);
        const collapsed = isCollapsed(basePath);
        const add = () => update(basePath + ".models", [...models, { _id: "card_" + Math.random().toString(36).slice(2), model:"", base_url:"", api_key:"", temperature:null, thinking:"default" }]);
        return html`
          <div class="section-title">${title}</div>
          ${note && html`<div class="note" style=${{ marginBottom: 8 }}>${note}</div>`}
          <div class="config-form">
            <div style=${{ display:"flex", justifyContent:"space-between", alignItems:"center" }}>
              <div class="note" style=${{ margin:0 }}>${models.length} 个模型 · 运行时按序 fallback（上一个失败自动用下一个）</div>
              <button type="button" class="save-btn" style=${{ padding:"6px 12px", background:"transparent", color:"var(--accent)", borderColor:"var(--accent)" }}
                onClick=${() => toggleCollapse(basePath)}>${collapsed ? "展开" : "折叠"}</button>
            </div>
            ${collapsed
              ? html`<div class="note">已折叠（共 ${models.length} 个模型）。点击「展开」编辑。</div>`
              : models.length === 0
                ? html`<div class="note" style=${{ color:"var(--muted)" }}>暂无模型卡片。若留空：Agent 执行回退全局默认模型；Provider 图片/视频回退另一 Provider 置顶项；TTS 回退免费 Edge TTS。</div>`
                : models.map((card, idx) => renderModelCard(basePath, idx, card, models.length))}
            <button type="button" class="save-btn" style=${{ marginTop:"8px" }} onClick=${add}>+ 添加模型</button>
          </div>`;
      };

      const g = config?.global || {};
      const rnd = config?.randomness || {};
      const tp = config?.providers?.tts || {};

      return html`
        <div class="app">
          <header class="topbar">
            <h1>AI 盲盒</h1>
            <div class="tabs">
              <div class=${"tab " + (tab === "box" ? "active" : "")} onClick=${() => setTab("box")}>开盲盒</div>
              <div class=${"tab " + (tab === "history" ? "active" : "")} onClick=${() => { setTab("history"); loadHistory(); }}>历史</div>
              <div class=${"tab " + (tab === "stats" ? "active" : "")} onClick=${() => { setTab("stats"); loadStats(); }}>统计</div>
              <div class=${"tab " + (tab === "config" ? "active" : "")} onClick=${() => setTab("config")}>配置</div>
            </div>
          </header>
          <div class="banner">免构建演示页：用 preact + htm（已打包到本地 frontend/vendor，无需联网），无需 npm install。生产版请用 Vite 工程（npm install 后 npm run dev）。</div>

          <${ErrorBoundary}>
          ${tab === "box" && html`
            <div class="section-title">选择模式</div>
            <div class="mode-grid">
              ${modes.map(m => html`
                <div key=${m.id} class=${"mode-card " + (selected === m.id ? "selected" : "")}
                     onClick=${() => setSelected(m.id)}>
                  <div class="name">${m.name}</div>
                  <div class="desc">${m.executor_type}</div>
                </div>`)}
            </div>
            <div class="control-card">
              <div class="seed-edit">
                <input
                  class="seed-input"
                  value=${customSeed}
                  placeholder="自定义种子（可选）：手写灵感词，锁定开盒方向，如「赛博茶馆 雨天」"
                  onInput=${(e) => setCustomSeed(e.target.value)}
                />
