[pytest]
# 只收集 tests/ 下的 pytest 用例。
#
# 为什么需要这条：backend/ 根目录的 test_game_regression.py 与
# test_game_scroll_regression.py 是「独立回归脚本」（直接 python xxx.py 运行，
# __main__ 里自己打印汇总），但函数名以 test_ 开头，会被 pytest 一并收集。
# 它们在**模块导入阶段**就执行 config.SETTINGS.raw["mock"] = True 且从不还原，
# 于是全局单例被永久切成 mock 模式，污染其后所有用例
# （典型症状：test_run_tts_cloud_fail_fallback_edge 拿到 .wav 而不是 .mp3）。
#
# 限定 testpaths 后，pytest 不再导入这两个脚本，脚本单独运行的行为完全不变。
testpaths = tests
